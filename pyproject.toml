[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  "tests/fixtures",
  "data",
  "assets/data",
]

[tool.ruff.lint]
# Socle global anti-erreurs. Les règles de style plus larges sont activées sur
# les modules déjà repris, puis étendues à mesure de leur découpage.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
"cyberwatch/config.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = [
  "cyberwatch/production.py",
  "cyberwatch/location_resolution.py",
  "cyberwatch/runner_dedup.py",
  "cyberwatch/runner_ingestion.py",
  "cyberwatch/runner_source_facts.py",
  "cyberwatch/runner_support.py",
  "cyberwatch/site_status.py",
  "cyberwatch/site_window.py",
  "cyberwatch/sector_resolution.py",
  "cyberwatch/sector_semantic.py",
  "cyberwatch/source_facts_ai_retry.py",
  "cyberwatch/source_facts_retry.py",
  "scripts/audit_sectors.py",
  "scripts/code_health.py",
  "scripts/git_governance_audit.py",
]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
follow_imports = "skip"
ignore_missing_imports = true
show_error_codes = true
