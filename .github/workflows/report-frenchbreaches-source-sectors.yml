name: Report FrenchBreaches source sectors
on:
  push:
    paths:
      - '.github/workflows/report-frenchbreaches-source-sectors.yml'
      - 'sources/veillellm/report_frenchbreaches_source_sectors.py'
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python sources/veillellm/report_frenchbreaches_source_sectors.py
