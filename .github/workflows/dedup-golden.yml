name: Dedup Golden

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-dedup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Intégrité des références golden
        run: python -m pytest tests/test_dedup_golden_integrity.py tests/test_dedup_golden_refs.py -q
      - name: Certifier la déduplication
        run: python scripts/evaluate_dedup_golden.py
      - name: Vérifier la migration vers références stables
        run: |
          python scripts/migrate_dedup_golden_refs.py --output /tmp/dedup_golden_stable.csv
          python scripts/evaluate_dedup_golden.py \
            --golden /tmp/dedup_golden_stable.csv \
            --require-stable-refs
