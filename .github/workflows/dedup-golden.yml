name: Dedup Golden

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-dedup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Intégrité du Golden V2
        run: python -m pytest tests/test_dedup_golden_integrity.py tests/test_dedup_golden_refs.py tests/test_dedup_golden_v2.py -q
      - name: Certifier la déduplication stable V2
        run: python scripts/evaluate_dedup_golden.py --require-stable-refs
      - name: Vérifier l'idempotence du corpus V2
        run: |
          cp data/golden/dedup_golden.csv /tmp/dedup_golden_before.csv
          cp data/golden/dedup_reviewed_v2.csv /tmp/dedup_reviews_before.csv
          python scripts/promote_dedup_golden_v2.py --target-cases 150
          cmp /tmp/dedup_golden_before.csv data/golden/dedup_golden.csv
          cmp /tmp/dedup_reviews_before.csv data/golden/dedup_reviewed_v2.csv
      - name: Vérifier l'idempotence des références stables
        run: |
          python scripts/migrate_dedup_golden_refs.py --output /tmp/dedup_golden_stable.csv
          cmp data/golden/dedup_golden.csv /tmp/dedup_golden_stable.csv
          python scripts/evaluate_dedup_golden.py \
            --golden /tmp/dedup_golden_stable.csv \
            --require-stable-refs
      - name: Certifier deux rebuilds consécutifs
        run: python scripts/certify_dedup_closeout.py
