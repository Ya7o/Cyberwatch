name: Ops request

on:
  push:
    branches: [main]
    paths:
      - ".github/rebuild-request"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Lire et lancer le mode demandé
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mode=$(sed -n 's/^mode=//p' .github/rebuild-request | tail -n 1)
          echo "mode=$mode"
          case "$mode" in
            update)
              gh workflow run collect.yml --ref main -f mode=maj -f layers=all
              ;;
            rebuild-cache)
              gh workflow run rebuild.yml --ref main -f layers=all
              ;;
            rebuild-full)
              gh workflow run rebuild-baseline-once.yml --ref main
              ;;
            *)
              echo "Mode invalide: '$mode' (attendu: update, rebuild-cache, rebuild-full)" >&2
              exit 1
              ;;
          esac
