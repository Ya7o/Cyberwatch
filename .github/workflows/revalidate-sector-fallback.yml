name: Revalidate sector qualifications

on:
  push:
    branches: [main]
    paths:
      - 'cyberwatch/source_llm_fallback.py'
      - 'cyberwatch/sector_fallback_migration.py'
      - 'cyberwatch/qualification.py'
      - 'cyberwatch/sector.py'
      - 'cyberwatch/sector_registry.py'
      - 'cyberwatch/sector_registry_safety.py'
      - 'cyberwatch/config.py'
      - 'cyberwatch/quality.py'
      - 'data/sector_auto_policy.json'
      - 'data/enrichment_reference.csv'
      - 'data/org_enrichment_cache.csv'
      - 'scripts/audit_sector_coverage.py'
      - 'scripts/evaluate_sector_registry.py'
      - 'scripts/check_sector_registry_policy.py'
      - 'sources/veillellm/cyberattaque_org_2026.json'
      - 'sources/veillellm/frenchbreaches_2026.json'
      - '.github/workflows/revalidate-sector-fallback.yml'

permissions:
  contents: write

# Revalidation et enrichissement publient les mêmes artefacts canoniques : ils
# doivent être strictement sérialisés pour éviter les add/add et les rebases de
# snapshots concurrents.
concurrency:
  group: sector-canonical-pipeline
  cancel-in-progress: false

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Golden avant requalification
        run: |
          python scripts/evaluate_golden.py \
            --details /tmp/golden-before.csv \
            --json /tmp/golden-before.json

      - name: Revalider les qualifications
        run: python -m cyberwatch backfill-unknowns

      - name: Matérialiser registre et file Sector
        run: |
          python scripts/audit_sector_coverage.py
          python scripts/audit_sector_coverage.py --output "" >> "$GITHUB_STEP_SUMMARY"

      - name: Vérifier précision et politique
        run: |
          python scripts/evaluate_golden.py \
            --details /tmp/golden-after.csv \
            --json /tmp/golden-after.json
          python scripts/check_sector_golden_regression.py \
            /tmp/golden-before.json /tmp/golden-after.json
          python scripts/evaluate_sector_registry.py --json /tmp/sector-registry.json
          python scripts/check_sector_registry_policy.py --json /tmp/sector-registry.json

      - name: Vérifier le snapshot
        run: |
          python -m cyberwatch check --allow-uninitialized
          python -m cyberwatch test-repeat

      - name: Publier le snapshot revalidé
        run: |
          git config user.name "cyberwatch-bot"
          git config user.email "cyberwatch-bot@users.noreply.github.com"
          git add \
            data/items.csv \
            data/incidents.csv \
            data/incident_id_registry.csv \
            data/qualification_provenance.csv \
            data/sector_quality.json \
            data/organisation_sector_registry.csv \
            data/sector_enrichment_queue.csv \
            data/snapshot.json \
            assets/data
          if git diff --cached --quiet; then
            echo "Aucune qualification à republier."
            exit 0
          fi
          git commit -m "Revalidate sector qualifications"
          git pull --rebase origin main
          git push origin HEAD:main
