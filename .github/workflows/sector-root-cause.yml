name: Sector root cause diagnosis
run-name: "Sector root cause — ${{ github.event_name }} — main"

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sector-root-cause.yml'
      - 'scripts/diagnose_sector_root_cause.py'
      - 'cyberwatch/company_evidence.py'
      - 'cyberwatch/company_subject_evidence.py'
      - 'cyberwatch/official_site_discovery.py'
      - 'cyberwatch/sector_registry.py'
      - 'cyberwatch/sector_registry_safety.py'
      - 'data/org_enrichment_cache.csv'
      - 'data/organisation_sector_registry.csv'
      - 'data/source_facts.csv'
  workflow_dispatch:
    inputs:
      organisation_key:
        description: "Organisation_Key à diagnostiquer"
        required: false
        default: "eiffage"
        type: string
      organisation:
        description: "Nom d'organisation"
        required: false
        default: "Eiffage"
        type: string

permissions:
  contents: read

concurrency:
  group: sector-root-cause-diagnosis
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Diagnostiquer le dernier mismatch Sector
        env:
          TARGET_KEY: ${{ inputs.organisation_key || 'eiffage' }}
          TARGET_ORG: ${{ inputs.organisation || 'Eiffage' }}
        run: |
          set -euo pipefail
          echo "SECTOR_ROOT_CAUSE_TARGET key=$TARGET_KEY organisation=$TARGET_ORG"
          python scripts/diagnose_sector_root_cause.py \
            --key "$TARGET_KEY" \
            --organisation "$TARGET_ORG" \
            --json /tmp/sector-root-cause.json
      - name: Résumé root cause
        if: always()
        run: |
          echo "## Sector root cause diagnosis" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/sector-root-cause.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('/tmp/sector-root-cause.json', encoding='utf-8'))
          print(f"Target: {d['organisation']} ({d['organisation_key']})")
          print(f"Root cause stage: **{d['root_cause_stage']}**")
          print(f"Candidates discovered: {len(d.get('candidates') or [])}")
          r=d.get('resolved_official')
          print('Official resolver: ' + (f"{r['sector']} — {r['url']}" if r else 'NONE'))
          reg=d.get('registry_current') or {}
          print(f"Registry current: decision={reg.get('Decision')} sector={reg.get('Sector')} evidence={reg.get('Evidence_Types')}")
          PY
          else
            echo "Diagnostic JSON absent" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Archiver la preuve root cause
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sector-root-cause-${{ github.run_id }}
          path: /tmp/sector-root-cause.json
          if-no-files-found: error
          retention-days: 30
