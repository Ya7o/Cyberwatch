name: Release v0.7.34 (one-shot)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v0.7.34-once.yml"

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'Ya7o/Cyberwatch'
    runs-on: ubuntu-latest
    steps:
      - name: Publier la release v0.7.34
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v0.7.34 --repo "$REPO" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v0.7.34 \
            --repo "$REPO" \
            --target 08bede83dba030a03a75a6d1dd886aa907ba0392 \
            --title "v0.7.34 — enrichissement éditorial des faits source" \
            --notes-file - <<'EOF'
          Enrichissement des faits publiés par les sources, sans modifier le pipeline canonique Threat / Sector / Location.

          - FrenchBreaches : hydratation non bloquante de la page détaillée, priorité aux faits natifs structurés, puis enrichissement éditorial LLM.
          - Cyberattaque.org : compréhension LLM-first des faits éditoriaux, avec preuves textuelles obligatoires et validation déterministe des quantités, volumes et fichiers.
          - LLM source-facts séparé, mis en cache et borné en coût ; aucun OpenAI Search.
          - BonjourLaFuite : récupération du volume humain même quand les types de données sont présents et conversion déterministe des pastilles de statut.
          - Dashboard : lecture immédiate de la sensibilité des données — gris non qualifié, orange données personnelles, rouge données sensibles.
          - SOURCE_FACTS_VERSION = 3.
          - Les régressions historiques source_facts sont conservées et la priorité « fait natif > LLM » est verrouillée.
          - Validation finale : 654 tests PASS, syntaxe dashboard PASS, répétabilité PASS et contrôles structurels PASS sur 08bede83.
          EOF

      - name: Retirer ce workflow one-shot
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          path='.github/workflows/release-v0.7.34-once.yml'
          sha="$(gh api "repos/$REPO/contents/$path?ref=main" --jq .sha)"
          gh api --method DELETE "repos/$REPO/contents/$path" \
            -f message='chore: retire le workflow one-shot v0.7.34' \
            -f sha="$sha" \
            -f branch=main
