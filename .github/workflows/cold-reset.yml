name: RESET TOTAL

on:
  workflow_dispatch:
    inputs:
      reset_mode:
        description: "Mode de reconstruction"
        type: choice
        options:
          - rebuild
          - zero
        default: rebuild
      confirm_zero:
        description: "Pour zero, saisir exactement RESET"
        type: string
        default: ""
      start:
        description: "Début de reconstruction"
        type: string
        default: "2026-01-01"
      semantic_passes:
        description: "Passes sémantiques"
        type: number
        default: 1
      source_facts_passes:
        description: "Passes SourceFacts"
        type: number
        default: 1
      max_llm_cost_usd_per_pass:
        description: "Plafond LLM par passe"
        type: string
        default: "0.50"
      publish:
        description: "Publier après les checks"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cyberwatch-data-write
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Valider l'intention destructive
        env:
          RESET_MODE: ${{ inputs.reset_mode }}
          CONFIRM_ZERO: ${{ inputs.confirm_zero }}
          SEMANTIC_PASSES: ${{ inputs.semantic_passes }}
          SOURCE_FACTS_PASSES: ${{ inputs.source_facts_passes }}
        run: |
          set -euo pipefail
          if [ "$RESET_MODE" = "zero" ] && [ "$CONFIRM_ZERO" != "RESET" ]; then
            echo "Le mode zero exige confirm_zero=RESET" >&2
            exit 2
          fi
          # Une passe par canal rend le plafond total structurel :
          # qualification 900 + sémantique 400 + SourceFacts 500 = 1 800.
          if [ "$RESET_MODE" = "zero" ] && { [ "$SEMANTIC_PASSES" -ne 1 ] || [ "$SOURCE_FACTS_PASSES" -ne 1 ]; }; then
            echo "Le mode zero impose semantic_passes=1 et source_facts_passes=1 (plafond global LLM)." >&2
            exit 2
          fi
      - name: Préflight, baseline avant et archive certifiée
        run: |
          set -euo pipefail
          python -m cyberwatch.cold_reset preflight --mode "${{ inputs.reset_mode }}" | tee /tmp/reset-preflight.json
          python -m cyberwatch.cold_reset manifest \
            --mode "${{ inputs.reset_mode }}" --output /tmp/reset-before.json
          python -m cyberwatch.reset_baseline baseline --output /tmp/reset-baseline-before.json
          python -m cyberwatch.zero_reset inventory --output /tmp/zero-inventory-before.json
          python -m cyberwatch.zero_reset archive \
            --output /tmp/cyberwatch-before-reset.tgz \
            --report /tmp/zero-archive-report.json
      - name: Préparer le staging
        env:
          RESET_MODE: ${{ inputs.reset_mode }}
        run: |
          set -euo pipefail
          rm -rf /tmp/cyberwatch-reset
          mkdir -p /tmp/cyberwatch-reset
          rsync -a --exclude '.git' ./ /tmp/cyberwatch-reset/
          cd /tmp/cyberwatch-reset
          if [ "$RESET_MODE" = "zero" ]; then
            python -m cyberwatch.zero_reset purge --root . --output /tmp/zero-purge-report.json
            python -m cyberwatch.zero_reset verify --root . --output /tmp/zero-state.json
            # Dernière barrière avant tout coût de reconstruction : le staging
            # doit posséder exactement les référentiels statiques requis.
            python -m cyberwatch.zero_reset validate-bootstrap \
              --root . --output /tmp/zero-bootstrap.json
          else
            python - <<'PY'
          from pathlib import Path
          from cyberwatch.cold_reset import COLD_CACHE_FILES, DERIVED_FILES
          for name in sorted(set(COLD_CACHE_FILES + DERIVED_FILES + ('incident_id_registry.csv',))):
              (Path('data') / name).unlink(missing_ok=True)
          for path in ('items.json', 'incidents.json', 'snapshot.json'):
              (Path('assets/data') / path).unlink(missing_ok=True)
          PY
          fi
          python -m cyberwatch check --allow-uninitialized
      - name: Figer la fenêtre
        run: |
          echo "RESET_MODE=${{ inputs.reset_mode }}" >> "$GITHUB_ENV"
          echo "RESET_START=${{ inputs.start }}" >> "$GITHUB_ENV"
          echo "RESET_AS_OF=$(TZ=Indian/Reunion date --iso-8601=seconds)" >> "$GITHUB_ENV"
      - name: 1 - Reconstruction déterministe
        working-directory: /tmp/cyberwatch-reset
        env:
          OPENAI_API_KEY: ${{ secrets.Cyberwatchapi }}
          LLM_MAX_CALLS_PER_RUN: "0"
          LLM_MAX_COST_USD_PER_RUN: "0"
          AI_MAX_CALLS_PER_RUN: "0"
          SOURCE_FACTS_AI_MAX_CALLS_PER_RUN: "0"
          ORG_ENRICHMENT_ENABLED: "1"
          ORG_ENRICHMENT_MAX_CALLS_PER_RUN: "0"
          ORG_OFFICIAL_SITE_MAX_CALLS_PER_RUN: "0"
        run: python -m cyberwatch create --start "$RESET_START" --as-of "$RESET_AS_OF" --layers all
      - name: 2 - Qualification
        working-directory: /tmp/cyberwatch-reset
        env:
          OPENAI_API_KEY: ${{ secrets.Cyberwatchapi }}
          # La qualification historique passe désormais elle aussi par le
          # runtime LLM partagé : plafonds global et de tâche doivent donc
          # être ouverts ensemble (les autres tâches restent fermées).
          AI_MAX_ESTIMATED_COST_USD_PER_RUN: ${{ inputs.max_llm_cost_usd_per_pass }}
          LLM_MAX_COST_USD_PER_RUN: ${{ inputs.max_llm_cost_usd_per_pass }}
          LLM_MAX_CALLS_PER_RUN: "900"
          LLM_QUALIFICATION_MAX_CALLS_PER_RUN: "900"
          LLM_CYBERATTAQUE_SEMANTIC_MAX_CALLS_PER_RUN: "0"
          LLM_EDITORIAL_SEMANTIC_MAX_CALLS_PER_RUN: "0"
          LLM_SOURCE_FACTS_MAX_CALLS_PER_RUN: "0"
          SOURCE_FACTS_AI_MAX_CALLS_PER_RUN: "0"
          AI_MAX_CALLS_PER_RUN: "900"
          ORG_ENRICHMENT_MAX_CALLS_PER_RUN: "0"
        run: |
          python -m cyberwatch create --start "$RESET_START" --as-of "$RESET_AS_OF" --layers all
          cp data/ai_usage.csv /tmp/reset-ai-qualification.csv
      - name: 3 - Sémantique
        working-directory: /tmp/cyberwatch-reset
        env:
          OPENAI_API_KEY: ${{ secrets.Cyberwatchapi }}
          LLM_MAX_COST_USD_PER_RUN: ${{ inputs.max_llm_cost_usd_per_pass }}
          LLM_MAX_CALLS_PER_RUN: "400"
          LLM_QUALIFICATION_MAX_CALLS_PER_RUN: "0"
          AI_MAX_CALLS_PER_RUN: "0"
          LLM_SOURCE_FACTS_MAX_CALLS_PER_RUN: "0"
          SOURCE_FACTS_AI_MAX_CALLS_PER_RUN: "0"
          LLM_CYBERATTAQUE_SEMANTIC_MAX_CALLS_PER_RUN: "200"
          LLM_EDITORIAL_SEMANTIC_MAX_CALLS_PER_RUN: "200"
          ORG_ENRICHMENT_MAX_CALLS_PER_RUN: "0"
        shell: bash
        run: |
          for i in $(seq 1 "${{ inputs.semantic_passes }}"); do
            python -m cyberwatch create --start "$RESET_START" --as-of "$RESET_AS_OF" --layers all
          done
          if [ -f data/llm_usage.json ]; then
            cp data/llm_usage.json /tmp/reset-llm-semantic.json
          else
            printf '{}\n' > /tmp/reset-llm-semantic.json
          fi
      - name: 4 - SourceFacts
        working-directory: /tmp/cyberwatch-reset
        env:
          OPENAI_API_KEY: ${{ secrets.Cyberwatchapi }}
          LLM_MAX_COST_USD_PER_RUN: ${{ inputs.max_llm_cost_usd_per_pass }}
          LLM_MAX_CALLS_PER_RUN: "500"
          LLM_QUALIFICATION_MAX_CALLS_PER_RUN: "0"
          AI_MAX_CALLS_PER_RUN: "0"
          LLM_CYBERATTAQUE_SEMANTIC_MAX_CALLS_PER_RUN: "0"
          LLM_EDITORIAL_SEMANTIC_MAX_CALLS_PER_RUN: "0"
          LLM_SOURCE_FACTS_MAX_CALLS_PER_RUN: "500"
          SOURCE_FACTS_AI_MAX_CALLS_PER_RUN: "500"
          SOURCE_FACTS_AI_MAX_COST_USD_PER_RUN: ${{ inputs.max_llm_cost_usd_per_pass }}
          ORG_ENRICHMENT_MAX_CALLS_PER_RUN: "0"
        shell: bash
        run: |
          for i in $(seq 1 "${{ inputs.source_facts_passes }}"); do
            python -m cyberwatch create --start "$RESET_START" --as-of "$RESET_AS_OF" --layers all
          done
          if [ -f data/source_facts_ai_usage.json ]; then
            cp data/source_facts_ai_usage.json /tmp/reset-source-facts.json
          else
            printf '{}\n' > /tmp/reset-source-facts.json
          fi
      - name: 5 - Enrichissement organisations
        working-directory: /tmp/cyberwatch-reset
        env:
          OPENAI_API_KEY: ${{ secrets.Cyberwatchapi }}
          LLM_MAX_CALLS_PER_RUN: "0"
          LLM_MAX_COST_USD_PER_RUN: "0"
          AI_MAX_CALLS_PER_RUN: "0"
          SOURCE_FACTS_AI_MAX_CALLS_PER_RUN: "0"
          ORG_ENRICHMENT_ENABLED: "1"
          ORG_ENRICHMENT_MAX_CALLS_PER_RUN: "200"
          ORG_OFFICIAL_SITE_MAX_CALLS_PER_RUN: "0"
        run: python -m cyberwatch create --start "$RESET_START" --as-of "$RESET_AS_OF" --layers all
      - name: Contrôler le budget LLM global
        working-directory: /tmp/cyberwatch-reset
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          def number(value):
              try:
                  return float(value or 0)
              except (TypeError, ValueError):
                  return 0.0

          qualification = {"calls": 0, "success": 0, "failure": 0, "tokens": 0, "cost_usd": 0.0, "duration_seconds": 0.0}
          path = Path("/tmp/reset-ai-qualification.csv")
          if path.exists():
              rows = list(csv.DictReader(path.open(encoding="utf-8", newline="")))
              if rows:
                  row = rows[-1]
                  qualification = {
                      "calls": int(number(row.get("Calls_Attempted"))),
                      "success": int(number(row.get("Calls_Succeeded"))),
                      "failure": int(number(row.get("Calls_Failed"))),
                      "tokens": int(number(row.get("Total_Tokens"))),
                      "cost_usd": number(row.get("Estimated_Cost_USD")),
                      "duration_seconds": number(row.get("Duration_s")),
                  }

          def load(path):
              try:
                  return json.loads(Path(path).read_text(encoding="utf-8"))
              except (OSError, ValueError, TypeError):
                  return {}

          semantic_raw = load("/tmp/reset-llm-semantic.json")
          semantic = {
              "calls": int(number(semantic_raw.get("calls_attempted"))),
              "success": int(number(semantic_raw.get("calls_succeeded"))),
              "failure": int(number(semantic_raw.get("calls_failed"))),
              "tokens": int(number(semantic_raw.get("total_tokens"))),
              "cost_usd": number(semantic_raw.get("estimated_cost_usd")),
              "duration_seconds": number(semantic_raw.get("duration_seconds")),
          }
          source_raw = load("/tmp/reset-source-facts.json")
          source_facts = {
              "calls": int(number(source_raw.get("calls_attempted"))),
              "success": int(number(source_raw.get("calls_success"))),
              "failure": int(number(source_raw.get("calls_failed"))),
              "tokens": int(number(source_raw.get("input_tokens"))) + int(number(source_raw.get("output_tokens"))),
              "cost_usd": number(source_raw.get("estimated_cost_usd")),
              "duration_seconds": number(source_raw.get("total_duration_seconds")),
          }
          channels = {"qualification": qualification, "semantic": semantic, "source_facts": source_facts}
          totals = {key: sum(channel[key] for channel in channels.values()) for key in qualification}
          report = {
              "limits": {"calls": 2000, "cost_usd": 2.0},
              "channels": channels,
              "totals": {**totals, "cost_usd": round(totals["cost_usd"], 6), "duration_seconds": round(totals["duration_seconds"], 3)},
              "verdict": "PASS" if totals["calls"] <= 2000 and totals["cost_usd"] <= 2.0 else "FAIL",
          }
          Path("/tmp/reset-llm-budget.json").write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False))
          if report["verdict"] != "PASS":
              raise SystemExit("Plafond LLM global dépassé")
          PY
      - name: Dev checks et dashboard
        working-directory: /tmp/cyberwatch-reset
        run: |
          set -euo pipefail
          python -m pytest tests/ -q
          node --check assets/shared.js
          node --check assets/dashboard.js
          node --check assets/dashboard-v2.js
          python -m cyberwatch check
          python -m cyberwatch build-site
          python -m cyberwatch check
      - name: Audit post-reset et baseline officielle
        working-directory: /tmp/cyberwatch-reset
        run: |
          set -euo pipefail
          python -m cyberwatch.reset_baseline audit \
            --before /tmp/reset-baseline-before.json \
            --output /tmp/reset-audit.json
          python -m cyberwatch.reset_baseline baseline \
            --output data/post_reset_baseline.json
          # Les métriques ne doivent pas exister uniquement dans le résumé de
          # job : l'API n'expose pas GITHUB_STEP_SUMMARY, or ce sont elles qui
          # tranchent le Go/No-Go d'un reset.
          python - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(Path('/tmp/reset-audit.json').read_text())
          after = audit['after']
          volume, coverage = after['volume'], after['item_coverage']
          print(f"AUDIT verdict={audit['verdict']}")
          print(f"AUDIT items={volume['items']} incidents={volume['incidents']}"
                f" dup_items={volume['duplicate_item_ids']}"
                f" dup_incidents={volume['duplicate_incident_ids']}")
          for field in ('threat', 'sector', 'location'):
              print(f"AUDIT coverage_{field}={coverage[field]['known_pct']}%")
          llm = after.get('llm') or {}
          budget = json.loads(Path('/tmp/reset-llm-budget.json').read_text())
          print(f"AUDIT llm_last_pass_calls={llm.get('calls_attempted', 0)}"
                f" cost_usd={llm.get('estimated_cost_usd', 0)}")
          print(f"AUDIT llm_total_calls={budget['totals']['calls']}"
                f" cost_usd={budget['totals']['cost_usd']}"
                f" verdict={budget['verdict']}")
          for key, value in (audit.get('deltas') or {}).items():
              print(f"AUDIT delta_{key}={value}")
          for warning in audit['blockers'] + audit['warnings']:
              print(f"AUDIT note: {warning}")
          PY
      - name: Manifeste final
        working-directory: /tmp/cyberwatch-reset
        run: python -m cyberwatch.cold_reset manifest --mode "$RESET_MODE" --output /tmp/reset-after.json
      - name: Résumé du reset
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path

          audit = json.loads(Path('/tmp/reset-audit.json').read_text())
          after = audit['after']
          volume = after['volume']
          coverage = after['item_coverage']
          llm = after.get('llm') or {}
          budget = json.loads(Path('/tmp/reset-llm-budget.json').read_text())
          print('## Cyberwatch — reset total')
          print()
          print(f"- Mode : **{os.environ['RESET_MODE']}**")
          print(f"- Début : `{os.environ['RESET_START']}`")
          print(f"- Cutoff : `{os.environ['RESET_AS_OF']}`")
          print(f"- Verdict audit : **{audit['verdict']}**")
          print(f"- Items : **{volume['items']}**")
          print(f"- Incidents : **{volume['incidents']}**")
          print(f"- Threat connu : **{coverage['threat']['known_pct']}%**")
          print(f"- Sector connu : **{coverage['sector']['known_pct']}%**")
          print(f"- Location connue : **{coverage['location']['known_pct']}%**")
          print(f"- LLM total : **{budget['totals']['calls']} appels**, **${budget['totals']['cost_usd']:.4f}** (plafond : 2 000 / $2.00)")
          for channel, values in budget['channels'].items():
              print(f"  - {channel} : {values['calls']} appels · {values['success']} succès · {values['failure']} échecs · ${values['cost_usd']:.4f} · {values['duration_seconds']:.1f}s")
          if os.environ['RESET_MODE'] == 'zero':
              zero = json.loads(Path('/tmp/zero-state.json').read_text())
              bootstrap = json.loads(Path('/tmp/zero-bootstrap.json').read_text())
              print(f"- État après purge : **{zero['verdict']}**")
              print(f"- Bootstrap avant reconstruction : **{bootstrap['verdict']}**")
              print('- Registres/caches/historiques antérieurs : **non réinjectés**')
              print('- Référentiels statiques conservés :')
              for name in bootstrap['required']:
                  print(f'  - `{name}`')
          if audit['warnings']:
              print()
              print('### Variations à examiner')
              for warning in audit['warnings']:
                  print(f'- {warning}')
          print()
          print('Archive pré-reset, inventaires, manifests, audit et baseline finale sont joints comme artifact.')
          PY
      - name: Exporter archive et résultat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reset-total-${{ inputs.reset_mode }}-${{ github.run_id }}
          path: |
            /tmp/cyberwatch-before-reset.tgz
            /tmp/zero-archive-report.json
            /tmp/zero-inventory-before.json
            /tmp/zero-purge-report.json
            /tmp/zero-state.json
            /tmp/zero-bootstrap.json
            /tmp/reset-preflight.json
            /tmp/reset-before.json
            /tmp/reset-baseline-before.json
            /tmp/reset-audit.json
            /tmp/reset-ai-qualification.csv
            /tmp/reset-llm-semantic.json
            /tmp/reset-source-facts.json
            /tmp/reset-llm-budget.json
            /tmp/reset-after.json
            /tmp/cyberwatch-reset/data/post_reset_baseline.json
            /tmp/cyberwatch-reset/data/
            /tmp/cyberwatch-reset/assets/data/
          if-no-files-found: warn
          retention-days: 30
      - name: Figer la référence pré-zero
        if: ${{ inputs.publish && inputs.reset_mode == 'zero' }}
        run: |
          set -euo pipefail
          # `git tag -a` exige une identité de tagger. Elle doit être posée ici :
          # cette étape précède la publication, donc elle ne peut pas hériter de
          # la configuration faite plus bas.
          git config user.name "cyberwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="archive/pre-zero-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git tag -a "$tag" "$GITHUB_SHA" -m "Cyberwatch state before zero reset"
          git push origin "$tag"
          echo "ARCHIVE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Publier
        if: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          rsync -a --delete /tmp/cyberwatch-reset/data/ data/
          rsync -a --delete /tmp/cyberwatch-reset/assets/data/ assets/data/
          git config user.name "cyberwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/data
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "data: ${RESET_MODE} reset et baseline post-reset"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
