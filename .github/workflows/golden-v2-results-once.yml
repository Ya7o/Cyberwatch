name: Golden v2 results (one-shot)

on:
  push:
    branches: [agent/golden-v2-hardening]

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/golden-v2-hardening
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Auditer et comparer v1 / v2
        run: |
          set -euo pipefail
          OUT=bench/results/golden_v2
          mkdir -p "$OUT"

          python scripts/audit_golden.py \
            --findings "$OUT/quality_findings.csv" \
            --json "$OUT/quality_summary.json" \
            --materialized "$OUT/qualification_golden_v2.csv"

          python scripts/evaluate_golden.py \
            --audit '' \
            --details "$OUT/db_v1_detail.csv" \
            --json "$OUT/db_v1_summary.json"

          python scripts/evaluate_golden.py \
            --details "$OUT/db_v2_detail.csv" \
            --json "$OUT/db_v2_summary.json"

          python scripts/evaluate_golden_challengers.py \
            --audit '' \
            --details "$OUT/challengers_v1_detail.csv" \
            --json "$OUT/challengers_v1_summary.json"

          python scripts/evaluate_golden_challengers.py \
            --details "$OUT/challengers_v2_detail.csv" \
            --json "$OUT/challengers_v2_summary.json"

      - name: Synthèse lisible
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          out = Path('bench/results/golden_v2')
          q = json.loads((out / 'quality_summary.json').read_text())
          d1 = json.loads((out / 'db_v1_summary.json').read_text())
          d2 = json.loads((out / 'db_v2_summary.json').read_text())
          c1 = json.loads((out / 'challengers_v1_summary.json').read_text())
          c2 = json.loads((out / 'challengers_v2_summary.json').read_text())

          def fields(result):
              return result['fields']

          lines = [
              '# Golden v2 — qualité et impact sur le benchmark',
              '',
              '## Qualité du juge',
              '',
              f"- cas v1 : {q['base_cases']}",
              f"- cas effectifs v2 : {q['effective_cases']}",
              f"- cas avec décision de revue close : {q['reviewed_cases']} ({q['review_coverage_pct']} %)",
              f"- champs corrigés : {q['corrected_fields']}",
              f"- doublons retirés : {q['duplicates_removed']}",
              f"- cas encore en REVIEW et exclus du score : {q['unresolved_review_cases']}",
              f"- couverture Source_URL : {q['source_url_coverage']['pct']} %",
              f"- findings restant à examiner : {q['findings_count']}",
              '',
              '## DB Cyberwatch — effet du changement de juge',
              '',
              '| Champ | v1 accuracy | v2 accuracy | delta |',
              '|---|---:|---:|---:|',
          ]
          for field in ('Secteur', 'Menace', 'Localisation'):
              a = fields(d1)[field]['accuracy_pct']
              b = fields(d2)[field]['accuracy_pct']
              lines.append(f'| {field} | {a:.1f}% | {b:.1f}% | {b-a:+.1f} pp |')

          lines += ['', '## Challengers — v1 puis v2', '']
          names = sorted(set(c1['challengers']) | set(c2['challengers']))
          for name in names:
              lines.append(f'### {name}')
              lines.append('')
              lines.append('| Champ | v1 | v2 | delta |')
              lines.append('|---|---:|---:|---:|')
              for field in ('Secteur', 'Menace', 'Localisation'):
                  a = c1['challengers'][name]['fields'][field]['accuracy_pct']
                  b = c2['challengers'][name]['fields'][field]['accuracy_pct']
                  lines.append(f'| {field} | {a:.1f}% | {b:.1f}% | {b-a:+.1f} pp |')
              lines.append('')

          (out / 'summary.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Publier les résultats et supprimer le workflow temporaire
        run: |
          set -euo pipefail
          git config user.name cyberwatch-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bench/results/golden_v2
          git rm .github/workflows/golden-v2-results-once.yml
          git commit -m "bench: publish golden v2 quality and comparison"
          git push origin HEAD:agent/golden-v2-hardening
