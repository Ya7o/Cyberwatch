name: Dedup V2 Materialize

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref || 'codex/dedup-final-certification' }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh Golden V2
        run: python scripts/promote_dedup_golden_v2.py --target-cases 150 --refresh
      - name: Commit refreshed corpus
        run: |
          if git diff --quiet -- data/golden/dedup_golden.csv data/golden/dedup_reviewed_v2.csv; then
            echo "Golden V2 already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/golden/dedup_golden.csv data/golden/dedup_reviewed_v2.csv
          git commit -m "Refresh final dedup Golden V2 corpus"
          git push origin HEAD:codex/dedup-final-certification
