    r"usurpation|exfiltrat|extract(?:ion|[ée]e?)|vol(?:[ée]e|er)?|fuite|diffus(?:ion|[ée]e)|publi(?:cation|[ée]e)|"
    r"mis(?:e)?\\s+en\\s+vente|chiffr(?:ement|[ée]e)|ransomware|ran[cç]ongiciel|malware)\\b",
