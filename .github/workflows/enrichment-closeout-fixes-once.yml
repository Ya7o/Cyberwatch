          text = replace_func(text, '_deterministic_impact', '''def _deterministic_impact(context: str) -> dict | None:
    for segment in re.split(r"(?<=[.!?;])\\s+|\\n+", context or ""):
        cleaned = " ".join(segment.split()).strip()
