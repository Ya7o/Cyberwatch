name: Enrichment Closeout Fixes Once

on:
  push:
    branches:
      - agent/enrichment-closeout-fixes-20260817
    paths:
      - '.github/workflows/enrichment-closeout-fixes-once.yml'

permissions:
  contents: write

jobs:
  fix-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/enrichment-closeout-fixes-20260817
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply targeted code fixes
        run: |
          PYTHONPATH="$PWD" python .github/scripts/apply_enrichment_closeout.py
          PYTHONPATH="$PWD" python .github/scripts/apply_enrichment_closeout_v2.py
          PYTHONPATH="$PWD" python .github/scripts/apply_enrichment_closeout_v3.py
          PYTHONPATH="$PWD" python .github/scripts/apply_enrichment_closeout_v4.py

      - name: Test code before data refresh
        run: |
          PYTHONPATH="$PWD" pytest -q tests/test_source_facts_ai.py tests/test_source_facts.py tests/test_site_source_facts.py tests/test_enrichment_closeout.py
          python -m cyberwatch check
          python -m cyberwatch test-repeat

      - name: Refresh SourceFacts with cache reuse
        env:
          OPENAI_API_KEY: ${{ secrets.Cyberwatchapi }}
          SOURCE_FACTS_AI_MAX_CALLS_PER_RUN: '100'
          SOURCE_FACTS_AI_MAX_COST_USD_PER_RUN: '0.20'
          SOURCE_FACTS_AI_PROGRESS_EVERY: '25'
        run: PYTHONPATH="$PWD" python .github/scripts/refresh_enrichment_closeout.py

      - name: Final closeout audit
        run: |
          PYTHONPATH="$PWD" python .github/scripts/audit_enrichment_closeout.py
          python -m cyberwatch check
          python -m cyberwatch test-repeat
          PYTHONPATH="$PWD" pytest -q tests/test_source_facts_ai.py tests/test_source_facts.py tests/test_site_source_facts.py tests/test_enrichment_closeout.py
          node --check assets/dashboard-audit.js

      - name: Commit closeout fixes
        run: |
          git config user.name "cyberwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/enrichment-closeout-fixes-once.yml \
                 .github/scripts/apply_enrichment_closeout.py \
                 .github/scripts/apply_enrichment_closeout_v2.py \
                 .github/scripts/apply_enrichment_closeout_v3.py \
                 .github/scripts/apply_enrichment_closeout_v4.py \
                 .github/scripts/refresh_enrichment_closeout.py \
                 .github/scripts/audit_enrichment_closeout.py
          git add cyberwatch/source_facts_ai.py cyberwatch/source_facts.py cyberwatch/site.py \
                  tests/test_enrichment_closeout.py data/source_facts.csv data/source_facts_ai_cache.json \
                  data/source_facts_ai_usage.json assets/data/incidents.json assets/data/status.json \
                  audit/enrichment_closeout_final.json
          git commit -m "fix: close incident enrichment quality gaps"
          git push origin HEAD:agent/enrichment-closeout-fixes-20260817
