          client = HttpClient(run_budget=Budget(config.MAX_REQUESTS_PER_RUN, config.MAX_SECONDS_PER_RUN, "source-facts-closeout"))
          known_orgs = watchlists.known_organisations()
          entity_index = watchlists.entity_index()
          territories = watchlists.entity_territories()
          reference = enrichment.load_reference()
          incoming = []
          for source_id in target_sources:
              spec = sources.by_id(source_id)
              rows = []
              outcome, collected_items, _ = run_source(
                  client, spec, context, known_orgs, entity_index, territories, reference,
                  None, None, rows,
              )
              print(f"{source_id}: {outcome.status} coverage={outcome.coverage}% items={len(collected_items)} facts={len(rows)}")
              if outcome.status != status.OK or outcome.coverage < 100:
                  raise SystemExit(f"source incomplete: {source_id} {outcome.status} {outcome.coverage}")
              incoming.extend(row for row in rows if row.get("Item_ID") in existing_ids)

          merged = source_facts.merge_source_facts(store.load_source_facts(), incoming)

          # One-time generic recovery of pre-backfill non-refreshable facts.
          baseline_sha = "580e0a42353a7bbff5ec8406a1d601696d96c29e"
          baseline_text = subprocess.check_output(["git", "show", f"{baseline_sha}:data/source_facts.csv"], text=True)
          baseline = {row["Item_ID"]: row for row in csv.DictReader(io.StringIO(baseline_text)) if row.get("Item_ID")}
          by_id = {row.get("Item_ID"): row for row in merged if row.get("Item_ID")}
          refreshable = {"Summary", "Initial_Access", "Attack_Flow_JSON", "Impact"}
          base_cols = {"Item_ID", "Source_ID", "Extraction_Method", "Extraction_Version", "Source_Metadata_JSON", "Evidence_JSON"}
          recovered = []
          for item_id, current in by_id.items():
              old = baseline.get(item_id)
              if not old:
                  continue
              current_e = json.loads(current.get("Evidence_JSON") or "{}") if current.get("Evidence_JSON") else {}
              old_e = json.loads(old.get("Evidence_JSON") or "{}") if old.get("Evidence_JSON") else {}
              changed = False
              for col, old_value in old.items():
                  if col in refreshable or col in base_cols or not old_value or current.get(col):
                      continue
                  current[col] = old_value
                  if isinstance(old_e, dict) and col in old_e:
                      current_e[col] = old_e[col]
                  changed = True
              if changed:
                  current["Evidence_JSON"] = json.dumps(current_e, ensure_ascii=False, sort_keys=True, separators=(",", ":")) if current_e else ""
                  recovered.append(item_id)
          print("legacy facts recovered:", recovered)
          store.save_source_facts([by_id[key] for key in sorted(by_id)])
          source_facts_ai._flush_runtime()
          print("AI stats:", json.dumps(source_facts_ai.runtime_stats(), ensure_ascii=False, sort_keys=True))
          site.build()
          PY

      - name: Closeout quality gate
        run: |
          python - <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          from cyberwatch import site, store

          TARGET = {"CYBERATTAQUE_ORG", "FRENCHBREACHES"}
          hedge = re.compile(r"\b(aurait|auraient|pourrait|pourraient|susceptible|susceptibles|potentiellement|probable|probablement|possible|possiblement|présumé|présumée|hypothèse|semblerait)\b", re.I)
          response = re.compile(r"\b(isol|remédi|restaur|notification|réinitial|investigation|enquête|confinement|débranch|déconnect|correctif|rotation des)\w*", re.I)
          facts = [r for r in store.load_source_facts() if r.get("Source_ID") in TARGET]
          items = store.load_items()
          incidents = json.loads(Path('assets/data/incidents.json').read_text(encoding='utf-8'))

          bad_flow = []
          bad_impact = []
          summary_missing = []
          initial_count = 0
          enriched_ids = set()
          for row in facts:
              if row.get('Initial_Access'):
                  initial_count += 1
              flow = json.loads(row.get('Attack_Flow_JSON') or '[]')
              if flow:
                  enriched_ids.add(row['Item_ID'])
              for step in flow:
                  text = f"{step.get('action','')} {step.get('evidence','')}"
                  if hedge.search(text) or response.search(text):
                      bad_flow.append((row['Item_ID'], text))
              impact = row.get('Impact') or ''
              if impact:
                  enriched_ids.add(row['Item_ID'])
                  if hedge.search(impact) or response.search(impact):
                      bad_impact.append((row['Item_ID'], impact))
              if row.get('Initial_Access'):
                  enriched_ids.add(row['Item_ID'])
              if (row.get('Initial_Access') or row.get('Attack_Flow_JSON') or row.get('Impact')) and not row.get('Summary'):
                  summary_missing.append(row['Item_ID'])

          published = {fact.get('item_id') for inc in incidents for fact in (inc.get('facts') or []) if fact.get('item_id')}
          projection_gaps = sorted(enriched_ids - published)
          stats = json.loads(Path('data/source_facts_ai_usage.json').read_text(encoding='utf-8'))
          report = {
              'target_rows': len(facts),
              'summary_count': sum(bool(r.get('Summary')) for r in facts),
              'initial_access_count': initial_count,
              'attack_flow_count': sum(bool(r.get('Attack_Flow_JSON')) for r in facts),
              'impact_count': sum(bool(r.get('Impact')) for r in facts),
              'bad_flow': bad_flow,
              'bad_impact': bad_impact,
              'summary_missing_on_enriched': summary_missing,
              'projection_gaps': projection_gaps,
              'ai_usage': stats,
          }
          Path('audit').mkdir(exist_ok=True)
          Path('audit/enrichment_closeout_final.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if bad_flow or bad_impact or summary_missing or projection_gaps or initial_count < 1:
              raise SystemExit('closeout quality gate failed')
          PY
          python -m cyberwatch check
          python -m cyberwatch test-repeat
          PYTHONPATH="$PWD" pytest -q tests/test_source_facts_ai.py tests/test_source_facts.py tests/test_site_source_facts.py tests/test_enrichment_closeout.py
          node --check assets/dashboard-audit.js

