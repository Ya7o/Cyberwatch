name: Cyberattaque.org rich facts backfill

on:
  workflow_dispatch:
    inputs:
      semantic:
        description: "Activer le filet sémantique LLM pour les articles ambigus"
        type: boolean
        default: true
      semantic_batches:
        description: "Nombre maximal de lots sémantiques"
        type: number
        default: 4
      semantic_calls_per_batch:
        description: "Nouveaux appels LLM maximum par lot"
        type: number
        default: 25
  push:
    branches: [main]
    paths:
      - '.github/workflows/cyberattaque-rich-backfill.yml'
      - 'cyberwatch/collectors/cyberattaque_*.py'
      - 'cyberwatch/cyberattaque_semantic_backfill.py'
      - 'scripts/backfill_cyberattaque_semantic.py'
      - 'scripts/audit_cyberattaque_rich_facts.py'
      - 'scripts/certify_cyberattaque_rich_facts.py'
      - 'scripts/certify_cyberattaque_semantic_closeout.py'
      - 'tests/test_cyberattaque_*.py'

permissions:
  contents: write

concurrency:
  group: cyberattaque-rich-backfill
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .
      OPENAI_API_KEY: ${{ secrets.Cyberwatchapi }}
      CYBERATTAQUE_SEMANTIC_MODEL: gpt-5-nano
      CYBERATTAQUE_SEMANTIC_MAX_CONTEXT_CHARS: '18000'
      CYBERATTAQUE_SEMANTIC_MAX_OUTPUT_TOKENS: '1800'
      ORG_ENRICHMENT_ENABLED: '0'
      AI_MAX_CALLS_PER_RUN: '0'
      SOURCE_FACTS_AI_MAX_CALLS_PER_RUN: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Smoke test CLI du backfill sémantique
        run: env -u PYTHONPATH python scripts/backfill_cyberattaque_semantic.py --help >/dev/null

      - name: Rebuild déterministe du corpus 2026
        env:
          CYBERATTAQUE_SEMANTIC_ENABLED: '0'
        run: |
          START=$(date +%s)
          python -m cyberwatch create --layers core --start 2026-01-01
          python -m cyberwatch build-site
          END=$(date +%s)
          echo "DETERMINISTIC_SECONDS=$((END-START))" >> "$GITHUB_ENV"

      - name: Backfill sémantique par lots persistants
        if: ${{ github.event_name == 'push' || inputs.semantic }}
        env:
          CYBERATTAQUE_SEMANTIC_ENABLED: '1'
          SEMANTIC_BATCHES: ${{ github.event_name == 'push' && '4' || inputs.semantic_batches }}
          CALLS_PER_BATCH: ${{ github.event_name == 'push' && '25' || inputs.semantic_calls_per_batch }}
        run: |
          set -euo pipefail
          git config user.name 'cyberwatch-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config rebase.autoStash true
          BATCHES="${SEMANTIC_BATCHES:-4}"
          CALLS="${CALLS_PER_BATCH:-25}"
          BACKLOG=-1
          for batch in $(seq 1 "$BATCHES"); do
            echo "=== Semantic batch $batch/$BATCHES (max calls=$CALLS) ==="
            python scripts/backfill_cyberattaque_semantic.py \
              --start 2026-01-01 \
              --max-calls "$CALLS" \
              --progress data/quality/cyberattaque_semantic_progress.json \
              --backlog data/quality/cyberattaque_semantic_backlog.json \
              | tee "/tmp/cyberattaque-semantic-${batch}.json"
            cat "/tmp/cyberattaque-semantic-${batch}.json" >> "$GITHUB_STEP_SUMMARY"

            BACKLOG=$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/quality/cyberattaque_semantic_progress.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          print(int(data.get('backlog_remaining') or 0))
          PY
            )

            git add -- data/source_facts.csv data/cyberattaque_semantic_cache.json data/quality/cyberattaque_semantic_progress.json data/quality/cyberattaque_semantic_backlog.json
            if ! git diff --cached --quiet; then
              git commit -m "data: Cyberattaque semantic checkpoint batch ${batch}"
              pushed=0
              for delay in 0 2 4 8 16; do
                [ "$delay" -gt 0 ] && sleep "$delay"
                if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
                  pushed=1
                  break
                fi
              done
              if [ "$pushed" -ne 1 ]; then
                echo 'Échec de publication du checkpoint sémantique : arrêt immédiat pour ne pas perdre la progression.' >&2
                exit 1
              fi
              echo "Checkpoint batch ${batch} publié sur ${GITHUB_REF_NAME}."
            fi
            if [ "$BACKLOG" -eq 0 ]; then
              echo "SEMANTIC_COMPLETE=1" >> "$GITHUB_ENV"
              break
            fi
          done
          if [ "$BACKLOG" -gt 0 ]; then
            echo "Backfill sémantique incomplet : ${BACKLOG} article(s) restent en attente après ${BATCHES} lot(s)." >&2
            exit 2
          fi

      - name: Rapport de progression
        if: ${{ always() }}
        run: |
          echo '### Progression sémantique Cyberattaque.org' >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/quality/cyberattaque_semantic_progress.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat data/quality/cyberattaque_semantic_progress.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Audit complet et échantillon de revue
        run: |
          python -m cyberwatch build-site
          mkdir -p data/quality
          python scripts/audit_cyberattaque_rich_facts.py \
            --output data/quality/cyberattaque_rich_audit.json \
            --review-sample data/quality/cyberattaque_rich_review_sample.csv \
            --review-limit 100 \
            | tee /tmp/cyberattaque-rich-audit.json
          echo '### Audit Cyberattaque.org rich facts' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/cyberattaque-rich-audit.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Certification de précision et couverture
        run: |
          python scripts/certify_cyberattaque_rich_facts.py \
            data/quality/cyberattaque_rich_audit.json \
            --json data/quality/cyberattaque_rich_certification.json \
            --markdown data/quality/cyberattaque_rich_certification.md \
            | tee /tmp/cyberattaque-rich-certification.md
          cat /tmp/cyberattaque-rich-certification.md >> "$GITHUB_STEP_SUMMARY"

      - name: Verdict de clôture opérationnelle
        if: ${{ github.event_name == 'push' || inputs.semantic }}
        run: |
          python scripts/certify_cyberattaque_semantic_closeout.py \
            --progress data/quality/cyberattaque_semantic_progress.json \
            --certification data/quality/cyberattaque_rich_certification.json \
            --json data/quality/cyberattaque_semantic_closeout.json \
            --allow-not-ready \
            | tee /tmp/cyberattaque-semantic-closeout.txt
          echo '### Clôture sémantique Cyberattaque.org' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/cyberattaque-semantic-closeout.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Exiger READY quand le backlog est épuisé
        if: ${{ env.SEMANTIC_COMPLETE == '1' }}
        run: |
          python scripts/certify_cyberattaque_semantic_closeout.py \
            --progress data/quality/cyberattaque_semantic_progress.json \
            --certification data/quality/cyberattaque_rich_certification.json \
            --json data/quality/cyberattaque_semantic_closeout.json

      - name: Contrôles de non-régression
        run: |
          python -m pytest \
            tests/test_cyberattaque_rich_facts.py \
            tests/test_cyberattaque_corpus_v2.py \
            tests/test_cyberattaque_closeout.py \
            tests/test_cyberattaque_semantic_backfill.py \
            tests/test_cyberattaque_semantic_closeout.py -q
          python -m cyberwatch check
          python -m cyberwatch test-repeat

      - name: Vérifier le rendu publié
        run: |
          python -m cyberwatch build-site
          test -s assets/data/incidents.json
          test -s assets/data/items.json
          python - <<'PY'
          import json
          from pathlib import Path
          incidents = json.loads(Path('assets/data/incidents.json').read_text(encoding='utf-8'))
          text = json.dumps(incidents, ensure_ascii=False)
          if 'CYBERATTAQUE_ORG' not in text:
              raise SystemExit('Cyberattaque.org absent du payload dashboard publié')
          PY

      - name: Publier le corpus et la certification finale
        run: |
          git config user.name 'cyberwatch-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config rebase.autoStash true
          git add -- data assets/data
          if git diff --cached --quiet; then echo 'Aucun changement final à publier.'; exit 0; fi
          git commit -m 'data: certify rich facts Cyberattaque.org v4'
          for delay in 0 2 4 8 16; do
            [ "$delay" -gt 0 ] && sleep "$delay"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
          done
          echo 'Échec de publication du backfill certifié.' >&2
          exit 1