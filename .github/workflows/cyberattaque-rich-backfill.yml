name: Cyberattaque.org rich facts backfill

on:
  workflow_dispatch:
    inputs:
      semantic:
        description: "Activer le filet sémantique LLM pour les articles ambigus"
        type: boolean
        default: true
      semantic_batches:
        description: "Nombre de passes sémantiques reprenables"
        type: number
        default: 4
      batch_minutes:
        description: "Budget maximal par passe sémantique"
        type: number
        default: 8
  push:
    branches: [main]
    paths:
      - '.github/workflows/cyberattaque-rich-backfill.yml'
      - 'cyberwatch/collectors/cyberattaque_*.py'
      - 'scripts/audit_cyberattaque_rich_facts.py'
      - 'scripts/certify_cyberattaque_rich_facts.py'
      - 'tests/test_cyberattaque_*.py'

permissions:
  contents: write

concurrency:
  group: cyberattaque-rich-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.Cyberwatchapi }}
      CYBERATTAQUE_SEMANTIC_MODEL: gpt-5-nano
      CYBERATTAQUE_SEMANTIC_MAX_CONTEXT_CHARS: '18000'
      CYBERATTAQUE_SEMANTIC_MAX_OUTPUT_TOKENS: '1800'
      ORG_ENRICHMENT_ENABLED: '0'
      AI_MAX_CALLS_PER_RUN: '0'
      SOURCE_FACTS_AI_MAX_CALLS_PER_RUN: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Rebuild déterministe du corpus 2026
        env:
          CYBERATTAQUE_SEMANTIC_ENABLED: '0'
        run: |
          START=$(date +%s)
          python -m cyberwatch create --layers core --start 2026-01-01
          python -m cyberwatch build-site
          END=$(date +%s)
          echo "DETERMINISTIC_SECONDS=$((END-START))" >> "$GITHUB_ENV"
          git config user.name 'cyberwatch-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data assets/data
          git commit -m 'data: deterministic Cyberattaque.org rich backfill base' || true
          echo "DETERMINISTIC_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Passes sémantiques bornées et reprenables
        if: ${{ github.event_name == 'push' || inputs.semantic }}
        env:
          CYBERATTAQUE_SEMANTIC_ENABLED: '1'
          SEMANTIC_BATCHES: ${{ github.event_name == 'push' && '4' || inputs.semantic_batches }}
          BATCH_MINUTES: ${{ github.event_name == 'push' && '8' || inputs.batch_minutes }}
        run: |
          set -u
          mkdir -p /tmp/cyberattaque-checkpoints
          BATCHES="${SEMANTIC_BATCHES:-4}"
          MINUTES="${BATCH_MINUTES:-8}"
          CACHE=data/cyberattaque_semantic_cache.json
          for batch in $(seq 1 "$BATCHES"); do
            echo "=== Semantic batch $batch/$BATCHES (budget ${MINUTES}m) ==="
            START=$(date +%s)
            set +e
            timeout --signal=TERM --kill-after=20s "${MINUTES}m" \
              python -m cyberwatch create --layers core --start 2026-01-01
            RC=$?
            set -e
            END=$(date +%s)
            if [ -f "$CACHE" ]; then
              cp "$CACHE" "/tmp/cyberattaque-checkpoints/cache-${batch}.json"
              CACHE_ENTRIES=$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/cyberattaque_semantic_cache.json')
          try:
              data=json.loads(p.read_text(encoding='utf-8'))
              print(len(data) if isinstance(data,dict) else 0)
          except Exception:
              print(0)
          PY
              )
            else
              CACHE_ENTRIES=0
            fi
            echo "batch=$batch rc=$RC seconds=$((END-START)) cache_entries=$CACHE_ENTRIES" | tee -a /tmp/cyberattaque-semantic-progress.txt

            # Une passe interrompue ne doit jamais laisser de snapshot canonique partiel.
            git reset --hard "$DETERMINISTIC_COMMIT"
            if [ -f "/tmp/cyberattaque-checkpoints/cache-${batch}.json" ]; then
              cp "/tmp/cyberattaque-checkpoints/cache-${batch}.json" "$CACHE"
            fi

            # RC=0 signifie que le corpus complet a été enrichi avec le cache courant.
            if [ "$RC" -eq 0 ]; then
              echo "SEMANTIC_COMPLETE=1" >> "$GITHUB_ENV"
              break
            fi
            if [ "$RC" -ne 124 ] && [ "$RC" -ne 137 ]; then
              echo "Passe sémantique interrompue avec rc=$RC" >&2
              exit "$RC"
            fi
          done
          echo '### Progression sémantique Cyberattaque.org' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/cyberattaque-semantic-progress.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Finaliser depuis le cache accumulé
        if: ${{ env.SEMANTIC_COMPLETE != '1' && (github.event_name == 'push' || inputs.semantic) }}
        env:
          CYBERATTAQUE_SEMANTIC_ENABLED: '1'
        run: |
          # Dernière passe bornée : si le backlog est encore trop grand, le cache est quand même publiable.
          set +e
          timeout --signal=TERM --kill-after=20s 15m python -m cyberwatch create --layers core --start 2026-01-01
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "SEMANTIC_COMPLETE=1" >> "$GITHUB_ENV"
          elif [ "$RC" -eq 124 ] || [ "$RC" -eq 137 ]; then
            echo "Backlog sémantique encore présent après la passe finale; cache checkpoint conservé." | tee -a /tmp/cyberattaque-semantic-progress.txt
            git reset --hard "$DETERMINISTIC_COMMIT"
          else
            exit "$RC"
          fi

      - name: Audit complet et échantillon de revue
        run: |
          python -m cyberwatch build-site
          mkdir -p data/quality
          python scripts/audit_cyberattaque_rich_facts.py \
            --output data/quality/cyberattaque_rich_audit.json \
            --review-sample data/quality/cyberattaque_rich_review_sample.csv \
            --review-limit 100 \
            | tee /tmp/cyberattaque-rich-audit.json
          echo '### Audit Cyberattaque.org rich facts' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/cyberattaque-rich-audit.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Certification de précision et couverture
        run: |
          python scripts/certify_cyberattaque_rich_facts.py \
            data/quality/cyberattaque_rich_audit.json \
            --json data/quality/cyberattaque_rich_certification.json \
            --markdown data/quality/cyberattaque_rich_certification.md \
            | tee /tmp/cyberattaque-rich-certification.md
          cat /tmp/cyberattaque-rich-certification.md >> "$GITHUB_STEP_SUMMARY"

      - name: Contrôles de non-régression
        run: |
          python -m pytest \
            tests/test_cyberattaque_rich_facts.py \
            tests/test_cyberattaque_corpus_v2.py \
            tests/test_cyberattaque_closeout.py -q
          python -m cyberwatch check
          python -m cyberwatch test-repeat

      - name: Vérifier le rendu publié
        run: |
          python -m cyberwatch build-site
          test -s assets/data/incidents.json
          test -s assets/data/items.json
          python - <<'PY'
          import json
          from pathlib import Path
          incidents = json.loads(Path('assets/data/incidents.json').read_text(encoding='utf-8'))
          text = json.dumps(incidents, ensure_ascii=False)
          if 'CYBERATTAQUE_ORG' not in text:
              raise SystemExit('Cyberattaque.org absent du payload dashboard publié')
          PY

      - name: Publier le backfill, la certification et le checkpoint sémantique
        run: |
          git config user.name 'cyberwatch-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data assets/data
          if git diff --cached --quiet; then echo 'Aucun changement à publier.'; exit 0; fi
          git commit -m 'data: checkpoint rich facts Cyberattaque.org v3'
          for delay in 0 2 4 8 16; do
            [ "$delay" -gt 0 ] && sleep "$delay"
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
          done
          echo 'Échec de publication du backfill certifié.' >&2
          exit 1
