name: Sector CI diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Diagnostic pytest
        shell: bash
        run: |
          set +e
          python -m pytest tests/ -q > /tmp/pytest-sector.log 2>&1
          status=$?
          cat /tmp/pytest-sector.log
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          text = "\n".join(Path("/tmp/pytest-sector.log").read_text(errors="replace").splitlines()[-120:])
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error file=tests,title=Pytest Sector diagnostic::{text}")
          PY
          fi
          exit "$status"
