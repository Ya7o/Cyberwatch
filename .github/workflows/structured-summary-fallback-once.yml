name: Structured Summary Fallback Once

on:
  push:
    branches:
      - agent/structured-summary-fallback-20260817
    paths:
      - '.github/workflows/structured-summary-fallback-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/structured-summary-fallback-20260817
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply patch and test
        run: |
          PYTHONPATH="$PWD" python .github/scripts/patch_structured_summary_fallback.py
          PYTHONPATH="$PWD" pytest -q tests/test_enrichment_closeout.py tests/test_source_facts.py tests/test_site_source_facts.py
      - name: Migrate existing summaries without AI
        run: PYTHONPATH="$PWD" python .github/scripts/migrate_structured_summaries.py
      - name: Validate snapshot and dashboard
        run: |
          python -m cyberwatch check
          python -m cyberwatch test-repeat
          node --check assets/dashboard-audit.js
      - name: Commit implementation and migrated dashboard
        run: |
          git config user.name 'cyberwatch-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/structured-summary-fallback-once.yml \
                 .github/scripts/patch_structured_summary_fallback.py \
                 .github/scripts/migrate_structured_summaries.py
          git add cyberwatch/source_facts.py tests/test_enrichment_closeout.py \
                  data/source_facts.csv assets/data/incidents.json assets/data/status.json
          git diff --cached --name-only
          git commit -m 'feat: derive summaries from validated structured facts'
          git push origin HEAD:agent/structured-summary-fallback-20260817
