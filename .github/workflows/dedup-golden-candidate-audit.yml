name: Dedup Golden Candidate Audit
on:
  push:
    branches: [agent/dedup-closeout]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Print independently reviewable candidate pairs
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from cyberwatch import store
          from cyberwatch.dedup import group_components
          from cyberwatch.duplicate_audit import find_audit_candidates, RISK_MISSED_DUPLICATE
          from cyberwatch.normalize import date_or_empty
          from cyberwatch.org_identity import effective_organisation_key

          items = store.load_items()
          comps = group_components(items)
          comp_of = {item.Item_ID: idx for idx, comp in enumerate(comps) for item in comp}

          def eff(item):
              return effective_organisation_key(item.Organisation_Raw, item.Organisation_Key)
          def days(a,b):
              da, db = date_or_empty(a.best_date), date_or_empty(b.best_date)
              return abs((da-db).days) if da and db else 9999
          def payload(a,b,kind):
              return {
                  'kind': kind,
                  'days': days(a,b),
                  'left': [a.Item_ID,a.Source_ID,a.Source_Item_ID,a.Published_Date,a.Event_Date,a.Organisation_Raw,a.Threat,a.Title,a.URL],
                  'right':[b.Item_ID,b.Source_ID,b.Source_Item_ID,b.Published_Date,b.Event_Date,b.Organisation_Raw,b.Threat,b.Title,b.URL],
              }

          positives=[]
          for comp in comps:
              if len(comp)<2: continue
              ordered=sorted(comp,key=lambda i:(i.Published_Date,i.Source_ID,i.Item_ID))
              for x,a in enumerate(ordered):
                  for b in ordered[x+1:]:
                      if a.Source_ID==b.Source_ID: continue
                      positives.append((days(a,b), eff(a), a,b))
          positives.sort(key=lambda row:(row[0],row[1],row[2].Source_ID,row[3].Source_ID))
          for _,_,a,b in positives[:90]:
              print('CURRENT_MERGE '+json.dumps(payload(a,b,'CURRENT_MERGE'),ensure_ascii=False))

          by_eff=defaultdict(list)
          for item in items:
              if eff(item): by_eff[eff(item)].append(item)
          separated=[]
          for key, group in by_eff.items():
              ordered=sorted(group,key=lambda i:(i.best_date,i.Source_ID,i.Item_ID))
              for x,a in enumerate(ordered):
                  for b in ordered[x+1:]:
                      if comp_of[a.Item_ID]==comp_of[b.Item_ID]: continue
                      gap=days(a,b)
                      if gap>=21:
                          separated.append((gap,key,a,b))
          separated.sort(key=lambda row:(row[0],row[1]))
          for _,_,a,b in separated[:80]:
              print('SEPARATE_SAME_ENTITY '+json.dumps(payload(a,b,'SEPARATE_SAME_ENTITY'),ensure_ascii=False))

          conflicts=[]
          for key, group in by_eff.items():
              by_source=defaultdict(list)
              for item in group:
                  if item.Source_Item_ID:
                      by_source[item.Source_ID].append(item)
              for source, source_items in by_source.items():
                  for x,a in enumerate(source_items):
                      for b in source_items[x+1:]:
                          if a.Source_Item_ID != b.Source_Item_ID and days(a,b)<=30:
                              conflicts.append((days(a,b),key,a,b))
          conflicts.sort(key=lambda row:(row[0],row[1]))
          for _,_,a,b in conflicts[:60]:
              print('NATIVE_CONFLICT '+json.dumps(payload(a,b,'NATIVE_CONFLICT'),ensure_ascii=False))

          missed=[candidate for candidate in find_audit_candidates(items) if candidate.risk_type==RISK_MISSED_DUPLICATE]
          for candidate in missed:
              print('MISSED_CANDIDATE '+json.dumps(payload(candidate.left,candidate.right,candidate.reason_code),ensure_ascii=False))
          PY
