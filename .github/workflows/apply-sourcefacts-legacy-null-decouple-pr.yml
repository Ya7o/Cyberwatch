name: Apply SourceFacts legacy-null decoupling on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/sourcefacts-legacy-null-decouple-20260818
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Extract and apply staged patch
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-sourcefacts-legacy-null-decouple.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply_sourcefacts_patch.py').write_text(code, encoding='utf-8')
          PY
          python /tmp/apply_sourcefacts_patch.py
      - name: Targeted regressions
        run: python -m pytest -q tests/test_source_facts_summary_reliability.py tests/test_source_facts_quality_telemetry.py
      - name: Full unit suite
        run: python -m pytest -q
      - name: Structural checks
        run: |
          python -m cyberwatch test-repeat
          python -m cyberwatch check
      - name: Commit validated patch and remove staging workflows
        run: |
          git config user.name "cyberwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/apply-sourcefacts-legacy-null-decouple.yml \
            .github/workflows/apply-sourcefacts-legacy-null-decouple-pr.yml
          git add \
            cyberwatch/source_facts_ai.py \
            cyberwatch/model.py \
            cyberwatch/status.py \
            cyberwatch/runner.py \
            scripts/backfill_source_fact_summaries.py \
            scripts/report_source_performance.py \
            tests/test_source_facts_summary_reliability.py \
            .github/workflows/source-facts-summary-backfill.yml
          git commit -m "Decouple historical SourceFacts null retries from CREATE"
          git push origin HEAD:agent/sourcefacts-legacy-null-decouple-20260818
