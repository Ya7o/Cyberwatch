name: Agent Location Patch

on:
  push:
    branches: [agent/location-resolution-minimal]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Appliquer le patch
        run: python scripts/_agent_location_patch.py
      - name: Committer le résultat
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cyberwatch/normalize.py cyberwatch/org_enrichment.py cyberwatch/model.py cyberwatch/enrichment.py cyberwatch/config.py tests/test_location_resolution.py
          git diff --cached --quiet && exit 0
          git commit -m "Fiabilise la qualification Location [agent-patch]"
          git push
