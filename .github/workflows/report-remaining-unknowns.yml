name: Report remaining unknown sectors
on:
  push:
    paths:
      - '.github/workflows/report-remaining-unknowns.yml'
      - 'sources/veillellm/report_remaining_unknowns.py'
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python sources/veillellm/report_remaining_unknowns.py
