name: Publish v0.7.35 (one-shot)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0735-once.yml"

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'Ya7o/Cyberwatch'
    runs-on: ubuntu-latest
    steps:
      - name: Publier v0.7.35
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v0.7.35 --repo "$REPO" >/dev/null 2>&1; then
            echo "v0.7.35 existe déjà" >&2
            exit 1
          fi
          gh release create v0.7.35 \
            --repo "$REPO" \
            --target 947e4a2506b79c4619985a2cf58807aa8c999448 \
            --title "v0.7.35 — derniers garde-fous pré-rebuild" \
            --notes-file - <<'EOF'
          Stabilisation finale du code avant reconstruction de la base depuis zéro.

          - Source facts V3 : Threat_Actor et Third_Party issus du LLM ne sont publiés que si leur valeur est explicitement nommée dans l'evidence source ; le fallback déterministe reste inchangé.
          - Dashboard : les types de données non reconnus restent « Données non qualifiées » au lieu d'être automatiquement classés « Données personnelles ».
          - Collecte quotidienne : `audit_data_quality --check --check-regression` est exécuté avant `build-site` et publication.
          - Aucun changement du pipeline canonique Threat / Sector / Location ni de la logique de déduplication.
          - Aucun OpenAI Search ajouté.
          - Validation : tests unitaires, syntaxe JavaScript, répétabilité et contrôles structurels verts sur le commit de release.
          EOF
