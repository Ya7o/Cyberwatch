name: DEV CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer les dépendances de validation
        run: pip install -r requirements-dev.txt
      - name: Auditer les dépendances
        run: python -m pip_audit -r requirements-dev.txt
      - name: Lint et typage progressif
        run: |
          python -m ruff check cyberwatch scripts tests
          python -m ruff check --select E4,E7,E9,F,I,UP cyberwatch/production.py cyberwatch/runner_dedup.py cyberwatch/runner_ingestion.py cyberwatch/runner_support.py cyberwatch/site_status.py cyberwatch/site_window.py cyberwatch/sector_resolution.py scripts/code_health.py scripts/git_governance_audit.py scripts/audit_sectors.py
          python -m mypy
          python scripts/code_health.py --module-budget 0 --function-budget 0
          python scripts/audit_sectors.py
          python scripts/materialize_llm_cache.py
      - name: Suite complète et contrats du site
        run: |
          python -m pytest tests/ -q
          node --check assets/dashboard-v2.js
          node --check assets/dashboard-integrity.js
          python -m cyberwatch validate-business
          python -m cyberwatch check
          python -m cyberwatch build-site
          git diff --exit-code -- assets/data
