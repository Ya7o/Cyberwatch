name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Tests unitaires
        run: python -m pytest tests/ -q

      - name: Golden dédup certifié
        continue-on-error: true
        run: python scripts/evaluate_dedup_golden.py

      - name: Audit couverture Sector — état publié
        run: python scripts/audit_sector_coverage.py --output ""

      - name: Golden qualification — état publié
        run: |
          python scripts/evaluate_golden.py \
            --details /tmp/golden-before.csv \
            --json /tmp/golden-before.json

      - name: Simuler la requalification offline
        run: python -m cyberwatch backfill-unknowns

      - name: Auditer les applications contextuelles
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          path = Path('data/qualification_provenance.csv')
          rows = list(csv.DictReader(path.open(encoding='utf-8'))) if path.exists() else []
          items = {}
          with Path('data/items.csv').open(encoding='utf-8') as handle:
              for row in csv.DictReader(handle):
                  items[row.get('Item_ID','')] = row.get('Organisation_Raw','')
          selected = [r for r in rows if r.get('Origin') == 'ORG_CONTEXT_SECTOR' and r.get('Decision') == 'APPLIED']
          print(f'CONTEXT_SECTOR_APPLICATIONS={len(selected)}')
          for row in selected:
              print(f"{items.get(row.get('Item_ID',''), '')}\t{row.get('Candidate_Value','')}\t{row.get('Evidence','')}")
          PY

      - name: Audit couverture Sector — après requalification
        run: python scripts/audit_sector_coverage.py --output ""

      - name: Golden qualification — après requalification
        run: |
          python scripts/evaluate_golden.py \
            --details /tmp/golden-after.csv \
            --json /tmp/golden-after.json

      - name: Garde de précision Sector globale
        run: |
          python scripts/check_sector_golden_regression.py \
            /tmp/golden-before.json \
            /tmp/golden-after.json

      - name: Benchmark du registre Sector par canal
        run: python scripts/evaluate_sector_registry.py --json /tmp/sector-registry.json

      - name: Politique d'auto-qualification Sector
        run: python scripts/check_sector_registry_policy.py --json /tmp/sector-registry.json

      - name: Syntaxe dashboard
        run: node --check assets/app.js

      - name: Test de répétabilité (§27)
        run: python -m cyberwatch test-repeat

      - name: Contrôles structurels (§29)
        run: python -m cyberwatch check --allow-uninitialized
