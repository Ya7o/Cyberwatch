name: DEV CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Tests développement
        run: python -m pytest tests/ -q
      - name: Syntaxe dashboard
        run: |
          node --check assets/dashboard-v2.js
          node --check assets/dashboard-integrity.js
      - name: Contrats structurels légers
        run: python -m cyberwatch check --allow-uninitialized
      - name: Construire le dashboard et valider facts v3
        run: |
          python -m cyberwatch build-site
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('assets/data/facts.json').read_text(encoding='utf-8'))
          assert isinstance(payload, dict) and payload, 'facts.json doit être un objet non vide'
          assert all(isinstance(detail, dict) and detail.get('version') == 3 for detail in payload.values())
          assert all(not isinstance(detail, list) for detail in payload.values())
          PY

  dispatch_reset_once:
    if: github.event_name == 'push' && github.event.head_commit.message == 'ops: retrigger zero reset from 2026-08-28'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Déclencher RESET TOTAL canonique
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run cold-reset.yml \
            --repo "$GH_REPO" \
            --ref main \
            -f reset_mode=zero \
            -f confirm_zero=RESET \
            -f start=2026-08-28 \
            -f semantic_passes=1 \
            -f source_facts_passes=1 \
            -f max_llm_cost_usd_per_pass=0.50 \
            -f publish=true
