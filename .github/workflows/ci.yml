name: DEV CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Tests développement
        run: python -m pytest tests/ -q
      - name: Syntaxe dashboard
        run: |
          node --check assets/app.js
          node --check assets/p2.js
          node --check assets/p3.js
      - name: Contrats structurels légers
        run: python -m cyberwatch check --allow-uninitialized
