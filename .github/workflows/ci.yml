name: Tests

# Les tests unitaires ne touchent jamais le réseau : les appels HTTP/LLM sont
# simulés et les parseurs s'exercent sur des échantillons figés.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt

      - name: Tests unitaires
        run: python -m pytest tests/ -q

      - name: Golden dédup certifié
        run: python scripts/evaluate_dedup_golden.py

      - name: Audit couverture Sector — état publié
        run: python scripts/audit_sector_coverage.py --output ""

      - name: Simuler la requalification offline
        run: python -m cyberwatch backfill-unknowns

      - name: Audit couverture Sector — après requalification
        run: python scripts/audit_sector_coverage.py --output ""

      - name: Golden qualification — après requalification
        run: |
          python scripts/evaluate_golden.py \
            --details /tmp/golden-qualification.csv \
            --json /tmp/golden-qualification.json

      - name: Syntaxe dashboard
        run: |
          node --check assets/app.js
          node --check assets/app-legacy.js
          node --check assets/dashboard-audit.js
          node --check assets/data-sensitivity.js

      - name: Test de répétabilité (§27)
        run: python -m cyberwatch test-repeat

      - name: Contrôles structurels (§29)
        run: python -m cyberwatch check --allow-uninitialized
