name: Build exact v0.7.35 files

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-v0735-final.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Appliquer les trois finitions
        run: |
          python - <<'PY'
          from pathlib import Path

          # P0 : acteur/tiers LLM explicitement nommés dans leur evidence.
          p = Path("cyberwatch/source_facts_ai.py")
          s = p.read_text(encoding="utf-8")
          old = '''def _normalize_fact(raw, context: str, *, require_value: bool = True) -> dict | None:
              if not isinstance(raw, dict):
                  return None
              value = str(raw.get("value") or "").strip()
              evidence = str(raw.get("evidence") or "").strip()
              confidence = _valid_confidence(raw.get("confidence"))
              if confidence is None or confidence < CONFIDENCE_THRESHOLD:
                  return None
              if require_value and not value:
                  return None
              if not evidence or len(evidence) > MAX_EVIDENCE_CHARS or not _grounded(evidence, context):
                  return None
              return {"value": value, "confidence": confidence, "evidence": evidence}
          '''
          new = '''def _normalize_fact(
              raw,
              context: str,
              *,
              require_value: bool = True,
              require_value_in_evidence: bool = False,
          ) -> dict | None:
              if not isinstance(raw, dict):
                  return None
              value = str(raw.get("value") or "").strip()
              evidence = str(raw.get("evidence") or "").strip()
              confidence = _valid_confidence(raw.get("confidence"))
              if confidence is None or confidence < CONFIDENCE_THRESHOLD:
                  return None
              if require_value and not value:
                  return None
              if not evidence or len(evidence) > MAX_EVIDENCE_CHARS or not _grounded(evidence, context):
                  return None
              if require_value_in_evidence and searchable(value) not in searchable(evidence):
                  return None
              return {"value": value, "confidence": confidence, "evidence": evidence}
          '''
          if s.count(old) != 1:
              raise SystemExit("ancre _normalize_fact inattendue")
          s = s.replace(old, new, 1)
          old = '''    for key in ("summary", "activity_description", "threat_actor", "third_party", "impact"):
                  fact = _normalize_fact(raw.get(key), context)
                  if fact:
                      result[key] = fact
          '''
          new = '''    for key in ("summary", "activity_description", "impact"):
                  fact = _normalize_fact(raw.get(key), context)
                  if fact:
                      result[key] = fact
          
              for key in ("threat_actor", "third_party"):
                  fact = _normalize_fact(raw.get(key), context, require_value_in_evidence=True)
                  if fact:
                      result[key] = fact
          '''
          if s.count(old) != 1:
              raise SystemExit("ancre _normalize inattendue")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")

          p = Path("tests/test_source_facts_ai.py")
          s = p.read_text(encoding="utf-8")
          s += '''\n\ndef test_acteur_et_tiers_doivent_etre_nommes_dans_evidence(monkeypatch, tmp_path):\n    monkeypatch.setenv("OPENAI_API_KEY", "test")\n    monkeypatch.setenv("SOURCE_FACTS_AI_CACHE_PATH", str(tmp_path / "cache.json"))\n    sfa.reset_runtime_for_tests()\n    output = _empty_output()\n    output["threat_actor"] = {"value": "LockBit", "confidence": .99, "evidence": "incident confirmé"}\n    output["third_party"] = {"value": "Example Cloud", "confidence": .99, "evidence": "via un prestataire externe"}\n    monkeypatch.setattr(sfa, "_post_openai", lambda *_: _payload(output))\n    result = sfa.enrich(_item(), RawEntry(title="Exemple", content="incident confirmé via un prestataire externe"))\n    assert "threat_actor" not in result\n    assert "third_party" not in result\n\n\ndef test_tiers_nomme_dans_evidence_est_accepte(monkeypatch, tmp_path):\n    monkeypatch.setenv("OPENAI_API_KEY", "test")\n    monkeypatch.setenv("SOURCE_FACTS_AI_CACHE_PATH", str(tmp_path / "cache.json"))\n    sfa.reset_runtime_for_tests()\n    output = _empty_output()\n    output["third_party"] = {"value": "Example Cloud", "confidence": .99, "evidence": "prestataire Example Cloud"}\n    monkeypatch.setattr(sfa, "_post_openai", lambda *_: _payload(output))\n    result = sfa.enrich(_item(), RawEntry(title="Exemple", content="incident via le prestataire Example Cloud"))\n    assert result["third_party"]["value"] == "Example Cloud"\n'''
          p.write_text(s, encoding="utf-8")

          # P1 : criticité conservatrice.
          p = Path("assets/data-sensitivity.js")
          s = p.read_text(encoding="utf-8")
          marker = '\n\n  const normalize = (value) => String(value || "")'
          personal = '''\n\n  const PERSONAL_EXACT = new Set([\n    "nom", "prenom", "nom et prenom", "nom, prenom", "nom / prenom",\n  ]);\n  const PERSONAL_MARKERS = [\n    "e-mail", "email", "telephone", "adresse postale", "date de naissance",\n    "numero client", "identifiant client", "coordonnees personnelles",\n  ];'''
          if s.count(marker) != 1:
              raise SystemExit("ancre data sensitivity inattendue")
          s = s.replace(marker, personal + marker, 1)
          old = '    if (values.length) return ["personal", "Données personnelles"];'
          new = '''    if (values.some((value) =>
              PERSONAL_EXACT.has(value.trim()) || PERSONAL_MARKERS.some((marker) => value.includes(marker))
            )) return ["personal", "Données personnelles"];
              if (values.length) return ["unknown", "Données non qualifiées"];'''
          if s.count(old) != 1:
              raise SystemExit("règle personal inattendue")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")

          p = Path("tests/test_data_sensitivity_asset.py")
          s = p.read_text(encoding="utf-8")
          s += '''\n    assert "PERSONAL_EXACT" in js\n    assert "PERSONAL_MARKERS" in js\n    assert 'if (values.length) return ["unknown", "Données non qualifiées"]' in js\n'''
          p.write_text(s, encoding="utf-8")

          # P1 : gate sémantique sur chaque run écrivant des données.
          p = Path(".github/workflows/collect.yml")
          s = p.read_text(encoding="utf-8")
          old = '''          python -m cyberwatch check
                    python -m cyberwatch test-repeat
                    python -m cyberwatch build-site
          '''
          new = '''          python -m cyberwatch check
                    python -m cyberwatch test-repeat
                    python scripts/audit_data_quality.py \\
                      --items data/items.csv \\
                      --source-facts data/source_facts.csv \\
                      --check \\
                      --check-regression
                    python -m cyberwatch build-site
          '''
          if s.count(old) != 1:
              raise SystemExit("bloc collect inattendu")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Validation complète
        run: |
          python -m pytest tests/ -q
          node --check assets/app.js
          node --check assets/app-legacy.js
          node --check assets/dashboard-audit.js
          node --check assets/data-sensitivity.js
          python -m cyberwatch test-repeat
          python -m cyberwatch check --allow-uninitialized
      - name: Préparer l'artefact exact
        run: |
          mkdir -p out/cyberwatch out/assets out/tests out/.github/workflows
          cp cyberwatch/source_facts_ai.py out/cyberwatch/
          cp tests/test_source_facts_ai.py out/tests/
          cp assets/data-sensitivity.js out/assets/
          cp tests/test_data_sensitivity_asset.py out/tests/
          cp .github/workflows/collect.yml out/.github/workflows/
      - uses: actions/upload-artifact@v4
        with:
          name: v0735-exact-files
          path: out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
