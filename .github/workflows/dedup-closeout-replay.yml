name: Dedup Closeout Replay
on:
  push:
    branches: [agent/dedup-closeout]
permissions:
  contents: write
jobs:
  replay:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/dedup-closeout
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Full unit tests
        run: python -m pytest tests/ -q
      - name: Dedup-only production replay
        run: |
          python - <<'PY'
          from cyberwatch import identity, incident_identity, site, store
          from cyberwatch.dedup import build_incidents_with_registry
          from cyberwatch.runner import pre_export_checks, save_snapshot_provenance

          items = store.load_items()
          old_incidents = store.load_incidents()
          old_ids = {incident.Incident_ID for incident in old_incidents}
          items_hash_before = identity.items_hash(items)

          registry = store.load_incident_id_registry()
          if not registry:
              registry = incident_identity.bootstrap_registry(items, old_incidents)
          incidents, registry = build_incidents_with_registry(items, registry)

          problems = pre_export_checks(items, incidents, [])
          problems = [problem for problem in problems if 'RUN_SOURCES' not in problem]
          problems.extend(incident_identity.validate_registry(registry, items, incidents))
          if problems:
              raise SystemExit('REPLAY BLOCKED: ' + ' ; '.join(problems))

          new_ids = {incident.Incident_ID for incident in incidents}
          missing_old = sorted(old_ids - new_ids)
          added = sorted(new_ids - old_ids)
          print(f'OLD={len(old_incidents)} NEW={len(incidents)} ADDED={added} MISSING_OLD={missing_old}')
          if len(incidents) != 842:
              raise SystemExit(f'expected 842 incidents, got {len(incidents)}')
          if missing_old:
              raise SystemExit(f'historical Incident_ID lost: {missing_old}')
          if len(added) != 1:
              raise SystemExit(f'expected exactly one new Incident_ID, got {added}')
          if identity.items_hash(items) != items_hash_before:
              raise SystemExit('ITEMS changed during dedup-only replay')

          store.save_incidents(incidents)
          store.save_incident_id_registry(registry)
          save_snapshot_provenance(
              items,
              incidents,
              operation='DEDUP_CLOSEOUT_REPLAY',
              as_of='2026-08-17T16:27:00+04:00',
          )
          site.build()
          PY
      - name: Lifecycle stability audit
        run: |
          python - <<'PY'
          from dataclasses import replace
          from cyberwatch import identity, sources, store
          from cyberwatch.dedup import build_incidents_with_registry, group_components

          items = store.load_items()
          registry = store.load_incident_id_registry()
          active_sources = sorted(spec.source_id for spec in sources.ALL_SOURCES if spec.active)
          failures = []
          checked = 0
          for component in group_components(items):
              before, _ = build_incidents_with_registry(component, registry)
              if len(before) != 1:
                  continue
              current_sources = {item.Source_ID for item in component}
              ordered = identity.sort_items(component)
              earlier = [source for source in active_sources if source not in current_sources and source < ordered[0].Source_ID]
              if not earlier:
                  continue
              source = earlier[0]
              base = ordered[0]
              clone = replace(
                  base,
                  Item_ID='',
                  Source_ID=source,
                  Source_Item_ID='',
                  URL=f'https://audit.invalid/{base.Item_ID}',
                  Collected_As_Of='2026-08-18T00:00:00+04:00',
              )
              clone.Item_ID = identity.item_id(
                  clone.Source_ID, clone.Published_Date, clone.Organisation_Key,
                  clone.URL, clone.Source_Item_ID,
              )
              after, _ = build_incidents_with_registry(component + [clone], registry)
              checked += 1
              if len(after) != 1 or after[0].Incident_ID != before[0].Incident_ID:
                  failures.append((before[0].Incident_ID, base.Organisation_Raw, source))
          print(f'LIFECYCLE_CHECKED={checked} FAILURES={len(failures)}')
          if failures:
              raise SystemExit(f'Incident_ID lifecycle instability: {failures[:10]}')
          PY
      - name: Repeatability and structural checks
        run: |
          python -m cyberwatch test-repeat
          python -m cyberwatch check
      - name: Restore unrelated generated caches
        run: git checkout -- data/source_facts_ai_cache.json data/source_facts_ai_usage.json
      - name: Scope gate
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          echo "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(data/incidents.csv|data/incident_id_registry.csv|data/snapshot.json|assets/data/[^/]+\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected replay changes:"
            echo "$unexpected"
            exit 1
          fi
          if git diff --name-only | grep -qx 'data/items.csv'; then
            echo 'data/items.csv must remain unchanged'
            exit 1
          fi
      - name: Commit replay artifacts
        run: |
          git config user.name "cyberwatch-bot"
          git config user.email "cyberwatch-bot@users.noreply.github.com"
          git add data/incidents.csv data/incident_id_registry.csv data/snapshot.json assets/data
          git commit -m "Replay dedup with stable incident anchors"
          git push origin HEAD:agent/dedup-closeout
