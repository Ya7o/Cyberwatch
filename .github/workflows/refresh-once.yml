name: Refresh after Mayotte backfill

on:
  push:
    branches: [main]
    paths:
      - ".github/refresh-trigger"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: MAJ complète
        run: python -m cyberwatch maj --layers all --as-of 2026-08-15T10:59:00+04:00
      - name: Contrôles
        run: |
          python -m cyberwatch check
          python -m cyberwatch test-repeat
          python -m cyberwatch build-site
      - name: Vérifier les sources et Mamoudzou
        run: |
          python - <<'PY'
          import json
          from cyberwatch import store

          with open('assets/data/status.json', encoding='utf-8') as f:
              payload = json.load(f)
          counts = payload.get('counts', {})
          assert counts.get('ok') == 8, counts
          assert counts.get('fail') == 0 and counts.get('partial') == 0, counts

          matches = [i for i in store.load_incidents()
                     if 'mamoudzou' in (i.Organisation or '').lower()
                     and i.Date.startswith('2026-06-11')]
          assert matches, 'Mamoudzou absent après MAJ complète'
          actual = {p.strip() for p in matches[0].Sources.split('|') if p.strip()}
          expected = {'JOURNAL_DE_MAYOTTE','KWEZI_NUMERIQUE','MAYOTTE_HEBDO_NUMERIQUE'}
          assert expected <= actual, actual
          print(f"SOURCES_OK={counts.get('ok')} MAMOUDZOU={matches[0].Incident_ID} SOURCES={matches[0].Sources}")
          PY
      - name: Publier
        run: |
          git config user.name "cyberwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/data
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "data: refresh after Mayotte backfill"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
