name: RESET VALIDATION 5 CAS

on:
  workflow_dispatch:
    inputs:
      confirm_reset:
        description: "Saisir exactement FIVE_CASES_RESET"
        required: true
        type: string
      publish:
        description: "Remplacer la production par les cinq cas"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cyberwatch-data-write
  cancel-in-progress: false

jobs:
  reset-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      MANIFEST: validation/five_cases.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Vérifier l'intention destructive
        env:
          CONFIRM_RESET: ${{ inputs.confirm_reset }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          [ "$CONFIRM_RESET" = "FIVE_CASES_RESET" ]
          [ "$PUBLISH" = "true" ]
          test -f "$MANIFEST"
      - name: Archiver et taguer l'état de production
        run: |
          set -euo pipefail
          python -m cyberwatch.zero_reset inventory --output /tmp/five-cases-inventory-before.json
          python -m cyberwatch.zero_reset archive \
            --output /tmp/cyberwatch-before-five-cases.tgz \
            --report /tmp/five-cases-archive-report.json
          git config user.name "cyberwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="archive/pre-validation-five-cases-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git tag -a "$tag" "$GITHUB_SHA" -m "Cyberwatch state before five-cases validation reset"
          git push origin "$tag"
          echo "ARCHIVE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Préparer le staging zéro
        run: |
          set -euo pipefail
          rm -rf /tmp/cyberwatch-five-cases
          mkdir -p /tmp/cyberwatch-five-cases
          rsync -a --exclude '.git' ./ /tmp/cyberwatch-five-cases/
          cd /tmp/cyberwatch-five-cases
          python -m cyberwatch.zero_reset purge --root . --output /tmp/five-cases-purge.json
          python -m cyberwatch.zero_reset verify --root . --output /tmp/five-cases-zero-state.json
          python -m cyberwatch.zero_reset validate-bootstrap --root . --output /tmp/five-cases-bootstrap.json
      - name: Collecter les cinq cas depuis les sources réelles
        working-directory: /tmp/cyberwatch-five-cases
        env:
          OPENAI_API_KEY: ${{ secrets.Cyberwatchapi }}
          # 20 qualification + 40 SourceFacts + 20 sémantique + 20 secteur
          # = 100 appels globaux structurellement impossibles à dépasser.
          LLM_MAX_CALLS_PER_RUN: "20"
          LLM_QUALIFICATION_MAX_CALLS_PER_RUN: "20"
          AI_MAX_CALLS_PER_RUN: "20"
          LLM_MAX_COST_USD_PER_RUN: "0.10"
          AI_MAX_ESTIMATED_COST_USD_PER_RUN: "0.10"
          SOURCE_FACTS_AI_MAX_CALLS_PER_RUN: "40"
          LLM_SOURCE_FACTS_MAX_CALLS_PER_RUN: "40"
          SOURCE_FACTS_AI_MAX_COST_USD_PER_RUN: "0.20"
          LLM_CYBERATTAQUE_SEMANTIC_MAX_CALLS_PER_RUN: "10"
          LLM_CYBERATTAQUE_SEMANTIC_MAX_COST_USD_PER_RUN: "0.05"
          LLM_EDITORIAL_SEMANTIC_MAX_CALLS_PER_RUN: "10"
          LLM_EDITORIAL_SEMANTIC_MAX_COST_USD_PER_RUN: "0.05"
          RICH_FACTS_SEMANTIC_SOURCES: "FRENCHBREACHES"
          ORG_ENRICHMENT_ENABLED: "0"
          ORG_ENRICHMENT_MAX_CALLS_PER_RUN: "0"
        run: |
          set -euo pipefail
          RESET_AS_OF="$(TZ=Indian/Reunion date --iso-8601=seconds)"
          python -m cyberwatch create --layers core --start 2026-08-01 --as-of "$RESET_AS_OF" --validation-corpus "$MANIFEST"
          test -f data/llm_usage.json && cp data/llm_usage.json /tmp/five-cases-semantic-usage.json || printf '{}\n' > /tmp/five-cases-semantic-usage.json
      - name: Proposer les secteurs non confirmés
        working-directory: /tmp/cyberwatch-five-cases
        env:
          OPENAI_API_KEY: ${{ secrets.Cyberwatchapi }}
          LLM_MAX_CALLS_PER_RUN: "20"
          LLM_MAX_COST_USD_PER_RUN: "0.10"
          LLM_ORGANISATION_SECTOR_MAX_CALLS_PER_RUN: "20"
          LLM_ORGANISATION_SECTOR_MAX_COST_USD_PER_RUN: "0.10"
        run: |
          set -euo pipefail
          python -m cyberwatch sector-llm
          test -f data/llm_usage.json && cp data/llm_usage.json /tmp/five-cases-sector-usage.json || printf '{}\n' > /tmp/five-cases-sector-usage.json
          python -m cyberwatch replay
      - name: Contrôler corpus, publication et budget
        working-directory: /tmp/cyberwatch-five-cases
        run: |
          set -euo pipefail
          python -m cyberwatch check
          python -m cyberwatch build-site
          PYTHONPATH=. python scripts/report_source_fact_coverage.py
          PYTHONPATH=. python scripts/audit_publication_contract.py
          PYTHONPATH=. python scripts/audit_validation_corpus.py --manifest "$MANIFEST" --output data/validation_five_cases_audit.json
          python - <<'PY'
          import csv, json
          from pathlib import Path

          def num(value):
              try: return float(value or 0)
              except (TypeError, ValueError): return 0.0
          rows = list(csv.DictReader(Path("data/ai_usage.csv").open(encoding="utf-8", newline="")))
          qualification = rows[-1] if rows else {}
          source = json.loads(Path("data/source_facts_ai_usage.json").read_text(encoding="utf-8"))
          semantic_runtime = json.loads(Path("/tmp/five-cases-semantic-usage.json").read_text(encoding="utf-8"))
          sector_runtime = json.loads(Path("/tmp/five-cases-sector-usage.json").read_text(encoding="utf-8"))
          channels = {
              "qualification": {"calls": int(num(qualification.get("Calls_Attempted"))), "cost_usd": num(qualification.get("Estimated_Cost_USD"))},
              "source_facts": {"calls": int(num(source.get("calls_attempted"))), "cost_usd": num(source.get("estimated_cost_usd"))},
              "runtime_semantic": {"calls": int(num(semantic_runtime.get("calls_attempted"))), "cost_usd": num(semantic_runtime.get("estimated_cost_usd")), "by_task": semantic_runtime.get("by_task", {})},
              "organisation_sector": {"calls": int(num(sector_runtime.get("calls_attempted"))), "cost_usd": num(sector_runtime.get("estimated_cost_usd")), "by_task": sector_runtime.get("by_task", {})},
          }
          calls = sum(row["calls"] for row in channels.values())
          cost = round(sum(row["cost_usd"] for row in channels.values()), 6)
          payload = {"limits": {"calls": 100, "cost_usd": 0.50}, "channels": channels, "totals": {"calls": calls, "cost_usd": cost}, "verdict": "PASS" if calls <= 100 and cost <= 0.50 else "FAIL"}
          Path("data/validation_five_cases_llm_budget.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(payload, ensure_ascii=False))
          if payload["verdict"] != "PASS": raise SystemExit("budget LLM dépassé")
          PY
      - name: Tests et contrôles frontend
        working-directory: /tmp/cyberwatch-five-cases
        run: |
          set -euo pipefail
          python -m pytest tests/ -q
          node --check assets/shared.js
          node --check assets/dashboard.js
          node --check assets/dashboard-v2.js
      - name: Publier le corpus de validation
        run: |
          set -euo pipefail
          rsync -a --delete /tmp/cyberwatch-five-cases/data/ data/
          rsync -a --delete /tmp/cyberwatch-five-cases/assets/data/ assets/data/
          git config user.name "cyberwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/data
          git diff --staged --quiet && exit 0
          git commit -m "data: reset validation cinq incidents"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Exporter les preuves du reset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-five-cases-${{ github.run_id }}
          path: |
            /tmp/cyberwatch-before-five-cases.tgz
            /tmp/five-cases-archive-report.json
            /tmp/five-cases-inventory-before.json
            /tmp/five-cases-purge.json
            /tmp/five-cases-zero-state.json
            /tmp/five-cases-bootstrap.json
            /tmp/five-cases-semantic-usage.json
            /tmp/five-cases-sector-usage.json
            /tmp/cyberwatch-five-cases/data/
            /tmp/cyberwatch-five-cases/assets/data/
          retention-days: 30
