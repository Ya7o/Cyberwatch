name: Enrichment Targeted Tests Once

on:
  push:
    branches:
      - agent/audit-enrichment-closeout-20260817
    paths:
      - '.github/workflows/audit-enrichment-targeted-tests-once.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/audit-enrichment-closeout-20260817
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Targeted enrichment tests
        run: PYTHONPATH="$PWD" pytest -q tests/test_source_facts_ai.py tests/test_source_facts.py tests/test_site_source_facts.py
