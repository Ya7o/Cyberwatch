name: Audit remaining unknown sectors
on:
  push:
    paths:
      - '.github/workflows/audit-remaining-unknown-sectors.yml'
      - 'sources/veillellm/audit_remaining_unknown_sectors.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python sources/veillellm/audit_remaining_unknown_sectors.py
      - run: |
          git config user.name "cyberwatch-bot"
          git config user.email "cyberwatch-bot@users.noreply.github.com"
          git add sources/veillellm/remaining_unknown_sectors_audit.csv sources/veillellm/remaining_unknown_sectors_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit remaining unknown 2026 sectors"
          git pull --rebase origin main
          git push origin HEAD:main
