name: Replay Singleton ID Test

on:
  push:
    branches:
      - "agent/replay-singleton-id-test"
    paths:
      - ".github/workflows/replay-singleton-id-test.yml"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Capturer l'état avant replay
        run: |
          cp data/incidents.csv /tmp/incidents-before.csv
          python - <<'PY'
          import csv
          from pathlib import Path
          from cyberwatch import identity, store

          incidents = store.load_incidents()
          print(f"BEFORE items={len(store.load_items())} incidents={len(incidents)} hash={identity.incidents_hash(incidents)}")
          with Path('data/incidents.csv').open(encoding='utf-8', newline='') as handle:
              rows = list(csv.DictReader(handle))
          for target in ('Région Occitanie', "Département de l’Ardèche"):
              matches = [row for row in rows if row.get('Organisation') == target]
              for row in matches:
                  print(f"BEFORE_TARGET {target} | {row['Incident_ID']} | items={row.get('Items_Count','')}")
          PY

      - name: Replay offline
        run: python -m cyberwatch replay

      - name: Vérifier le résultat
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          from cyberwatch import identity, store

          with Path('/tmp/incidents-before.csv').open(encoding='utf-8', newline='') as handle:
              before = list(csv.DictReader(handle))
          after_objects = store.load_incidents()
          after = [incident.__dict__ for incident in after_objects]

          before_ids = {row['Incident_ID'] for row in before}
          after_ids = {row['Incident_ID'] for row in after}
          removed = sorted(before_ids - after_ids)
          added = sorted(after_ids - before_ids)

          print(f"AFTER incidents={len(after_objects)} hash={identity.incidents_hash(after_objects)}")
          print(f"DELTA_INCIDENTS={len(after_objects) - len(before)}")
          print(f"REMOVED_INCIDENT_IDS={len(removed)}")
          for value in removed:
              row = next(row for row in before if row['Incident_ID'] == value)
              print(f"REMOVED {value} | {row.get('Date','')} | {row.get('Organisation','')} | items={row.get('Items_Count','')}")
          print(f"ADDED_INCIDENT_IDS={len(added)}")
          for value in added:
              row = next(row for row in after if row['Incident_ID'] == value)
              print(f"ADDED {value} | {row.get('Date','')} | {row.get('Organisation','')} | items={row.get('Items_Count','')}")

          for target in ('Région Occitanie', "Département de l’Ardèche"):
              before_matches = [row for row in before if row.get('Organisation') == target]
              after_matches = [row for row in after if row.get('Organisation') == target]
              if len(before_matches) != 1 or len(after_matches) != 1:
                  raise SystemExit(f"Cible singleton inattendue: {target}")
              before_id = before_matches[0]['Incident_ID']
              after_id = after_matches[0]['Incident_ID']
              print(f"TARGET {target} | before={before_id} | after={after_id}")
              if before_id != after_id:
                  raise SystemExit(f"Incident_ID singleton modifié: {target}: {before_id} -> {after_id}")

          if len(after_objects) != 841:
              raise SystemExit(f"Nombre d'incidents inattendu: {len(after_objects)} != 841")
          if len(after_objects) - len(before) != -6:
              raise SystemExit(f"Delta incidents inattendu: {len(after_objects) - len(before)} != -6")
          print("REPLAY_SINGLETON_ID_STABILITY=PASS")
          PY
