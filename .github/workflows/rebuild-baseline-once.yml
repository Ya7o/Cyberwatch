name: Rebuild Baseline (full clean)

# Rebuild total : repart des sources, sans réutiliser les caches de qualification
# ou d'enrichissement. Le push sur le marqueur reste déclaré pour compatibilité,
# mais seul workflow_dispatch exécute le job ; le dispatcher ops utilise ce mode.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/rebuild-request"

permissions:
  contents: read

concurrency:
  group: rebuild-baseline-full-clean
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.repository == 'Ya7o/Cyberwatch' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Figer le contexte du rebuild
        run: |
          AS_OF="$(TZ=Indian/Reunion date --iso-8601=seconds)"
          echo "AS_OF=$AS_OF" >> "$GITHUB_ENV"
          echo "Rebuild FULL CLEAN AS_OF=$AS_OF ; START=2026-01-01 ; LAYERS=all"

      - name: Tests unitaires
        run: python -m pytest tests/ -q

      - name: Purge locale des artefacts reconstructibles
        run: |
          rm -f \
            data/items.csv \
            data/incidents.csv \
            data/incident_id_registry.csv \
            data/source_facts.csv \
            data/source_facts_ai_cache.json \
            data/ai_qualifications.csv \
            data/org_enrichment_cache.csv \
            data/qualification_provenance.csv \
            data/dedup_audit_candidates.csv \
            data/run_log.csv \
            data/run_sources.csv \
            data/ai_usage.csv \
            data/source_facts_ai_usage.json \
            data/snapshot.json \
            data/baseline.json \
            data/entity_watch.csv
          rm -rf assets/data
          mkdir -p assets/data
          echo "Sorties et caches de qualification/enrichissement supprimés ; rebuild réellement sans cache."

      - name: Vérifier l'état UNINITIALIZED après purge
        run: python -m cyberwatch check --allow-uninitialized

      - name: CREATE from scratch
        env:
          OPENAI_API_KEY: ${{ secrets.Cyberwatchapi }}
          AI_MAX_CALLS_PER_RUN: "3000"
          AI_MAX_ESTIMATED_COST_USD_PER_RUN: "2.00"
          SOURCE_FACTS_AI_MAX_CALLS_PER_RUN: "1000"
          SOURCE_FACTS_AI_MAX_COST_USD_PER_RUN: "1.00"
          SOURCE_FACTS_AI_PROGRESS_EVERY: "25"
          SOURCE_FACTS_AI_CHECKPOINT_EVERY: "25"
          ORG_OFFICIAL_SITE_MAX_CALLS_PER_RUN: "0"
        run: |
          python -m cyberwatch create \
            --as-of "$AS_OF" \
            --start "2026-01-01" \
            --layers "all"

      - name: Check strict
        run: python -m cyberwatch check

      - name: Vérifier la projection ITEMS vers INCIDENTS
        run: |
          python - <<'PY'
          from cyberwatch import identity, store
          from cyberwatch.dedup import build_incidents

          items = store.load_items()
          persisted = store.load_incidents()
          rebuilt = build_incidents(items)
          persisted_hash = identity.incidents_hash(persisted)
          rebuilt_hash = identity.incidents_hash(rebuilt)
          if len(persisted) != len(rebuilt) or persisted_hash != rebuilt_hash:
              raise SystemExit(
                  "INCIDENTS incohérent avec build_incidents(ITEMS): "
                  f"persisted={len(persisted)}/{persisted_hash[:16]} "
                  f"rebuilt={len(rebuilt)}/{rebuilt_hash[:16]}"
              )
          print(
              f"Projection incidents PASS: {len(items)} items -> "
              f"{len(persisted)} incidents ({persisted_hash[:16]})"
          )
          PY

      - name: Test de répétabilité offline
        run: python -m cyberwatch test-repeat

      - name: Gate qualité pré-publication
        run: |
          python scripts/audit_data_quality.py \
            --items data/items.csv \
            --source-facts data/source_facts.csv \
            --check \
            --check-regression

      - name: Régénérer l'audit dedup du rebuild
        run: |
          python scripts/export_dedup_audit.py \
            --items data/items.csv \
            --org-cache data/org_enrichment_cache.csv \
            --output data/dedup_audit_candidates.csv

      - name: Créer la baseline
        run: python -m cyberwatch baseline --as-of "$AS_OF"

      - name: Construire le dashboard
        run: python -m cyberwatch build-site

      - name: Check final strict
        run: python -m cyberwatch check

      - name: Résumé du rebuild
        run: |
          echo "===== RUN LOG ====="
          cat data/run_log.csv
          echo "===== RUN SOURCES ====="
          cat data/run_sources.csv
          echo "===== QUALIFICATION PROVENANCE ====="
          python - <<'PY'
          import csv
          from collections import Counter
          from pathlib import Path
          path = Path("data/qualification_provenance.csv")
          rows = list(csv.DictReader(path.open(encoding="utf-8"))) if path.exists() else []
          print(f"rows={len(rows)}")
          print("decisions=", dict(Counter((r.get("Field"), r.get("Decision")) for r in rows)))
          PY
          echo "===== AI USAGE ====="
          cat data/ai_usage.csv || true
          echo "===== SOURCE FACTS AI USAGE ====="
          cat data/source_facts_ai_usage.json || true

      - name: Exporter la DB validée
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-baseline-output
          path: |
            data/
            assets/data/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Exporter les diagnostics même en échec
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-baseline-diagnostics-${{ github.run_id }}
          path: |
            data/run_log.csv
            data/run_sources.csv
            data/ai_usage.csv
            data/ai_qualifications.csv
            data/source_facts_ai_usage.json
            data/source_facts_ai_cache.json
            data/items.csv
            data/incidents.csv
            data/incident_id_registry.csv
            data/source_facts.csv
            data/qualification_provenance.csv
            data/dedup_audit_candidates.csv
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 2
