# Ce fichier reste présent uniquement parce que les contrats historiques et le
# marqueur ops le référencent encore. Il ne lance plus de reconstruction.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/rebuild-request"

permissions:
  contents: read

jobs:
