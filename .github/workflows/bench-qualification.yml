name: Qualification LLM Bench

on:
  workflow_dispatch:
    inputs:
      per_source:
        description: "Nombre d'items frais par source"
        required: false
        default: "30"
      start:
        description: "Debut de fenetre AAAA-MM-JJ (vide = 1er janvier)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - ".github/workflows/bench-qualification.yml"

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Executer le benchmark frais
        env:
          OPENAI_API_KEY: ${{ secrets.Cyberwatchapi }}
          AI_MAX_CALLS_PER_RUN: "500"
          AI_MAX_ESTIMATED_COST_USD_PER_RUN: "1.00"
          AI_MAX_CONTEXT_CHARS: "4000"
          AI_MAX_OUTPUT_TOKENS: "600"
          PER_SOURCE: ${{ inputs.per_source || '30' }}
          BENCH_START: ${{ inputs.start || '' }}
        run: |
          mkdir -p bench_output
          ARGS="--per-source ${PER_SOURCE} --output bench_output"
          if [ -n "$BENCH_START" ]; then
            ARGS="$ARGS --start $BENCH_START"
          fi
          python bench/qualification_bench.py $ARGS | tee bench_output/run.log

      - name: Publier le resume GitHub
        if: always()
        run: |
          if [ -f bench_output/summary.md ]; then
            cat bench_output/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Conserver les preuves du benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-bench
          path: bench_output/
          if-no-files-found: warn
          retention-days: 30
