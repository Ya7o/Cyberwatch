name: Live Repeat

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: Cutoff ISO 8601 optionnel
        required: false
        type: string
      start:
        description: Debut de fenetre AAAA-MM-JJ optionnel
        required: false
        type: string
      layers:
        description: Couches (defaut all)
        required: false
        default: all
        type: string

permissions:
  contents: read

jobs:
  repeat-live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Live repetition
        run: |
          ARGS="--layers '${{ inputs.layers }}'"
          [ -n "${{ inputs.as_of }}" ] && ARGS="$ARGS --as-of '${{ inputs.as_of }}'"
          [ -n "${{ inputs.start }}" ] && ARGS="$ARGS --start '${{ inputs.start }}'"
          python -m cyberwatch test-live-repeat $ARGS | tee -a "$GITHUB_STEP_SUMMARY"
