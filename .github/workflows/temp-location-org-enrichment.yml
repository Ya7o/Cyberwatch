name: Temp Location Org Enrichment

on:
  push:
    branches:
      - agent/location-org-enrichment

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - name: Appliquer le patch
        run: |
          python .github/scripts/apply_location_fix.py
          python .github/scripts/apply_location_test_adjustment.py
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Tests ciblés
        run: python -m pytest tests/test_location_resolution.py tests/test_ai_qualification.py tests/test_backfill_unknowns.py -q
      - name: Suite complète
        run: python -m pytest tests/ -q
      - name: Répétabilité et structure
        run: |
          python -m cyberwatch test-repeat
          python -m cyberwatch check --allow-uninitialized
      - name: Committer le correctif
        run: |
          rm .github/workflows/temp-location-org-enrichment.yml
          rm .github/scripts/apply_location_fix.py
          rm .github/scripts/apply_location_test_adjustment.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalise la qualification Location via enrichissement entreprise"
          git push origin HEAD:${GITHUB_REF_NAME}
