name: Dedup Registry Bootstrap Audit
on:
  push:
    branches: [agent/dedup-closeout]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Recover published incident anchors
        run: |
          python - <<'PY'
          from collections import defaultdict
          from cyberwatch import identity, store
          from cyberwatch.org_identity import effective_organisation_key

          items = store.load_items()
          incidents = store.load_incidents()
          matches = defaultdict(list)
          for item in items:
              effective = effective_organisation_key(item.Organisation_Raw, item.Organisation_Key)
              keys = []
              for key in (item.Organisation_Key, effective):
                  if key and key not in keys:
                      keys.append(key)
              for key in keys:
                  matches[identity.incident_id(key, item.Item_ID)].append((item.Item_ID, key, item.Source_ID, item.Published_Date, item.Organisation_Raw))

          missing = []
          ambiguous = []
          for incident in incidents:
              found = matches.get(incident.Incident_ID, [])
              if not found:
                  missing.append((incident.Incident_ID, incident.Date, incident.Organisation))
              elif len(found) > 1:
                  ambiguous.append((incident.Incident_ID, incident.Date, incident.Organisation, found))

          print(f'INCIDENTS={len(incidents)} RECOVERED={len(incidents)-len(missing)} MISSING={len(missing)} AMBIGUOUS={len(ambiguous)}')
          for row in missing[:20]: print('MISSING', row)
          for row in ambiguous[:20]: print('AMBIGUOUS', row)
          if missing or ambiguous:
              raise SystemExit(1)
          PY
