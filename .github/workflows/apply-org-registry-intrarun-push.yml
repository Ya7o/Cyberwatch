name: Apply org registry intra-run optimization once

on:
  push:
    branches:
      - agent/org-registry-intrarun-audit-20260818

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/org-registry-intrarun-audit-20260818
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Reuse staged patch
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-org-registry-intrarun.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply_org_registry_patch.py').write_text(code, encoding='utf-8')
          PY
          python /tmp/apply_org_registry_patch.py
      - name: Targeted tests
        run: |
          python -m pytest -q \
            tests/test_org_enrichment.py \
            tests/test_org_registry_intrarun.py \
            tests/test_source_performance_instrumentation.py
      - name: Full unit suite
        run: python -m pytest tests/ -q
      - name: Quality gates
        run: |
          python scripts/evaluate_dedup_golden.py
          python scripts/evaluate_golden.py --details /tmp/golden.csv --json /tmp/golden.json
          python -m cyberwatch test-repeat
          python -m cyberwatch check --allow-uninitialized
      - name: Live depth benchmark 5/10/20
        continue-on-error: true
        run: python scripts/benchmark_org_registry_depth.py --source BONJOURLAFUITE --max-queries 200 --json /tmp/org-depth.json
      - name: Commit validated code
        run: |
          git config user.name "cyberwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            cyberwatch/org_enrichment.py \
            cyberwatch/status.py \
            cyberwatch/model.py \
            cyberwatch/runner.py \
            cyberwatch/ai.py \
            scripts/report_source_performance.py \
            scripts/benchmark_org_registry_depth.py \
            tests/test_org_registry_intrarun.py
          git commit -m "Reuse deterministic registry negatives within a run"
          git push origin HEAD:agent/org-registry-intrarun-audit-20260818
