name: Source Facts Semantic Reuse Codemod

on:
  push:
    branches: [refactor/unified-llm-runtime]

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/unified-llm-runtime
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply semantic reuse refactor
        run: python scripts/_source_facts_semantic_reuse_codemod.py
      - name: Run source-facts regression tests
        run: |
          python -m pytest \
            tests/test_source_facts_ai.py \
            tests/test_source_facts_summary_reliability.py \
            tests/test_source_facts_backfill_abstention_retry.py \
            tests/test_rich_facts_closeout.py \
            tests/test_cyberattaque_corpus_v2.py -q
      - name: Commit semantic reuse
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- cyberwatch/source_facts_ai.py scripts/_source_facts_semantic_reuse_codemod.py .github/workflows/source-facts-semantic-reuse-codemod.yml
          git commit -m "Reuse validated rich facts in source facts"
          git push origin HEAD:refactor/unified-llm-runtime
