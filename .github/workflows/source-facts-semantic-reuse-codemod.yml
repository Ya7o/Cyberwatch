name: Source Facts Semantic Reuse Codemod

on:
  push:
    branches: [refactor/unified-llm-runtime]

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/unified-llm-runtime
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply semantic reuse refactor
        run: python scripts/_source_facts_semantic_reuse_codemod.py
      - name: Remove duplicate qualification timing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('cyberwatch/ai.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _post_openai(body: dict, state: AiRunState) -> dict:\n    started = time.monotonic()\n    try:\n        try:\n            result = llm_runtime.runtime().post_response(\n                task="qualification",\n                body=body,\n                api_key=state.api_key,\n            )\n            return result.payload\n        except llm_runtime.LlmError as exc:\n            raise AiCallError(str(exc)) from exc\n    finally:\n        state.llm_duration_seconds += time.monotonic() - started\n'''
          new = '''def _post_openai(body: dict, state: AiRunState) -> dict:\n    shared = llm_runtime.runtime()\n    before_duration = shared.stats.duration_seconds\n    try:\n        result = shared.post_response(\n            task="qualification",\n            body=body,\n            api_key=state.api_key,\n        )\n        return result.payload\n    except llm_runtime.LlmError as exc:\n        raise AiCallError(str(exc)) from exc\n    finally:\n        state.llm_duration_seconds += max(\n            0.0, shared.stats.duration_seconds - before_duration\n        )\n'''
          if old not in text:
              raise SystemExit('ai._post_openai timing pattern not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run source-facts and instrumentation regression tests
        run: |
          python -m pytest \
            tests/test_llm_runtime.py \
            tests/test_ai_qualification.py \
            tests/test_source_performance_instrumentation.py \
            tests/test_source_facts_ai.py \
            tests/test_source_facts_summary_reliability.py \
            tests/test_source_facts_backfill_abstention_retry.py \
            tests/test_rich_facts_closeout.py \
            tests/test_cyberattaque_corpus_v2.py -q
      - name: Commit semantic reuse
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- cyberwatch/ai.py cyberwatch/source_facts_ai.py scripts/_source_facts_semantic_reuse_codemod.py .github/workflows/source-facts-semantic-reuse-codemod.yml
          git commit -m "Reuse validated rich facts and fix LLM timing"
          git push origin HEAD:refactor/unified-llm-runtime