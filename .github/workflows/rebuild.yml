name: RESET RAPIDE

on:
  workflow_dispatch:
    inputs:
      layers:
        description: "Couches à reconstruire"
        type: string
        default: all
      start:
        description: "Début AAAA-MM-JJ (optionnel)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: cyberwatch-data-write
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Purger les sorties dérivées
        run: |
          rm -f data/items.csv data/incidents.csv data/snapshot.json
          rm -f assets/data/items.json assets/data/incidents.json assets/data/snapshot.json
      - name: Reconstruire sans nouvel appel LLM
        env:
          OPENAI_API_KEY: ${{ secrets.Cyberwatchapi }}
          LLM_MAX_CALLS_PER_RUN: "0"
          LLM_MAX_COST_USD_PER_RUN: "0"
          AI_MAX_CALLS_PER_RUN: "0"
          SOURCE_FACTS_AI_MAX_CALLS_PER_RUN: "0"
          ORG_ENRICHMENT_ENABLED: "1"
          ORG_ENRICHMENT_MAX_CALLS_PER_RUN: "0"
          ORG_OFFICIAL_SITE_MAX_CALLS_PER_RUN: "0"
        shell: bash
        run: |
          ARGS=""
          [ -n "${{ inputs.start }}" ] && ARGS="--start ${{ inputs.start }}"
          python -m cyberwatch create --layers "${{ inputs.layers }}" $ARGS
          python scripts/reapply_llm_cache.py
          python -m cyberwatch replay
      - name: Dev checks
        run: |
          python -m pytest tests/ -q
          node --check assets/app.js
          python -m cyberwatch check
          python -m cyberwatch build-site
          python -m cyberwatch check
      - name: Publier
        run: |
          git config user.name "cyberwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/data
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "data: reset rapide"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
