name: Release Location v0.7.30

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-location-v0.7.30
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Appliquer le backfill historique hors-ligne
        run: |
          python -m cyberwatch replay
          python -m cyberwatch check
          python -m cyberwatch test-repeat
          python -m cyberwatch build-site

      - name: Publier les données et retirer ce workflow temporaire
        id: publish
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data assets/data
          git rm .github/workflows/release-location-v0.7.30.yml
          git commit -m "release: v0.7.30 localisation fiabilisée"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "target=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Créer la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.publish.outputs.target }}
        run: |
          gh release create v0.7.30 \
            --target "$TARGET" \
            --title "v0.7.30 — localisation fiabilisée" \
            --notes "Qualification Location simplifiée et fiabilisée : indices territoriaux sûrs avant les defaults France, réutilisation sans appel supplémentaire du département de siège déjà obtenu par l'enrichissement entreprise, backfill historique hors-ligne, priorité VEILLE_LLM inchangée. Validation : tests unitaires, répétabilité et contrôles structurels PASS."
