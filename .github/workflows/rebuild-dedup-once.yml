name: One-shot deterministic rebuild

on:
  push:
    branches:
      - claude/project-analysis-dashboard-s9517r

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Validate native source IDs
        run: python -m pytest tests/test_source_item_ids.py tests/test_organisation_aliases.py tests/test_dedup.py -q

      - name: Rebuild deterministic identities and incidents
        run: python scripts/rebuild_dedup.py

      - name: Verify replay stability
        run: python -m cyberwatch test-repeat

      - name: Commit rebuilt data
        shell: bash
        run: |
          git add data/items.csv data/incidents.csv assets/data/incidents.json
          if git diff --cached --quiet; then
            echo "No rebuilt data change."
            exit 0
          fi
          git fetch origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse origin/$GITHUB_REF_NAME)" != "$GITHUB_SHA" ]; then
            echo "Branch moved during rebuild; refusing to overwrite concurrent work."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: rebuild deterministic dedup"
          git push origin "HEAD:$GITHUB_REF_NAME"
