name: Initialize Baseline

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "Cutoff ISO 8601 (optionnel)"
        type: string
        default: ""
      start:
        description: "Début AAAA-MM-JJ (optionnel ; 1er janvier par défaut)"
        type: string
        default: ""
      layers:
        description: "Couches à exécuter"
        type: string
        default: "all"

permissions:
  contents: write

concurrency:
  group: initialize-baseline
  cancel-in-progress: false

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
      - name: Figer le contexte d'initialisation
        run: |
          AS_OF="${{ inputs.as_of }}"
          if [ -z "$AS_OF" ]; then AS_OF="$(TZ=Indian/Reunion date --iso-8601=seconds)"; fi
          echo "AS_OF=$AS_OF" >> "$GITHUB_ENV"
          echo "TARGET_START=${{ inputs.start }}" >> "$GITHUB_ENV"
          echo "LAYERS=${{ inputs.layers }}" >> "$GITHUB_ENV"
      - name: Tests unitaires
        run: python -m pytest tests/ -q
      - name: CREATE contrôlé
        env:
          OPENAI_API_KEY: ${{ secrets.Cyberwatchapi }}
        run: |
          ARGS=(--as-of "$AS_OF" --layers "$LAYERS")
          if [ -n "$TARGET_START" ]; then ARGS+=(--start "$TARGET_START"); fi
          python -m cyberwatch create "${ARGS[@]}"
      - name: Check strict
        run: python -m cyberwatch check
      - name: Test de répétabilité offline
        run: python -m cyberwatch test-repeat
      - name: Gate qualité pré-release
        run: |
          python scripts/audit_data_quality.py \
            --items data/items.csv \
            --source-facts data/source_facts.csv \
            --check \
            --check-regression
      - name: Créer la baseline
        run: python -m cyberwatch baseline --as-of "$AS_OF"
      - name: Construire le dashboard
        run: python -m cyberwatch build-site
      - name: Check final strict
        run: python -m cyberwatch check
      - name: Publier la baseline
        run: |
          git config user.name "cyberwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/data
          if git diff --staged --quiet; then
            echo "Aucun artefact à publier."
            exit 0
          fi
          git commit -m "data: initialize baseline ${AS_OF}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
