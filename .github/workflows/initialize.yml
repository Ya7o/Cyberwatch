name: Validate historical Mayotte coverage

on:
  push:
    branches: [main]
    paths:
      - ".github/initialize-trigger"

permissions:
  contents: read

jobs:
  validate-mayotte:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Valider la collecte historique Mayotte
        run: |
          python - <<'PY'
          from cyberwatch import config, status
          from cyberwatch.runner import MODE_CREATE, execute, make_run_context

          context = make_run_context(
              MODE_CREATE,
              "2026-08-15T09:37:00+04:00",
              "2026-01-01",
              [config.LAYER_LOCAL_MEDIA],
          )
          report = execute(context, persist=False)

          print(f"RUN={report.context.run_id}")
          print(f"WINDOW={report.context.target_start}->{report.context.target_end}")
          print(f"OVERALL={report.overall}")
          print(f"ITEMS={len(report.items)} INCIDENTS={len(report.incidents)}")
          print("SOURCES")
          for outcome in report.outcomes:
              print(
                  f"{outcome.source_id}|{outcome.status}|coverage={outcome.coverage}|"
                  f"calls={outcome.calls}|seen={outcome.items_seen}|"
                  f"in_window={outcome.items_in_window}|items={outcome.items_collected}"
              )

          print("ITEMS_MAYOTTE")
          for item in report.items:
              print(
                  f"{item.Source_ID}|{item.Date}|{item.Organisation}|"
                  f"{item.Localisation}|{item.Item_ID}|{item.URL}"
              )

          mamoudzou = [
              incident for incident in report.incidents
              if "mamoudzou" in (incident.Organisation or "").lower()
          ]
          print(f"MAMOUDZOU_COUNT={len(mamoudzou)}")
          for incident in mamoudzou:
              print(
                  f"MAMOUDZOU|{incident.Incident_ID}|{incident.Date}|"
                  f"{incident.Organisation}|{incident.Localisation}|"
                  f"items={incident.Items_Count}|sources={incident.Sources}"
              )

          assert report.overall == status.OK, f"Collecte Mayotte non OK: {report.overall}"
          assert all(outcome.status == status.OK for outcome in report.outcomes)
          assert any("mamoudzou" in (item.Organisation or "").lower() for item in report.items), (
              "Le cas Mamoudzou attendu n'a pas été retrouvé dans la collecte historique Mayotte"
          )
          PY
