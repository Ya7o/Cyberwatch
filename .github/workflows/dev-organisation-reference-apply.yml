name: DEV organisation reference hardening

on:
  push:
    branches:
      - feat/organisation-reference-hardening

permissions:
  contents: write

concurrency:
  group: dev-organisation-reference-hardening
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[org-ref-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Stabiliser le script de migration
        run: python scripts/dev_fix_org_ref_apply.py
      - name: Appliquer le chantier
        run: |
          python scripts/dev_apply_organisation_reference.py
          python scripts/dev_post_org_ref_apply.py
      - name: Retirer les outils de migration temporaires
        run: rm -f scripts/dev_apply_organisation_reference.py scripts/dev_fix_org_ref_apply.py scripts/dev_post_org_ref_apply.py .github/workflows/dev-organisation-reference-apply.yml
      - name: Tests ciblés
        run: |
          python -m pytest tests/test_organisation_family.py tests/test_source_facts_promotion_contract.py tests/test_organisation_sector_llm_outcomes.py -q
          python -m pytest tests/test_source_facts.py tests/test_source_facts_ai.py tests/test_organisation_sector_llm.py -q
      - name: Suite complète et contrôles
        run: |
          python -m pytest tests/ -q
          node --check assets/dashboard-v2.js
          node --check assets/dashboard-integrity.js
          python -m cyberwatch check --allow-uninitialized
          python -m cyberwatch build-site
          python -m cyberwatch check
      - name: Publier la branche
        run: |
          git config user.name "cyberwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: référentiel organisationnel déterministe [org-ref-applied]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
