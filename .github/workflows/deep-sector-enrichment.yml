name: Deep sector evidence enrichment

on:
  push:
    branches: [main]
    paths:
      - 'scripts/enrich_sector_queue.py'
      - 'scripts/enrich_legal_identity.py'
      - 'scripts/check_sector_golden_regression.py'
      - 'cyberwatch/company_subject_evidence.py'
      - 'cyberwatch/context_sector.py'
      - 'cyberwatch/legal_identity.py'
      - 'cyberwatch/sector_registry.py'
      - 'cyberwatch/sector_registry_safety.py'
      - 'data/sector_auto_policy.json'
      - '.github/workflows/deep-sector-enrichment.yml'
  schedule:
    - cron: "30 4 * * 1"  # lundi 08:30 à La Réunion
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sector-canonical-pipeline
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  legal-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Résoudre les identités légales encore inconnues
        env:
          LEGAL_IDENTITY_MAX_ORGS: "0"
          LEGAL_IDENTITY_WORKERS: "6"
        run: python -m scripts.enrich_legal_identity

      - name: Checkpoint du cache d'identité légale
        run: |
          git config user.name "cyberwatch-bot"
          git config user.email "cyberwatch-bot@users.noreply.github.com"
          git add data/org_enrichment_cache.csv
          if git diff --cached --quiet; then
            echo "Aucune nouvelle identité légale à checkpoint."
            exit 0
          fi
          git commit -m "Checkpoint legal identity enrichment"
          git pull --rebase origin main
          git push origin HEAD:main

  enrich:
    needs: legal-identity
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Stabiliser l'état canonique et produire la file
        run: |
          python -m cyberwatch backfill-unknowns
          python scripts/audit_sector_coverage.py
          python scripts/evaluate_golden.py \
            --details /tmp/golden-before.csv \
            --json /tmp/golden-before.json

      - name: Rechercher les preuves organisationnelles sur toute la file
        env:
          ORG_ENRICHMENT_ENABLED: "1"
          ORG_ENRICHMENT_MAX_CALLS: "1000"
          SECTOR_ENRICHMENT_MAX_ORGS: "1000"
          SECTOR_ENRICHMENT_WORKERS: "6"
        run: python -m scripts.enrich_sector_queue

      - name: Requalifier via le registre et sa politique
        run: |
          python -m cyberwatch backfill-unknowns
          python scripts/audit_sector_coverage.py

      - name: Vérifier la précision avant publication
        run: |
          python scripts/evaluate_golden.py \
            --details /tmp/golden-after.csv \
            --json /tmp/golden-after.json
          python scripts/check_sector_golden_regression.py \
            /tmp/golden-before.json /tmp/golden-after.json \
            --before-details /tmp/golden-before.csv \
            --after-details /tmp/golden-after.csv
          python scripts/evaluate_sector_registry.py --json /tmp/sector-registry.json
          python scripts/check_sector_registry_policy.py --json /tmp/sector-registry.json
          python -m cyberwatch check --allow-uninitialized
          python -m cyberwatch test-repeat
          python -m cyberwatch build-site

      - name: Publier preuves, registre et snapshot atomiquement
        run: |
          git config user.name "cyberwatch-bot"
          git config user.email "cyberwatch-bot@users.noreply.github.com"
          git add \
            data/org_enrichment_cache.csv \
            data/organisation_sector_registry.csv \
            data/sector_enrichment_queue.csv \
            data/sector_quality.json \
            data/items.csv \
            data/incidents.csv \
            data/incident_id_registry.csv \
            data/qualification_provenance.csv \
            data/snapshot.json \
            assets/data
          if git diff --cached --quiet; then
            echo "Aucune nouvelle preuve ou qualification à publier."
            exit 0
          fi
          git commit -m "Enrich and revalidate organisation Sector evidence"
          git pull --rebase origin main
          git push origin HEAD:main
