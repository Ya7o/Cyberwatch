name: Performance closeout one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/performance-closeout-one-shot.yml'

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Premier MAJ de référence
        env:
          OPENAI_API_KEY: ${{ secrets.Cyberwatchapi }}
          ORG_ENRICHMENT_ENABLED: '0'
          CYBERWATCH_INCREMENTAL_QUALIFICATION: '1'
        run: |
          AS_OF=$(date --iso-8601=seconds)
          echo "AS_OF=$AS_OF" >> "$GITHUB_ENV"
          python -m cyberwatch maj --layers all --as-of "$AS_OF"
          python scripts/report_run_performance.py --observe

      - name: Second MAJ au même cutoff
        env:
          OPENAI_API_KEY: ${{ secrets.Cyberwatchapi }}
          ORG_ENRICHMENT_ENABLED: '0'
          CYBERWATCH_INCREMENTAL_QUALIFICATION: '1'
        run: |
          python -m cyberwatch maj --layers all --as-of "$AS_OF"
          python scripts/report_run_performance.py --observe

      - name: Certifier la clôture incrémentale
        run: |
          python scripts/performance_closeout_report.py | tee /tmp/performance-closeout.txt
          grep -q '^PERFORMANCE_CLOSEOUT=READY$' /tmp/performance-closeout.txt
          python -m cyberwatch check
          python -m cyberwatch test-repeat
          python scripts/evaluate_dedup_golden.py
          python scripts/evaluate_golden.py --details /tmp/golden.csv --json /tmp/golden.json

      - name: Publier les données de certification
        run: |
          git config user.name 'cyberwatch-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data assets/data
          if git diff --staged --quiet; then
            echo 'Aucun changement de données à publier.'
            exit 0
          fi
          RUN_ID=$(tail -n 1 data/run_log.csv | cut -d, -f1)
          git commit -m "data: certification performance ${RUN_ID:-inconnue}"
          git pull --rebase origin main
          git push origin HEAD:main
