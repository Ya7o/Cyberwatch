name: Refresh dedup audit (one-shot)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-dedup-audit-once.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'Ya7o/Cyberwatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer l'audit courant
        run: |
          python scripts/export_dedup_audit.py \
            --items data/items.csv \
            --org-cache data/org_enrichment_cache.csv \
            --output data/dedup_audit_candidates.csv

      - name: Publier le snapshot et retirer ce workflow
        run: |
          set -euo pipefail
          git config user.name "cyberwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dedup_audit_candidates.csv
          git rm .github/workflows/refresh-dedup-audit-once.yml
          git commit -m "data: refresh dedup audit candidates"
          for delay in 0 2 4 8 16; do
            [ "$delay" -gt 0 ] && sleep "$delay"
            git pull --rebase origin main && git push origin HEAD:main && exit 0
          done
          echo "Échec de publication du snapshot déduplication" >&2
          exit 1
