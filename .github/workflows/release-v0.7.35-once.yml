name: Release v0.7.35 stabilization (one-shot)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v0.7.35-once.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: release-v0.7.35-stabilization
  cancel-in-progress: false

jobs:
  stabilize-and-release:
    if: github.repository == 'Ya7o/Cyberwatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Synchroniser main sans écraser un développement parallèle
        run: git pull --rebase origin main
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Appliquer les trois finitions pré-rebuild
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("cyberwatch/source_facts.py")
          text = path.read_text(encoding="utf-8")
          anchor = '''def _ai_text(ai_result: dict, key: str) -> tuple[str, str]:
              candidate = ai_result.get(key) if isinstance(ai_result, dict) else None
              if not isinstance(candidate, dict):
                  return "", ""
              return str(candidate.get("value") or "").strip(), str(candidate.get("evidence") or "").strip()
          '''
          if text.count(anchor) != 1:
              raise SystemExit("source_facts.py: ancre _ai_text inattendue")
          helper = '''

          def _ai_grounded_name(ai_result: dict, key: str) -> tuple[str, str]:
              """Nom LLM recevable seulement s'il est explicitement nommé dans sa preuve."""
              value, evidence = _ai_text(ai_result, key)
              if not value or not evidence:
                  return "", ""
              if searchable(value) not in searchable(evidence):
                  return "", ""
              return value, evidence
          '''
          text = text.replace(anchor, anchor + helper, 1)
          actor_old = 'actor, actor_evidence = _ai_text(ai_result, "threat_actor")'
          third_old = 'third_party, third_party_evidence = _ai_text(ai_result, "third_party")'
          if text.count(actor_old) != 2 or text.count(third_old) != 2:
              raise SystemExit("source_facts.py: nombre d'appels LLM acteur/tiers inattendu")
          text = text.replace(actor_old, 'actor, actor_evidence = _ai_grounded_name(ai_result, "threat_actor")')
          text = text.replace(third_old, 'third_party, third_party_evidence = _ai_grounded_name(ai_result, "third_party")')
          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_source_facts_llm_grounding.py")
          if test_path.exists():
              raise SystemExit("test_source_facts_llm_grounding.py existe déjà")
          test_path.write_text('''from cyberwatch import source_facts as sf\n\n\ndef test_acteur_llm_doit_etre_nomme_dans_evidence():\n    ok = {"threat_actor": {"value": "LockBit", "evidence": "attaque revendiquée par LockBit"}}\n    bad = {"threat_actor": {"value": "LockBit", "evidence": "l incident a été confirmé"}}\n    assert sf._ai_grounded_name(ok, "threat_actor") == ("LockBit", "attaque revendiquée par LockBit")\n    assert sf._ai_grounded_name(bad, "threat_actor") == ("", "")\n\n\ndef test_tiers_llm_doit_etre_nomme_dans_evidence():\n    ok = {"third_party": {"value": "Example Cloud", "evidence": "via son prestataire Example Cloud"}}\n    bad = {"third_party": {"value": "Example Cloud", "evidence": "via un prestataire externe"}}\n    assert sf._ai_grounded_name(ok, "third_party")[0] == "Example Cloud"\n    assert sf._ai_grounded_name(bad, "third_party") == ("", "")\n\n\ndef test_acteurs_reels_restent_acceptes_et_generique_rejete():\n    for actor in ("LockBit", "Qilin", "Akira"):\n        value, evidence = sf._ai_grounded_name(\n            {"threat_actor": {"value": actor, "evidence": f"revendiquée par {actor}"}},\n            "threat_actor",\n        )\n        assert sf._valid_actor(value, "Victime SA") == actor\n        assert evidence\n    value, _ = sf._ai_grounded_name(\n        {"threat_actor": {"value": "ransomware", "evidence": "revendiquée par le groupe ransomware"}},\n        "threat_actor",\n    )\n    assert sf._valid_actor(value, "Victime SA") == ""\n''', encoding="utf-8")

          path = Path("assets/data-sensitivity.js")
          text = path.read_text(encoding="utf-8")
          marker = '\n\n  const normalize = (value) => String(value || "")'
          if text.count(marker) != 1:
              raise SystemExit("data-sensitivity.js: ancre normalize inattendue")
          personal = '''

          const PERSONAL_EXACT = new Set([
            "nom", "prenom", "nom et prenom", "nom, prenom", "nom / prenom",
          ]);
          const PERSONAL_MARKERS = [
            "e-mail", "email", "telephone", "adresse postale", "date de naissance",
            "numero client", "identifiant client", "coordonnees personnelles",
          ];'''
          text = text.replace(marker, personal + marker, 1)
          old = '    if (values.length) return ["personal", "Données personnelles"];'
          if text.count(old) != 1:
              raise SystemExit("data-sensitivity.js: règle personal historique inattendue")
          new = '''    if (values.some((value) =>
              PERSONAL_EXACT.has(value.trim()) || PERSONAL_MARKERS.some((marker) => value.includes(marker))
            )) return ["personal", "Données personnelles"];
              if (values.length) return ["unknown", "Données non qualifiées"];'''
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          path = Path("tests/test_data_sensitivity_asset.py")
          text = path.read_text(encoding="utf-8")
          old = '    assert "SENSITIVE_MARKERS" in js\n'
          if text.count(old) != 1:
              raise SystemExit("test_data_sensitivity_asset.py: ancre inattendue")
          new = old + '    assert "PERSONAL_EXACT" in js\n    assert "PERSONAL_MARKERS" in js\n    assert \'if (values.length) return ["unknown", "Données non qualifiées"]\' in js\n'
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = Path(".github/workflows/collect.yml")
          text = path.read_text(encoding="utf-8")
          old = '''          python -m cyberwatch check
                    python -m cyberwatch test-repeat
                    python -m cyberwatch build-site
          '''
          if text.count(old) != 1:
              raise SystemExit("collect.yml: bloc de contrôles inattendu")
          new = '''          python -m cyberwatch check
                    python -m cyberwatch test-repeat
                    python scripts/audit_data_quality.py \\
                      --items data/items.csv \\
                      --source-facts data/source_facts.csv \\
                      --check \\
                      --check-regression
                    python -m cyberwatch build-site
          '''
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Validation complète
        run: |
          python -m pytest tests/ -q
          node --check assets/app.js
          node --check assets/app-legacy.js
          node --check assets/dashboard-audit.js
          node --check assets/data-sensitivity.js
          python -m cyberwatch test-repeat
          python -m cyberwatch check --allow-uninitialized
      - name: Committer le code sur main
        run: |
          git config user.name "cyberwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cyberwatch/source_facts.py assets/data-sensitivity.js tests/test_source_facts_llm_grounding.py tests/test_data_sensitivity_asset.py .github/workflows/collect.yml
          git commit -m "fix: verrouille les derniers gates avant rebuild"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Déclencher et attendre la CI officielle
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --repo "$REPO" --ref main
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list --repo "$REPO" --workflow ci.yml --event workflow_dispatch --limit 10 --json databaseId,headSha --jq '.[] | select(.headSha == env.TARGET_SHA) | .databaseId' | head -n1)"
            [ -n "$run_id" ] && break
            sleep 2
          done
          [ -n "$run_id" ] || { echo "CI Tests introuvable pour $TARGET_SHA" >&2; exit 1; }
          gh run watch "$run_id" --repo "$REPO" --exit-status
      - name: Publier v0.7.35
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v0.7.35 --repo "$REPO" >/dev/null 2>&1; then
            echo "v0.7.35 existe déjà" >&2
            exit 1
          fi
          gh release create v0.7.35 \
            --repo "$REPO" \
            --target "$TARGET_SHA" \
            --title "v0.7.35 — derniers garde-fous pré-rebuild" \
            --notes-file - <<'EOF'
          Stabilisation finale du code avant reconstruction de la base depuis zéro.

          - Source facts V3 : Threat_Actor et Third_Party issus du LLM ne sont publiés que si leur valeur est explicitement nommée dans l'evidence source ; le fallback déterministe reste inchangé.
          - Dashboard : la présence d'un type de donnée ne suffit plus à conclure « Données personnelles » ; les types non reconnus restent « Données non qualifiées ».
          - Collecte quotidienne : le gate audit_data_quality --check --check-regression est désormais obligatoire avant build-site et publication.
          - Aucun changement du pipeline canonique Threat / Sector / Location ni de la logique de déduplication.
          - Aucun OpenAI Search ajouté.
          EOF
      - name: Retirer le workflow one-shot
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          path='.github/workflows/release-v0.7.35-once.yml'
          sha="$(gh api "repos/$REPO/contents/$path?ref=main" --jq .sha)"
          gh api --method DELETE "repos/$REPO/contents/$path" \
            -f message='chore: retire le workflow one-shot v0.7.35' \
            -f sha="$sha" \
            -f branch=main
