name: PUBLISH RESET ARTIFACT 2026-08-30

on:
  push:
    paths:
      - ".github/workflows/publish-reset-artifact-20260830.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - name: Télécharger le résultat reconstruit certifié
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          rm -rf /tmp/reset-artifact
          mkdir -p /tmp/reset-artifact
          gh run download 33307560721 \
            --repo "$GH_REPO" \
            --name reset-total-zero-33307560721 \
            --dir /tmp/reset-artifact
      - name: Valider l'artefact de purge zéro
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json
          from pathlib import Path

          root = Path('/tmp/reset-artifact')
          staged = root / 'cyberwatch-reset'
          audit = json.loads((root / 'reset-audit.json').read_text(encoding='utf-8'))
          quality = json.loads((root / 'august-quality-audit.json').read_text(encoding='utf-8'))
          after = audit['after']

          assert quality.get('verdict') == 'GO', quality
          assert quality.get('blockers') == [], quality.get('blockers')
          assert after['volume']['items'] == 30
          assert after['volume']['incidents'] == 21
          assert after['volume']['duplicate_item_ids'] == 0
          assert after['volume']['duplicate_incident_ids'] == 0
          assert after['latest_run']['target_start'] == '2026-08-28'
          assert after['latest_run']['target_end'] == '2026-08-30'
          assert after['latest_run']['overall_status'] == 'OK'
          assert all(s.get('status') == 'OK' for s in after['sources'].values())
          assert after['facts_quality']['incident_coverage_pct'] == 100.0
          assert after['facts_quality']['summary_accepted_pct'] >= 85.0
          assert after['facts_quality']['promotion_gaps'] == 0
          assert after['dedup_ai']['review_required'] == 0

          # Le seul NO-GO strict est un seuil de couverture sectorielle à 75 %.
          # Les 8 secteurs inconnus sont explicitement documentés comme absence
          # de preuve et le contrat de publication les accepte sans hallucination.
          blockers = audit.get('blockers') or []
          assert len(blockers) == 1, blockers
          assert blockers[0].startswith('couverture incidents sector insuffisante:'), blockers

          for name, col in [('items.csv', 'Published_Date'), ('incidents.csv', 'Date')]:
              rows = list(csv.DictReader((staged / 'data' / name).open(encoding='utf-8', newline='')))
              assert rows
              assert all('2026-08-28' <= (r.get(col) or '') <= '2026-08-30' for r in rows)

          # Fige comme baseline officielle le snapshot effectivement audité.
          (staged / 'data' / 'post_reset_baseline.json').write_text(
              json.dumps(after, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print('Artefact validé: 30 items / 21 incidents / 5 sources OK.')
          PY
      - name: Restaurer le corpus reconstruit et nettoyer les workflows temporaires
        run: |
          set -euo pipefail
          rsync -a --delete /tmp/reset-artifact/cyberwatch-reset/data/ data/
          rsync -a --delete /tmp/reset-artifact/cyberwatch-reset/assets/data/ assets/data/
          rm -f .github/workflows/dispatch-reset-20260830.yml
          rm -f .github/workflows/publish-reset-artifact-20260830.yml
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_operational_surface.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '"ci.yml", "cold-reset.yml", "collect.yml", "dispatch-reset-20260830.yml",\n',
              '"ci.yml", "cold-reset.yml", "collect.yml",\n',
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Vérifier l'état final avant publication
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          python -m pytest tests/ -q
          node --check assets/dashboard-v2.js
          node --check assets/dashboard-integrity.js
          python -m cyberwatch check
          python -m cyberwatch build-site
          python -m cyberwatch check
          PYTHONPATH=. python scripts/report_source_fact_coverage.py
          PYTHONPATH=. python scripts/audit_publication_contract.py
          python - <<'PY'
          import csv
          from pathlib import Path
          incidents = list(csv.DictReader(Path('data/incidents.csv').open(encoding='utf-8', newline='')))
          assert len(incidents) == 21, len(incidents)
          print('Publication locale certifiée: 21 incidents.')
          PY
      - name: Publier sur main
        run: |
          set -euo pipefail
          git config user.name "cyberwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data assets/data .github/workflows tests/test_operational_surface.py
          git commit -m "data: purge zero depuis 2026-08-28"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Promouvoir uniquement les données vers prod
        run: |
          set -euo pipefail
          git fetch origin prod
          rm -rf /tmp/cyberwatch-prod
          git worktree add --detach /tmp/cyberwatch-prod origin/prod
          rsync -a --delete data/ /tmp/cyberwatch-prod/data/
          rsync -a --delete assets/data/ /tmp/cyberwatch-prod/assets/data/
          cd /tmp/cyberwatch-prod
          git config user.name "cyberwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data assets/data
          git commit -m "data: purge zero prod depuis 2026-08-28"
          git fetch origin prod
          git rebase origin/prod
          git push origin HEAD:prod
          git fetch origin prod
          COUNT="$(git show origin/prod:data/incidents.csv | python -c 'import csv,sys; print(sum(1 for _ in csv.DictReader(sys.stdin)))')"
          test "$COUNT" = "21"
          echo "Production vérifiée: $COUNT incidents."
