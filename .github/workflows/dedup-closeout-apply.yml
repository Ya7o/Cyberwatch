name: Dedup Closeout Apply
on:
  push:
    branches: [agent/dedup-closeout]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/dedup-closeout
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Apply deterministic patch
        run: python scripts/_apply_dedup_closeout.py
      - name: Focused tests
        run: python -m pytest tests/test_incident_identity.py tests/test_dedup.py tests/test_dedup_hardening.py -q
      - name: Commit implementation
        run: |
          git config user.name "cyberwatch-bot"
          git config user.email "cyberwatch-bot@users.noreply.github.com"
          git add cyberwatch/store.py cyberwatch/dedup.py cyberwatch/qualification.py cyberwatch/runner.py cyberwatch/cli.py
          git commit -m "Stabilize incident IDs with persistent anchors"
          git push origin HEAD:agent/dedup-closeout
