name: Dedup Materialize Stable Golden

on:
  push:
    branches: [codex/dedup-closeout]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/dedup-closeout
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Materialize stable references
        run: python scripts/migrate_dedup_golden_refs.py
      - name: Commit migration when needed
        run: |
          if git diff --quiet -- data/golden/dedup_golden.csv; then
            echo "Golden already materialized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/golden/dedup_golden.csv
          git commit -m "Materialize stable dedup golden references"
          git push origin HEAD:codex/dedup-closeout
