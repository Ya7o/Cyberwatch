name: Deep company enrichment v4

on:
  push:
    paths:
      - '.github/workflows/deep-company-enrichment-v4.yml'
      - 'sources/veillellm/deep_company_enrichment_v4.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Resolve brands and legal entities
        run: python sources/veillellm/deep_company_enrichment_v4.py
      - name: Validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          sectors={"Administration / Collectivité","Santé","Éducation / Formation","Finance / Assurance","Transport / Logistique","Sport","Commerce / Distribution","Numérique / Technologie","Énergie / Utilities","Industrie / Manufacture","Construction / BTP","Services aux entreprises","Inconnu"}
          threats={"Ransomware","DDoS","Malware","Compromission de compte / messagerie","Intrusion","Fuite de données","Phishing / fraude","Incident tiers","Autre cyber","Inconnu"}
          for stem in ('cyberattaque_org_2026','frenchbreaches_2026'):
              d=json.loads(Path(f'sources/veillellm/{stem}.json').read_text(encoding='utf-8'))
              for x in d['incidents']:
                  assert x['secteur'] in sectors
                  assert x['type_menace'] in threats
                  assert x['localisation'] not in ('',None,'Inconnu')
              print(stem,d['metadata']['company_research_v4'])
          PY
      - name: Commit data
        run: |
          git config user.name "cyberwatch-bot"
          git config user.email "cyberwatch-bot@users.noreply.github.com"
          git add sources/veillellm/cyberattaque_org_2026.csv sources/veillellm/cyberattaque_org_2026.json sources/veillellm/frenchbreaches_2026.csv sources/veillellm/frenchbreaches_2026.json
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Resolve additional 2026 sectors from company identity evidence"
          git push origin HEAD:main
