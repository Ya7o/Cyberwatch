name: DISPATCH RESET 2026-08-30

on:
  push:
    paths:
      - ".github/workflows/dispatch-reset-20260830.yaml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher RESET TOTAL canonique
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run cold-reset.yml \
            --repo "$GH_REPO" \
            --ref main \
            -f reset_mode=zero \
            -f confirm_zero=RESET \
            -f start=2026-08-28 \
            -f semantic_passes=1 \
            -f source_facts_passes=1 \
            -f max_llm_cost_usd_per_pass=0.50 \
            -f publish=true
          echo "RESET TOTAL zero demandé depuis 2026-08-28 avec publication activée."
