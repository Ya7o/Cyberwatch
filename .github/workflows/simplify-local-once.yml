name: Simplify Local once

on:
  push:
    branches: [main]
    paths:
      - .github/local-simplify-trigger

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Simplifier les sources et l'UI
        run: |
          python -m py_compile .github/scripts/simplify_local.py
          python .github/scripts/simplify_local.py
          python -m py_compile cyberwatch/sources.py cyberwatch/runner.py cyberwatch/site.py cyberwatch/collectors/veillellm.py
          node --check assets/app.js
          node --check assets/app-legacy.js
          node --check assets/dashboard-audit.js

      - name: Tests code
        run: python -m pytest tests/ -q

      - name: Publier le code simplifié sur main
        run: |
          git config user.name "cyberwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/local-simplify-trigger
          rm -f .github/scripts/simplify_local.py
          rm -f .github/workflows/simplify-local-once.yml
          git add -A
          git commit -m "refactor: use Veille LLM for local coverage"
          git pull --rebase origin main
          python -m pytest tests/ -q
          node --check assets/app.js
          node --check assets/app-legacy.js
          node --check assets/dashboard-audit.js
          git push origin HEAD:main

      - name: Reconstruire le corpus sans presse Mayotte
        env:
          AS_OF: 2026-08-15T11:56:00+04:00
        run: |
          set -euo pipefail
          stable=0
          for attempt in 1 2 3; do
            echo "Tentative de stabilisation $attempt/3"
            git reset --hard HEAD
            git pull --ff-only origin main
            start_head=$(git rev-parse HEAD)

            env -u GITHUB_SHA python - <<'PY'
          from cyberwatch import store
          from cyberwatch.qualification import qualify
          from cyberwatch.runner import save_snapshot_provenance

          obsolete = {
              "KWEZI_NUMERIQUE",
              "MAYOTTE_HEBDO_NUMERIQUE",
              "JOURNAL_DE_MAYOTTE",
              "MAYOTTE_FM",
          }
          previous = store.load_snapshot()
          items = [item for item in store.load_items() if item.Source_ID not in obsolete]
          removed = len(store.load_items()) - len(items)
          qualified = qualify(items)
          store.save_items(qualified.items)
          store.save_incidents(qualified.incidents)
          save_snapshot_provenance(
              qualified.items,
              qualified.incidents,
              operation="LOCAL_SOURCE_RETIREMENT",
              run_id=previous.get("Run_ID", ""),
              mode=previous.get("Mode", ""),
              as_of=previous.get("As_Of", ""),
              target_start=previous.get("Target_Start", ""),
              target_end=previous.get("Target_End", ""),
          )
          print(f"LOCAL_ITEMS_REMOVED={removed}")
          PY

            env -u GITHUB_SHA python -m cyberwatch maj --layers all --as-of "$AS_OF"
            env -u GITHUB_SHA python -m cyberwatch check
            env -u GITHUB_SHA python -m cyberwatch test-repeat
            env -u GITHUB_SHA python -m cyberwatch baseline
            env -u GITHUB_SHA python -m cyberwatch build-site

            env -u GITHUB_SHA python - <<'PY'
          import csv
          import json

          from cyberwatch import sources, store

          obsolete = {
              "KWEZI_NUMERIQUE",
              "MAYOTTE_HEBDO_NUMERIQUE",
              "JOURNAL_DE_MAYOTTE",
              "MAYOTTE_FM",
          }
          active = {spec.source_id for spec in sources.active_sources()}
          assert active == {
              "FRENCHBREACHES",
              "BONJOURLAFUITE",
              "CYBERATTAQUE_ORG",
              "RANSOMWARE_LIVE",
              "VEILLE_LLM",
          }, active

          items = store.load_items()
          assert not any(item.Source_ID in obsolete for item in items)

          incidents = store.load_incidents()
          assert not any("faux comptes et fausses" in incident.Organisation.lower() for incident in incidents)

          with open("assets/data/status.json", encoding="utf-8") as handle:
              status = json.load(handle)
          assert status["counts"]["ok"] == 5, status["counts"]
          assert status["counts"]["partial"] == 0 and status["counts"]["fail"] == 0
          assert len(status["sources"]) == 5, [row["id"] for row in status["sources"]]
          assert not status.get("coverage_groups", {}).get("MAYOTTE_LOCAL")

          with open("assets/data/incidents.json", encoding="utf-8") as handle:
              payload = json.load(handle)
          local_rows = [row for row in payload if row.get("local")]
          assert local_rows, "aucun incident Local"
          assert all(row["local"].get("summary") for row in local_rows)
          assert all(isinstance(row["local"].get("score"), int) for row in local_rows)
          assert all(row["local"].get("references") for row in local_rows)
          mamoudzou = [
              row for row in local_rows
              if "mamoudzou" in row.get("org", "").lower() and row.get("date") == "2026-06-11"
          ]
          assert mamoudzou, "Mamoudzou absent du filtre Local"
          assert mamoudzou[0]["local"]["score"] == 100

          html = open("index.html", encoding="utf-8").read()
          audit = open("assets/dashboard-audit.js", encoding="utf-8").read()
          assert 'id="f-local"' in html and '>Local</button>' in html
          assert "f-presse-mahoraise" not in html + audit
          assert "f-veille-llm" not in html + audit
          assert "Score cyberattaque" in audit and "Synthèse" in audit

          print(
              f"ACTIVE={len(active)} ITEMS={len(items)} INCIDENTS={len(incidents)} "
              f"LOCAL={len(local_rows)} MAMOUDZOU_SCORE={mamoudzou[0]['local']['score']}"
          )
          PY

            remote_head=$(git ls-remote origin refs/heads/main | awk '{print $1}')
            if [ "$remote_head" = "$start_head" ]; then
              stable=1
              break
            fi
            echo "main a avancé pendant la collecte ; résultat jeté et relancé."
          done
          test "$stable" = 1

      - name: Publier les données finales
        run: |
          git add -A
          git commit -m "data: rebuild local coverage"
          git push origin HEAD:main
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publier v0.7.29
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/release.json
          import json, os
          body = """## Local\n- Veille LLM devient la source locale unique pour La Réunion et Mayotte.\n- Le filtre dashboard « Local » remplace « Veille LLM » et « Presse mahoraise ».\n- En mode Local, chaque incident affiche le score cyberattaque, la synthèse et les références documentaires.\n\n## Simplification\n- Retrait de Kwezi, Mayotte Hebdo, Journal de Mayotte et Mayotte FM du pipeline actif.\n- Suppression de la logique et de l’inventaire Lot 1 presse Mayotte.\n- Purge des items issus exclusivement de ces collecteurs, dont les faux positifs observés.\n\n## Validation\n- Suite pytest PASS.\n- `check` PASS.\n- `test-repeat` PASS.\n- 5/5 sources actives OK, 0 PARTIAL, 0 FAIL.\n- Mamoudzou reste présent dans Local avec score 100 et ses références.\n"""
          print(json.dumps({
              "tag_name": "v0.7.29",
              "target_commitish": os.environ["FINAL_SHA"],
              "name": "v0.7.29 — Local simplifié",
              "body": body,
              "draft": False,
              "prerelease": False,
          }))
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            --data-binary @/tmp/release.json
