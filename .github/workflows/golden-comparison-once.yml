name: Golden comparison on clean rebuild (one-shot)

on:
  push:
    branches:
      - agent/golden-comparison-20260817
    paths:
      - .github/workflows/golden-comparison-once.yml

permissions:
  contents: write
  actions: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      REBUILD_RUN_ID: "31995251021"
    steps:
      - name: Checkout comparison branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/golden-comparison-20260817

      - name: Wait for validated clean rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 180); do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REBUILD_RUN_ID}" --jq .status)"
            conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REBUILD_RUN_ID}" --jq '.conclusion // ""')"
            echo "rebuild status=${status} conclusion=${conclusion}"
            if [ "$status" = "completed" ]; then
              [ "$conclusion" = "success" ] || exit 1
              exit 0
            fi
            sleep 30
          done
          echo "Timed out waiting for rebuild ${REBUILD_RUN_ID}" >&2
          exit 1

      - name: Download validated rebuild artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/rebuild
          mkdir -p /tmp/rebuild
          gh run download "$REBUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name rebuild-baseline-output --dir /tmp/rebuild
          test -f /tmp/rebuild/data/incidents.csv
          test -f /tmp/rebuild/data/items.csv
          echo "Downloaded clean rebuild: $(wc -l < /tmp/rebuild/data/incidents.csv) incident CSV lines"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Materialize validated DB on comparison branch
        run: |
          set -euo pipefail
          rsync -a /tmp/rebuild/data/ data/
          mkdir -p assets/data
          rsync -a /tmp/rebuild/assets/data/ assets/data/
          python -m cyberwatch check

      - name: Compare clean DB and three LLM JSON snapshots to golden
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path
          from cyberwatch.golden import read_csv, validate_file, write_csv
          from cyberwatch.golden_challengers import COMPARISON_DETAIL_COLUMNS, compare_challengers, load_optional_csv

          ROOT = Path('.')
          golden_path = ROOT / 'data/golden/qualification_golden.csv'
          problems = validate_file(golden_path)
          if problems:
              raise SystemExit('golden invalid:\n- ' + '\n- '.join(problems))

          def json_incidents(path: Path):
              payload = json.loads(path.read_text(encoding='utf-8'))
              rows = payload.get('incidents', payload if isinstance(payload, list) else [])
              out = []
              for source in rows:
                  row = dict(source)
                  urls = row.get('sources') or row.get('source_urls') or row.get('Source_URLs') or []
                  if isinstance(urls, list):
                      row['source_urls'] = ' | '.join(str(v).strip() for v in urls if str(v).strip())
                  else:
                      row['source_urls'] = str(urls or '')
                  out.append(row)
              return out

          golden = read_csv(golden_path)
          incidents = read_csv(ROOT / 'data/incidents.csv')
          challengers = {
              'FRENCHBREACHES_LLM_JSON': json_incidents(ROOT / 'sources/veillellm/frenchbreaches_2026.json'),
              'CYBERATTAQUE_ORG_LLM_JSON': json_incidents(ROOT / 'sources/veillellm/cyberattaque_org_2026.json'),
              'VEILLE_LLM_REUNION_MAYOTTE_JSON': json_incidents(ROOT / 'sources/veillellm/cyberattaques_reunion_mayotte_2026.json'),
          }
          manual = load_optional_csv(ROOT / 'data/golden/challenger_matches.csv')
          result = compare_challengers(golden, incidents, challengers, manual)
          details = result.pop('details')

          out_dir = ROOT / 'bench/results/golden_2026-08-17_clean_rebuild'
          out_dir.mkdir(parents=True, exist_ok=True)
          write_csv(out_dir / 'comparison_detail.csv', details, COMPARISON_DETAIL_COLUMNS)
          (out_dir / 'summary.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')

          lines = [
              '# Golden qualification — clean rebuild vs 3 LLM JSON',
              '',
              f'- Golden cases: **{result["cases"]}**',
              f'- Clean rebuild run: **{__import__("os").environ.get("REBUILD_RUN_ID", "")}**',
              '',
              '## Scores',
              '',
              '| Source | Matched | Secteur accuracy | Menace accuracy | Localisation accuracy |',
              '|---|---:|---:|---:|---:|',
          ]

          def add_score(name, payload):
              fields = payload['fields']
              lines.append(
                  f'| {name} | {payload["matched"]}/{result["cases"]} | '
                  f'{fields["Secteur"]["accuracy_pct"]:.1f}% | '
                  f'{fields["Menace"]["accuracy_pct"]:.1f}% | '
                  f'{fields["Localisation"]["accuracy_pct"]:.1f}% |'
              )

          add_score('CYBERWATCH_DB', result['db'])
          for name, payload in result['challengers'].items():
              add_score(name, payload)

          lines += ['', '## Delta LLM vs DB sur cas communs', '', '| Challenger | Champ | Cas communs | Delta accuracy | Gains | Régressions |', '|---|---|---:|---:|---:|---:|']
          for name, fields in result['pairwise_vs_db'].items():
              for field, metrics in fields.items():
                  lines.append(
                      f'| {name} | {field} | {metrics["common_matched_cases"]} | '
                      f'{metrics["delta_accuracy_pp"]:+.1f} pp | {metrics["gains"]} | {metrics["regressions"]} |'
                  )

          (out_dir / 'summary.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          PY

      - name: Publish benchmark summary
        run: cat bench/results/golden_2026-08-17_clean_rebuild/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit clean DB and benchmark results to branch
        run: |
          set -euo pipefail
          git config user.name "cyberwatch-bot"
          git config user.email "cyberwatch-bot@users.noreply.github.com"
          git add data/ assets/data/ bench/results/golden_2026-08-17_clean_rebuild/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "data: clean rebuild and golden comparison 2026-08-17"
          git push origin HEAD:agent/golden-comparison-20260817
