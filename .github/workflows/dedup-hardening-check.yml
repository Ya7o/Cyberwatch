name: Dedup hardening check

on:
  push:
    branches: [codex/dedup-hardening]

permissions:
  contents: read

jobs:
  dedup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Dedup tests
        run: python -m pytest tests/test_dedup.py tests/test_dedup_contract.py tests/test_dedup_hardening.py tests/test_dedup_invariants.py tests/test_dedup_metrics.py tests/test_dedup_audit_fixes.py -q
      - name: Golden dedup
        run: python scripts/evaluate_dedup_golden.py
      - name: Weak merge export smoke test
        run: python scripts/export_dedup_weak_merges.py --output /tmp/dedup_weak_merges.csv
