name: Probe Ransomware.live (one-shot)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-ransomware-live-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe endpoints
        shell: bash
        run: |
          set +e
          for url in \
            "https://api.ransomware.live/v2/countryvictims/FR" \
            "https://api.ransomware.live/countryvictims/FR" \
            "https://api.ransomware.live/allcyberattacks" \
            "https://api.ransomware.live/recentvictims" \
            "https://api.ransomware.live/groups" \
            "https://api-pro.ransomware.live/groups"
          do
            echo "===== $url ====="
            code=$(curl -L -sS --connect-timeout 10 --max-time 30 -o /tmp/body -w '%{http_code}' "$url")
            rc=$?
            echo "curl_rc=$rc http=$code bytes=$(wc -c </tmp/body 2>/dev/null || echo 0)"
            head -c 500 /tmp/body 2>/dev/null || true
            echo
          done
