name: Veille cumulative 2026 one-off

on:
  push:
    paths:
      - '.github/workflows/veille-cumulative-oneoff.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate, merge curated deltas, and publish
        shell: bash
        run: |
          python - <<'PY'
          import csv, hashlib, io, json, re, subprocess
          from copy import deepcopy
          from datetime import datetime
          from pathlib import Path
          from urllib.parse import urlparse

          ROOT = Path('sources/veillellm')
          NOW = '2026-08-19T08:59:39+04:00'
          FIELDS = ['date','organisation','territoire','localisation','secteur','type_menace','acteur','statut','score_cyberattaque','impact_connu','sources','synthese','evolution']
          CSV_FIELDS = ['date','organisation','territoire','localisation','secteur','type_menace','acteur','statut','score_cyberattaque','impact_connu','source_urls','synthese','evolution']
          SECTORS = {'Administration / Collectivité','Santé','Éducation / Formation','Finance / Assurance','Transport / Logistique','Sport','Commerce / Distribution','Numérique / Technologie','Énergie / Utilities','Industrie / Manufacture','Construction / BTP','Services aux entreprises','Inconnu'}
          THREATS = {'Ransomware','DDoS','Malware','Compromission de compte / messagerie','Intrusion','Fuite de données','Phishing / fraude','Incident tiers','Autre cyber','Inconnu'}
          EVOLS = {'nouveau','enrichi','corrige','inchange'}
          EXPECTED = {
            'cyberattaques_reunion_mayotte_2026.json':'1b81f35cb6661d90dc8c43c9a685f09f1e707809',
            'cyberattaques_reunion_mayotte_2026.csv':'311c6c3a6bfad4a73498b613032d6d2399b16883',
            'cyberattaque_org_2026.json':'6a8bd031b03c4777c27abdf41d970cb95f6afb32',
            'cyberattaque_org_2026.csv':'cf86660513b4023f8ca2788ace0dd89e00a27b06',
            'frenchbreaches_2026.json':'02fa9d3e1cd94d4ce1ce32c6554cbfe18508dcde',
            'frenchbreaches_2026.csv':'5eb7da1e0f91bf4ad0689d4fe4889e868c3e2dcd',
          }
          def blob_sha(path):
              data = path.read_bytes()
              h = hashlib.sha1()
              h.update(f'blob {len(data)}\0'.encode())
              h.update(data)
              return h.hexdigest()
          for name, sha in EXPECTED.items():
              got = blob_sha(ROOT/name)
              if got != sha:
                  raise SystemExit(f'ANTI-REGRESSION: {name} SHA attendu {sha}, obtenu {got}')

          def load(name):
              obj=json.loads((ROOT/name).read_text(encoding='utf-8'))
              if set(obj.keys()) != {'metadata','incidents'}: raise ValueError(f'{name}: racine invalide')
              return obj
          local = load('cyberattaques_reunion_mayotte_2026.json')
          cyber = load('cyberattaque_org_2026.json')
          french = load('frenchbreaches_2026.json')
          old = {'local':deepcopy(local), 'cyber':deepcopy(cyber), 'french':deepcopy(french)}
          if local['metadata'].get('schema')!='cyberwatch-canonical-v1': raise SystemExit('schema local inattendu')
          if cyber['metadata'].get('schema')!='cyberwatch-global-source-v1': raise SystemExit('schema cyber inattendu')
          if french['metadata'].get('schema')!='cyberwatch-global-source-v1': raise SystemExit('schema french inattendu')

          # Every pre-existing record is unchanged unless explicitly corrected below.
          for corpus in (local, cyber, french):
              for inc in corpus['incidents']:
                  inc['evolution']='inchange'

          def inc(date, organisation, territoire, localisation, secteur, menace, acteur, statut, score, impact, url, synthese):
              return {'date':date,'organisation':organisation,'territoire':territoire,'localisation':localisation,'secteur':secteur,'type_menace':menace,'acteur':acteur,'statut':statut,'score_cyberattaque':score,'impact_connu':impact,'sources':[url],'synthese':synthese,'evolution':'nouveau'}

          cyber_new = [
            inc('2026-08-18','Aastrio / Monday','France','Paris','Services aux entreprises','Fuite de données','Inconnu','Ancienne base diffusée ; aucune compromission récente démontrée',60,'Une sauvegarde attribuée à un ancien portail collaboratif, contenant des données sensibles de 26 personnes, circule dans un espace cybercriminel ; les données les plus récentes datent de 2018.','https://www.cyberattaque.org/aastrio-monday-une-ancienne-base-de-donnees-refait-surface-huit-ans-plus-tard/','Diffusion confirmée d’une ancienne base attribuée à Aastrio/Monday ; l’origine de la base et l’existence d’une intrusion récente ne sont pas établies.'),
            inc('2026-08-18','Clenet','France','France','Commerce / Distribution','Intrusion','Non identifié publiquement','Cyberattaque confirmée par la victime',100,'Clenet confirme une intrusion malveillante dans son extranet BLG, avec accès non autorisé à des coordonnées, pièces jointes et e-mails de clients et fournisseurs.','https://www.cyberattaque.org/clenet-des-pirates-exploitent-une-faille-de-son-extranet-et-accedent-aux-donnees-clients-et-fournisseurs/','Intrusion confirmée par Clenet ; une faille du mécanisme de création de comptes extranet aurait été exploitée.'),
            inc('2026-08-18','Actis Location','France','France','Services aux entreprises','Intrusion','Non identifié publiquement','Cyberattaque confirmée par la victime',100,'Un accès non autorisé à un outil de relation client a exposé des données personnelles et, selon les dossiers, des factures, devis, courriels et RIB.','https://www.cyberattaque.org/actis-location-factures-devis-et-rib-de-clients-exposes-apres-une-cyberattaque/','Actis Location confirme l’accès non autorisé et a déclaré l’incident à la CNIL ; le vecteur et le nombre de personnes touchées restent inconnus.'),
            inc('2026-08-18','Gedimat','France','France','Commerce / Distribution','Fuite de données','Non identifié publiquement','Cyberattaque confirmée par la victime',100,'Gedimat confirme l’exposition de noms, prénoms, adresses e-mail et numéros de téléphone de clients web ; mots de passe, données bancaires et historiques d’achat ne sont pas concernés selon l’enseigne.','https://www.cyberattaque.org/gedimat-pirate-les-coordonnees-de-clients-web-exposees-apres-une-cyberattaque/','Compromission de données de contact confirmée par Gedimat et déclarée à la CNIL.'),
            inc('2026-08-18','KparK','France','France','Construction / BTP','Incident tiers','Non identifié publiquement','Incident confirmé ; origine exacte du compte compromis non attribuée à KparK',100,'Des numéros de téléphone figurant dans des fichiers de prospection transmis à Bloctel ont été accessibles après l’usurpation d’un compte professionnel utilisateur du service.','https://www.cyberattaque.org/kpark-ses-fichiers-de-prospection-touches-par-le-piratage-de-bloctel/','KparK confirme que des données de ses prospects sont concernées par l’incident Bloctel, sans preuve que ses propres systèmes ou son propre compte soient le point d’entrée.'),
            inc('2026-08-18','Taveau','France','France','Commerce / Distribution','Fuite de données','ChimeraZ','Données publiées ; compromission liée à BlgCloud',90,'Les attaquants publient 21,2 Go et 107 125 fichiers attribués à l’environnement BlgCloud de Taveau, dont e-mails, CRM, factures et documents logistiques.','https://www.cyberattaque.org/taveau-plus-de-107-000-fichiers-internes-diffuses-apres-une-cyberattaque/','Fuite de données documentée à partir d’un environnement BlgCloud client ; le point d’entrée dans l’infrastructure propre de Taveau n’est pas démontré.'),
            inc('2026-08-18','DGFiP','France','France','Administration / Collectivité','Intrusion','ZeroBytes','Cyberattaque confirmée par l’administration',100,'La DGFiP reconnaît un vol de données cadastrales touchant environ 1,8 million de comptes et le vol d’éléments du portail des successions vacantes.','https://www.cyberattaque.org/dgfip-cadastre-succession-vacantes-3eme-fuite-pour-bercy/','L’administration confirme plusieurs compromissions et vols de données ; la vulnérabilité du portail des successions vacantes aurait depuis été corrigée.'),
            inc('2026-08-18','Foodtrack','France','France','Commerce / Distribution','Intrusion','Jaded','Revendication crédible avec échantillon ; non confirmée officiellement',75,'Un acteur revendique la base de 1 197 utilisateurs, des données de commandes et messages, des empreintes de mots de passe ainsi qu’un accès administrateur.','https://www.cyberattaque.org/foodtrack-une-cyberattaque-expose-les-donnees-de-1-197-utilisateurs/','Revendication étayée par un échantillon ; l’accès administrateur, le vecteur et l’authenticité de l’ensemble des données restent à confirmer.'),
            inc('2026-08-18','Ministère de l’Éducation nationale','France','France','Éducation / Formation','Intrusion','ZeroBytes','Revendication fortement étayée ; ampleur non confirmée intégralement',85,'ZeroBytes revendique environ 43 Go et 346 millions de lignes brutes issues de plusieurs systèmes ; des échantillons comportent des données d’élèves, responsables légaux et personnels.','https://www.cyberattaque.org/education-nationale-zerobytes-cyberatatque/','Des échantillons cohérents avec plusieurs systèmes de l’Éducation nationale ont été analysés ; le volume total revendiqué n’est pas confirmé dans son intégralité.'),
            inc('2026-08-17','Syndicat Départemental d’Énergie de l’Allier (SDE 03)','France','Allier','Énergie / Utilities','Intrusion','X-VDP-X / diable’fire','Revendication avec preuves techniques ; non confirmée officiellement',80,'Le collectif revendique 7 bases, 2 440 tables, environ 238 Mo et des données concernant 4 122 personnes, avec captures d’un accès administrateur Metabase et revendication d’accès SMTP.','https://www.cyberattaque.org/syndicat-departemental-energie-de-lallier-cyberattaque/','Intrusion revendiquée contre un syndicat public de l’énergie ; les preuves publiées renforcent la crédibilité sans constituer une confirmation officielle.'),
            inc('2026-08-17','SamBoat','France','France','Inconnu','Intrusion','Non identifié publiquement','Cyberattaque confirmée par la victime',100,'SamBoat confirme un accès non autorisé et la copie de noms, prénoms, dates de naissance, e-mails et téléphones ; coordonnées bancaires et pièces d’identité sont annoncées non concernées.','https://www.cyberattaque.org/samboat-la-plateforme-de-location-de-bateaux-frappee-par-une-cyberattaque-majeure/','Cyberattaque confirmée par SamBoat. Activité identifiée (plateforme de location de bateaux/tourisme) mais hors taxonomie Cyberwatch.'),
            inc('2026-08-17','Ville de Marennes-Hiers-Brouage','France','Marennes-Hiers-Brouage','Administration / Collectivité','Compromission de compte / messagerie','Non identifié publiquement','Cyberattaque confirmée officiellement',100,'Certaines messageries de la mairie sont compromises et peuvent servir à envoyer des e-mails frauduleux depuis des adresses officielles @marennes.fr.','https://www.cyberattaque.org/cyberattaque-a-marennes-hiers-brouage-des-pirates-utilisent-les-emails-de-la-mairie/','La Ville confirme l’attaque et la compromission de messageries ; aucune exfiltration de données n’est établie à ce stade.')
          ]

          french_new = [
            inc('2026-08-19','KparK','France','France','Construction / BTP','Incident tiers','Non identifié publiquement','Confirmé par la victime',100,'KparK confirme qu’un tiers a usurpé un compte professionnel Bloctel et téléchargé des fichiers contenant des numéros de téléphone liés à sa prospection.','https://frenchbreaches.com/alertes/kpark-mszck35nr7j8i75741n','Incident confirmé et notifié à la CNIL ; le propriétaire exact du compte professionnel compromis et la méthode d’usurpation restent inconnus.'),
            inc('2026-08-19','Clenet (BlgCloud)','France','France','Commerce / Distribution','Intrusion','Non identifié publiquement','Confirmé par la victime',100,'Une intrusion malveillante dans l’ERP BLG de l’extranet clients/fournisseurs a pu exposer coordonnées, pièces jointes et e-mails.','https://frenchbreaches.com/alertes/clenet-blgcloud-mszchi4ekakmbzdtap','Clenet confirme l’incident ; une faille de création de comptes extranet aurait été exploitée, tandis que mots de passe et données bancaires sont annoncés non concernés.'),
            inc('2026-08-19','Actis Location','France','France','Services aux entreprises','Intrusion','Non identifié publiquement','Confirmé par la victime',100,'Actis Location confirme un accès non autorisé à des données personnelles et à des documents/courriels contractuels, incluant parfois factures, devis et RIB.','https://frenchbreaches.com/alertes/actis-location-mszcfq4rpfe01mp58ei','Incident confirmé par Actis Location et déclaré à la CNIL ; vecteur et volume restent non documentés.'),
            inc('2026-08-18','Taveau (BlgCloud)','France','France','Commerce / Distribution','Fuite de données','ChimeraZ','Confirmée par FrenchBreaches avec lien à l’incident BlgCloud',90,'21,2 Go et plus de 107 000 fichiers attribués à Taveau ont été publiés, comprenant notamment documents et e-mails professionnels.','https://frenchbreaches.com/alertes/taveau-blgcloud-msyvca8i1xz1mwgxx1','Fuite liée à un environnement client BlgCloud ; la compromission de l’infrastructure générale de Taveau n’est pas démontrée.'),
            inc('2026-08-18','Foodtrack','France','France','Commerce / Distribution','Intrusion','Jaded','Revendiquée (crédible)',75,'Une base de 1 197 utilisateurs et un accès administrateur sont revendiqués, avec données de contact, commandes, messages, jetons et empreintes de mots de passe.','https://frenchbreaches.com/alertes/foodtrack-msxx35cw3msrmak9egh','Revendication accompagnée d’un échantillon ; accès administrateur et périmètre complet non confirmés.'),
            inc('2026-08-17','Ministère de l’Éducation nationale','France','France','Éducation / Formation','Intrusion','ZeroBytes','Revendiquée (crédible), avec incident antérieur confirmé par le ministère',90,'Environ 43 Go et 346 millions de lignes brutes sont revendiqués, couvrant élèves, responsables légaux et personnels ; des ensembles de données sur plusieurs décennies sont décrits.','https://frenchbreaches.com/alertes/minist-re-de-l-ducation-nationale-msxi5ti3ty651shezo','La revendication élargit un incident que le ministère avait déjà confirmé fin juillet ; l’ampleur totale revendiquée reste à distinguer de cette confirmation.'),
            inc('2026-08-17','SamBoat','France','France','Inconnu','Intrusion','Non identifié publiquement','Confirmé par la victime',100,'SamBoat confirme un accès non autorisé à ses systèmes et la copie de noms, prénoms, dates de naissance, e-mails et numéros de téléphone.','https://frenchbreaches.com/alertes/samboat-mswbi07qx6mqo23f4un','Fuite confirmée officiellement. Activité identifiée (plateforme de location de bateaux/tourisme) mais hors taxonomie Cyberwatch.')
          ]

          def has_url(corpus, url):
              return any(url in x.get('sources',[]) for x in corpus['incidents'])
          for x in reversed(cyber_new):
              if not has_url(cyber, x['sources'][0]): cyber['incidents'].insert(0,x)
          for x in reversed(french_new):
              if not has_url(french, x['sources'][0]): french['incidents'].insert(0,x)

          # Correct the Chupin homonym/identity error using official/legal evidence: Bressuire, Deux-Sèvres, not La Réunion.
          cyber_chupin_url='https://www.cyberattaque.org/chupin-sarl-16-go-et-plus-de-70-000-fichiers-publies-apres-le-piratage-de-son-compte-blgcloud/'
          for x in cyber['incidents']:
              if cyber_chupin_url in x.get('sources',[]):
                  changed=False
                  for k,v in {'territoire':'France','localisation':'Bressuire','secteur':'Commerce / Distribution'}.items():
                      if x.get(k)!=v: x[k]=v; changed=True
                  if changed:
                      x['evolution']='corrige'
                      x['synthese']='Données publiées depuis l’environnement BlgCloud de Chupin SARL. L’identité de la victime est ancrée à Bressuire (Deux-Sèvres), commerce de matériel agricole ; la précédente localisation à La Réunion résultait d’un homonyme mal ancré.'
          for x in french['incidents']:
              if x.get('organisation')=='Chupin (BlgCloud)':
                  changed=False
                  for k,v in {'territoire':'France','localisation':'Bressuire','secteur':'Commerce / Distribution'}.items():
                      if x.get(k)!=v: x[k]=v; changed=True
                  if changed:
                      x['evolution']='corrige'
                      x['synthese']='Alerte FrenchBreaches liée à Chupin/BlgCloud. Victime ancrée à Bressuire (Deux-Sèvres), commerce de matériel agricole ; correction d’identité/localisation fondée sur les données légales et le site officiel.'

          # Local corpus: no new in-scope event found. Explicitly exclude the Chupin homonym.
          m=local['metadata']; m['generated_at']=NOW; m['record_count']=len(local['incidents'])
          m['watch_result']={'new_incidents':0,'enriched_incidents':0,'corrected_incidents':0,'unchanged_incidents':len(local['incidents']),'note':'Veille cumulative au 19 août 2026 : aucun nouvel incident Réunion/Mayotte validé. Le candidat Chupin SARL a été exclu après ancrage à Bressuire (Deux-Sèvres).'}
          cov=m.setdefault('coverage',{})
          cov['method']='Balayage ciblé Réunion/Mayotte : communes, collectivités, services publics, santé, éducation, transports, eau, énergie, télécoms, infrastructures, entreprises et médias, avec recherches web et signaux sociaux indexables.'
          cov['limitations']='Couverture sociale incomplète : Facebook, Instagram, X, LinkedIn et TikTok ne rendent pas toutes les publications officielles indexables/récupérables. Les signaux inaccessibles ne sont pas interprétés comme une absence d’incident.'
          exc=cov.setdefault('excluded_candidates',[])
          if not any(e.get('organisation')=='Chupin SARL' for e in exc if isinstance(e,dict)):
              exc.append({'organisation':'Chupin SARL','reason':'Homonyme écarté : l’entreprise visée par l’incident BlgCloud est ancrée à Bressuire (Deux-Sèvres), pas à La Réunion.'})

          def update_meta(corpus, note, limitations):
              md=corpus['metadata']; md['generated_at']=NOW; md['record_count']=len(corpus['incidents'])
              counts={k:sum(1 for x in corpus['incidents'] if x['evolution']==k) for k in EVOLS}
              md['watch_result']={'new_incidents':counts['nouveau'],'enriched_incidents':counts['enrichi'],'corrected_incidents':counts['corrige'],'unchanged_incidents':counts['inchange'],'note':note}
              col=md.setdefault('collection',{}); col['limitations']=limitations
              ea=md.get('enrichment_after')
              if isinstance(ea,dict):
                  ea['sector_unknown']=sum(x['secteur']=='Inconnu' for x in corpus['incidents'])
                  ea['threat_unknown']=sum(x['type_menace']=='Inconnu' for x in corpus['incidents'])
                  ea['location_unknown']=sum(x['localisation']=='Inconnu' for x in corpus['incidents'])
                  ea['location_non_documented']=sum(x['localisation']=='Non documenté publiquement' for x in corpus['incidents'])
          update_meta(cyber,'Veille incrémentale depuis la baseline du 17 août : nouvelles entrées des 17–18 août, plus correction d’homonyme Chupin SARL.','Collecte incrémentale de la catégorie Attaque. Les entrées antérieures sont conservées ; seules les nouvelles publications et corrections étayées sont modifiées.')
          update_meta(french,'Veille incrémentale depuis la baseline du 17 août : nouvelles alertes des 17–19 août, plus correction d’homonyme Chupin.','Le flux RSS application/rss+xml n’était pas exploitable par le client de veille de cette exécution ; repli sur la page d’accueil, les archives indexées et les pages d’alertes. Historique antérieur conservé.')

          def validate(name, corpus, old_corpus, schema, local_scope=False):
              if corpus['metadata'].get('schema')!=schema: raise ValueError(f'{name}: schema perdu')
              arr=corpus['incidents']
              if not arr: raise ValueError(f'{name}: corpus vide')
              if corpus['metadata'].get('record_count')!=len(arr): raise ValueError(f'{name}: record_count')
              seen_urls=set(); seen_keys=set()
              for i,x in enumerate(arr):
                  if set(x.keys())!=set(FIELDS): raise ValueError(f'{name}[{i}]: champs {set(x)-set(FIELDS)} / manquants {set(FIELDS)-set(x)}')
                  datetime.strptime(x['date'],'%Y-%m-%d')
                  for k in ['organisation','territoire','localisation','secteur','type_menace','acteur','statut','impact_connu','synthese','evolution']:
                      if not isinstance(x[k],str) or not x[k].strip(): raise ValueError(f'{name}[{i}]: {k} vide')
                  if x['localisation']=='Inconnu': raise ValueError(f'{name}[{i}]: localisation Inconnu')
                  if x['secteur'] not in SECTORS or x['type_menace'] not in THREATS or x['evolution'] not in EVOLS: raise ValueError(f'{name}[{i}]: taxonomie')
                  if type(x['score_cyberattaque']) is not int or not 0<=x['score_cyberattaque']<=100: raise ValueError(f'{name}[{i}]: score')
                  if not isinstance(x['sources'],list) or not x['sources']: raise ValueError(f'{name}[{i}]: sources')
                  for u in x['sources']:
                      p=urlparse(u)
                      if p.scheme not in ('http','https') or not p.netloc: raise ValueError(f'{name}[{i}]: URL {u}')
                  if local_scope and x['territoire'] not in {'La Réunion','Mayotte','Inconnu'}: raise ValueError(f'{name}[{i}]: territoire local')
                  strict=tuple(json.dumps(x[k],ensure_ascii=False,sort_keys=True) for k in FIELDS if k!='evolution')
                  if strict in seen_keys: raise ValueError(f'{name}: doublon strict')
                  seen_keys.add(strict)
                  primary=x['sources'][0]
                  if primary in seen_urls: raise ValueError(f'{name}: URL primaire dupliquée {primary}')
                  seen_urls.add(primary)
              if len(arr) < len(old_corpus['incidents']): raise ValueError(f'{name}: suppression anti-régression')
              old_urls={u for x in old_corpus['incidents'] for u in x.get('sources',[])}
              new_urls={u for x in arr for u in x.get('sources',[])}
              missing=old_urls-new_urls
              if missing: raise ValueError(f'{name}: anciennes sources perdues: {list(missing)[:3]}')
              # Only a very small number of pre-existing business records may be corrected in this run.
              old_by_url={x['sources'][0]:x for x in old_corpus['incidents'] if x.get('sources')}
              changed=0
              for x in arr:
                  u=x['sources'][0]
                  if u in old_by_url:
                      a=old_by_url[u]
                      business=[k for k in FIELDS if k!='evolution']
                      if any(x[k]!=a[k] for k in business): changed+=1
              if changed>3: raise ValueError(f'{name}: trop de corrections métier préexistantes ({changed})')

          validate('local',local,old['local'],'cyberwatch-canonical-v1',True)
          validate('cyber',cyber,old['cyber'],'cyberwatch-global-source-v1')
          validate('french',french,old['french'],'cyberwatch-global-source-v1')

          def csv_text(corpus):
              sio=io.StringIO(newline='')
              w=csv.DictWriter(sio,fieldnames=CSV_FIELDS,lineterminator='\n')
              w.writeheader()
              for x in corpus['incidents']:
                  row={k:x[k] for k in CSV_FIELDS if k not in {'source_urls'}}
                  row['source_urls']=' | '.join(x['sources'])
                  w.writerow(row)
              return sio.getvalue()
          def parity(corpus, text):
              rows=list(csv.DictReader(io.StringIO(text)))
              if len(rows)!=len(corpus['incidents']): raise ValueError('parité longueur')
              for x,r in zip(corpus['incidents'],rows):
                  for k in ['date','organisation','territoire','localisation','secteur','type_menace','acteur','statut','impact_connu','synthese','evolution']:
                      if r[k]!=x[k]: raise ValueError(f'parité {k}')
                  if int(r['score_cyberattaque'])!=x['score_cyberattaque']: raise ValueError('parité score')
                  if r['source_urls']!=' | '.join(x['sources']): raise ValueError('parité sources')

          outputs={
            'cyberattaques_reunion_mayotte_2026.json':json.dumps(local,ensure_ascii=False,indent=2)+'\n',
            'cyberattaque_org_2026.json':json.dumps(cyber,ensure_ascii=False,indent=2)+'\n',
            'frenchbreaches_2026.json':json.dumps(french,ensure_ascii=False,indent=2)+'\n',
          }
          outputs['cyberattaques_reunion_mayotte_2026.csv']=csv_text(local)
