name: Dedup Final Sync Replay
on:
  push:
    branches: [agent/dedup-closeout]
permissions:
  contents: write
jobs:
  replay:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/dedup-closeout
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Full tests and certified golden
        run: |
          python -m pytest tests/ -q
          python scripts/evaluate_dedup_golden.py
      - name: Certified dedup-only replay
        run: |
          python - <<'PY'
          from cyberwatch import identity, incident_identity, site, store
          from cyberwatch.dedup import build_incidents_with_registry
          from cyberwatch.runner import pre_export_checks, save_snapshot_provenance

          items = store.load_items()
          old_incidents = store.load_incidents()
          old_ids = {incident.Incident_ID for incident in old_incidents}
          items_hash_before = identity.items_hash(items)
          registry = store.load_incident_id_registry()
          if not registry:
              registry = incident_identity.bootstrap_registry(items, old_incidents)
          incidents, registry = build_incidents_with_registry(items, registry)

          problems = [p for p in pre_export_checks(items, incidents, []) if 'RUN_SOURCES' not in p]
          problems.extend(incident_identity.validate_registry(registry, items, incidents))
          if problems:
              raise SystemExit('REPLAY BLOCKED: ' + ' ; '.join(problems))

          active_ids = {incident.Incident_ID for incident in incidents}
          rows = {row['Incident_ID']: row for row in registry}
          unresolved = sorted(i for i in old_ids if i not in active_ids and not rows.get(i, {}).get('Redirect_To'))
          redirected = sorted(i for i in old_ids if rows.get(i, {}).get('Redirect_To'))
          new_active = sorted(active_ids - old_ids)
          print(f'OLD={len(old_incidents)} NEW={len(incidents)} NEW_ACTIVE={new_active} REDIRECTED={redirected} UNRESOLVED={unresolved}')
          if len(old_incidents) != 842 or len(incidents) != 841:
              raise SystemExit(f'expected 842->841, got {len(old_incidents)}->{len(incidents)}')
          if unresolved or new_active or len(redirected) != 1:
              raise SystemExit(f'identity transition invalid: new={new_active} redirect={redirected} unresolved={unresolved}')
          if identity.items_hash(items) != items_hash_before:
              raise SystemExit('ITEMS changed during dedup replay')

          store.save_incidents(incidents)
          store.save_incident_id_registry(registry)
          save_snapshot_provenance(items, incidents, operation='DEDUP_CERTIFIED_REPLAY', as_of='2026-08-17T16:47:00+04:00')
          site.build()
          PY
      - name: Incident ID lifecycle audit
        run: |
          python - <<'PY'
          from dataclasses import replace
          from cyberwatch import identity, sources, store
          from cyberwatch.dedup import build_incidents_with_registry, group_components
          items=store.load_items(); registry=store.load_incident_id_registry()
          active=sorted(spec.source_id for spec in sources.ALL_SOURCES if spec.active)
          failures=[]; checked=0
          for component in group_components(items):
              before,_=build_incidents_with_registry(component, registry)
              if len(before)!=1: continue
              ordered=identity.sort_items(component); existing={i.Source_ID for i in component}
              earlier=[s for s in active if s not in existing and s < ordered[0].Source_ID]
              if not earlier: continue
              base=ordered[0]; source=earlier[0]
              clone=replace(base, Item_ID='', Source_ID=source, Source_Item_ID='', URL=f'https://audit.invalid/{base.Item_ID}', Collected_As_Of='2026-08-18T00:00:00+04:00')
              clone.Item_ID=identity.item_id(clone.Source_ID, clone.Published_Date, clone.Organisation_Key, clone.URL, clone.Source_Item_ID)
              after,_=build_incidents_with_registry(component+[clone], registry); checked+=1
              if len(after)!=1 or after[0].Incident_ID!=before[0].Incident_ID:
                  failures.append((before[0].Incident_ID,base.Organisation_Raw,source))
          print(f'LIFECYCLE_CHECKED={checked} FAILURES={len(failures)}')
          if failures: raise SystemExit(str(failures[:10]))
          PY
      - name: Repeatability and structure
        run: |
          python -m cyberwatch test-repeat
          python -m cyberwatch check
      - name: Restore unrelated test caches
        run: git checkout -- data/source_facts_ai_cache.json data/source_facts_ai_usage.json
      - name: Scope gate
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          echo "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(data/incidents.csv|data/incident_id_registry.csv|data/snapshot.json|assets/data/[^/]+\.json)$' || true)"
          test -z "$unexpected" || { echo "$unexpected"; exit 1; }
          ! git diff --name-only | grep -qx 'data/items.csv'
      - name: Commit replay
        run: |
          git config user.name cyberwatch-bot
          git config user.email cyberwatch-bot@users.noreply.github.com
          git add data/incidents.csv data/incident_id_registry.csv data/snapshot.json assets/data
          git commit -m 'Publish final certified dedup replay'
          git push origin HEAD:agent/dedup-closeout
