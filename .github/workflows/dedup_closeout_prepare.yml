name: Dedup Closeout Prepare

on:
  push:
    branches: [codex/dedup-closeout]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Migrate stable golden refs
        run: python scripts/migrate_dedup_golden_refs.py --output /tmp/dedup_golden.csv
      - name: Verify migrated golden
        run: python scripts/evaluate_dedup_golden.py --golden /tmp/dedup_golden.csv --require-stable-refs
      - name: Run closeout unit tests
        run: python -m pytest tests/test_dedup_golden_refs.py tests/test_dedup_metrics.py tests/test_dedup_golden_integrity.py -q
      - uses: actions/upload-artifact@v4
        with:
          name: dedup-golden-migrated
          path: /tmp/dedup_golden.csv
          if-no-files-found: error
