name: Integrate Veille LLM once

on:
  push:
    branches: [main]
    paths:
      - ".github/integrate-veillellm-trigger"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Intégrer la source et le filtre
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/integrate_veillellm.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from textwrap import dedent\n',
              'from textwrap import dedent, indent\n',
              1,
          )
          text = text.replace(
              "    dedent('''\\\n        replacement_source_ids = {",
              "    indent(dedent('''\\\n        replacement_source_ids = {",
              1,
          )
          text = text.replace(
              "''').replace(\"\\n\", \"\\n        \", 1).rstrip() + \"\\n\",\n)\n\nreplace_once(\n    \"cyberwatch/site.py\"",
              "'''), \"        \"),\n)\n\nreplace_once(\n    \"cyberwatch/site.py\"",
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          python .github/scripts/integrate_veillellm.py
          python -m py_compile cyberwatch/collectors/veillellm.py cyberwatch/dedup.py cyberwatch/runner.py cyberwatch/site.py
      - name: Tests avant collecte
        run: |
          python -m pytest tests/ -q
          node --check assets/app.js
          node --check assets/app-legacy.js
          node --check assets/dashboard-audit.js
      - name: MAJ complète avec Veille LLM
        run: python -m cyberwatch maj --layers all --as-of 2026-08-15T11:23:00+04:00
      - name: Contrôles finaux
        run: |
          python -m cyberwatch check
          python -m cyberwatch test-repeat
          python -m cyberwatch build-site
          python - <<'PY'
          import json
          from cyberwatch import store

          items = store.load_items()
          llm = [item for item in items if item.Source_ID == 'VEILLE_LLM']
          assert len(llm) == 6, len(llm)
          assert all(item.Organisation_Raw not in {'Commune de Ouangani', 'Le Quotidien de La Réunion'} for item in llm)

          with open('assets/data/status.json', encoding='utf-8') as f:
              status = json.load(f)
          counts = status.get('counts', {})
          assert counts.get('ok') == 9, counts
          assert counts.get('partial') == 0 and counts.get('fail') == 0, counts

          with open('assets/data/incidents.json', encoding='utf-8') as f:
              incidents = json.load(f)
          tagged = [row for row in incidents if 'veille_llm' in row.get('provenance_tags', [])]
          assert tagged, 'aucun incident taggé veille_llm'
          mamoudzou = [
              row for row in tagged
              if 'mamoudzou' in row.get('org', '').lower() and row.get('date') == '2026-06-11'
          ]
          assert mamoudzou, 'Mamoudzou non relié à Veille LLM'
          direct = {'JOURNAL_DE_MAYOTTE', 'KWEZI_NUMERIQUE', 'MAYOTTE_HEBDO_NUMERIQUE'}
          assert direct <= set(mamoudzou[0].get('sources', [])), mamoudzou[0]
          assert 'VEILLE_LLM' not in mamoudzou[0].get('sources', []), mamoudzou[0]
          print(
              f"VEILLE_LLM_ITEMS={len(llm)} TAGGED_INCIDENTS={len(tagged)} "
              f"SOURCES_OK={counts.get('ok')} MAMOUDZOU_SOURCES={mamoudzou[0]['sources']}"
          )
          PY
      - name: Commit et push
        run: |
          git config user.name "cyberwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/integrate-veillellm-once.yml
          rm -f .github/integrate-veillellm-trigger
          rm -f .github/scripts/integrate_veillellm.py
          git add -A
          git commit -m "feat: integrate Veille LLM source"
          git pull --rebase origin main
          git push origin HEAD:main
