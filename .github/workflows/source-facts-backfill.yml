name: SOURCE FACTS BACKFILL

on:
  workflow_dispatch:
    inputs:
      max_items:
        description: "Nombre maximal d'incidents distincts récents"
        type: number
        default: 100
      max_llm_calls:
        description: "Plafond total strict des appels SourceFacts"
        type: number
        default: 500
      item_ids:
        description: "Item_ID optionnels, séparés par des virgules (un par incident)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: cyberwatch-data-write
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rattraper les faits éditoriaux récents
        env:
          OPENAI_API_KEY: ${{ secrets.Cyberwatchapi }}
          PYTHONPATH: "."
          LLM_MAX_CALLS_PER_RUN: "${{ inputs.max_llm_calls }}"
          LLM_MAX_COST_USD_PER_RUN: "0.50"
          SOURCE_FACTS_AI_MAX_CALLS_PER_RUN: "${{ inputs.max_llm_calls }}"
          SOURCE_FACTS_AI_MAX_COST_USD_PER_RUN: "0.50"
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.item_ids }}" ]; then
            python scripts/backfill_source_fact_summaries.py \
              --max-items "${{ inputs.max_items }}" --item-ids "${{ inputs.item_ids }}" --include-existing --refresh-complete | tee /tmp/source-facts-backfill.json
          else
            python scripts/backfill_source_fact_summaries.py \
              --max-items "${{ inputs.max_items }}" --latest-incidents --include-existing --retry-abstained --refresh-complete | tee /tmp/source-facts-backfill.json
          fi
          cat /tmp/source-facts-backfill.json >> "$GITHUB_STEP_SUMMARY"
      - name: Proposer les secteurs à confirmer
        # Les descriptions d'activité, extraites et citées depuis l'article
        # pendant le rattrapage précédent, sont le seul contexte transmis à
        # ce classifieur. Son résultat reste TENTATIVE : il n'alimente jamais
        # les statistiques ni le secteur canonique sans preuve indépendante.
        env:
          OPENAI_API_KEY: ${{ secrets.Cyberwatchapi }}
          LLM_MAX_CALLS_PER_RUN: "30"
          LLM_MAX_COST_USD_PER_RUN: "0.10"
          LLM_ORGANISATION_SECTOR_MAX_CALLS_PER_RUN: "30"
          LLM_ORGANISATION_SECTOR_MAX_COST_USD_PER_RUN: "0.10"
        run: |
          python -m cyberwatch sector-llm | tee /tmp/organisation-sector-backfill.txt
          python -m cyberwatch replay
          cat /tmp/organisation-sector-backfill.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Valider et construire le site
        run: |
          python -m pytest tests/test_fact_resolution.py tests/test_source_facts_ai.py tests/test_targeted_source_facts_backfill.py -q
          node --check assets/shared.js
          node --check assets/dashboard-v2.js
          python -m cyberwatch check
          python -m cyberwatch build-site
          # Le replay de secteur peut régénérer les incidents : rematérialiser
          # le rapport à partir des faits persistés avant le gate final.
          PYTHONPATH=. python scripts/report_source_fact_coverage.py
          PYTHONPATH=. python scripts/audit_publication_contract.py
      - name: Publier les données générées
        run: |
          git config user.name "cyberwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/data
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "data: rattrapage des synthèses"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
