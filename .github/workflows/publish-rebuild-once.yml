name: Publish validated rebuild (one-shot)

on:
  push:
    branches: [main]
    paths:
      - ".github/publish-rebuild-request"

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-validated-rebuild
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Ya7o/Cyberwatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REBUILD_RUN_ID: "31993366498"
      EXPECTED_ITEMS_HASH: "fb174524d1691b388dcf1f062d0081049781d0d38da680db9be6aaf200010213"
      EXPECTED_INCIDENTS_HASH: "7ff132a455eb64b39db183dca8bbd6136593d373af8a3e2deb389d1ebfb03ff3"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation dependencies
        run: pip install -r requirements.txt

      - name: Download validated rebuild artifact
        run: |
          rm -rf /tmp/rebuild
          mkdir -p /tmp/rebuild
          gh run download "$REBUILD_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name rebuild-baseline-output \
            --dir /tmp/rebuild

      - name: Copy generated state only
        run: |
          install -m 0644 /tmp/rebuild/data/items.csv data/items.csv
          install -m 0644 /tmp/rebuild/data/incidents.csv data/incidents.csv
          install -m 0644 /tmp/rebuild/data/source_facts.csv data/source_facts.csv
          install -m 0644 /tmp/rebuild/data/run_log.csv data/run_log.csv
          install -m 0644 /tmp/rebuild/data/run_sources.csv data/run_sources.csv
          install -m 0644 /tmp/rebuild/data/ai_usage.csv data/ai_usage.csv
          install -m 0644 /tmp/rebuild/data/ai_qualifications.csv data/ai_qualifications.csv
          install -m 0644 /tmp/rebuild/data/org_enrichment_cache.csv data/org_enrichment_cache.csv
          install -m 0644 /tmp/rebuild/data/source_facts_ai_usage.json data/source_facts_ai_usage.json
          install -m 0644 /tmp/rebuild/data/snapshot.json data/snapshot.json
          install -m 0644 /tmp/rebuild/data/baseline.json data/baseline.json
          install -m 0644 /tmp/rebuild/data/entity_watch.csv data/entity_watch.csv
          install -m 0644 /tmp/rebuild/data/sources.csv data/sources.csv
          mkdir -p assets/data
          install -m 0644 /tmp/rebuild/assets/data/incidents.json assets/data/incidents.json
          install -m 0644 /tmp/rebuild/assets/data/status.json assets/data/status.json

      - name: Validate exact rebuilt corpus
        run: |
          python - <<'PY'
          from cyberwatch import identity, store
          from cyberwatch.dedup import build_incidents

          items = store.load_items()
          incidents = store.load_incidents()
          rebuilt = build_incidents(items)
          items_hash = identity.items_hash(items)
          incidents_hash = identity.incidents_hash(incidents)
          rebuilt_hash = identity.incidents_hash(rebuilt)
          assert len(items) == 1003, len(items)
          assert len(incidents) == 856, len(incidents)
          assert items_hash == "fb174524d1691b388dcf1f062d0081049781d0d38da680db9be6aaf200010213", items_hash
          assert incidents_hash == "7ff132a455eb64b39db183dca8bbd6136593d373af8a3e2deb389d1ebfb03ff3", incidents_hash
          assert rebuilt_hash == incidents_hash, (rebuilt_hash, incidents_hash)
          print("Validated rebuild: 1003 items / 856 incidents")
          PY
          python -m cyberwatch check
          python -m cyberwatch test-repeat
          python scripts/audit_data_quality.py \
            --items data/items.csv \
            --source-facts data/source_facts.csv \
            --check \
            --check-regression

      - name: Commit and rebase safely
        run: |
          git config user.name "cyberwatch-bot"
          git config user.email "cyberwatch-bot@users.noreply.github.com"
          git add \
            data/items.csv data/incidents.csv data/source_facts.csv \
            data/run_log.csv data/run_sources.csv data/ai_usage.csv \
            data/ai_qualifications.csv data/org_enrichment_cache.csv \
            data/source_facts_ai_usage.json data/snapshot.json data/baseline.json \
            data/entity_watch.csv data/sources.csv \
            assets/data/incidents.json assets/data/status.json
          git commit -m "data: publish validated clean rebuild 2026-08-17"
          git pull --rebase origin main

      - name: Revalidate after rebase
        run: |
          python -m cyberwatch check
          python -m cyberwatch test-repeat
          python scripts/audit_data_quality.py \
            --items data/items.csv \
            --source-facts data/source_facts.csv \
            --check \
            --check-regression
          python - <<'PY'
          from cyberwatch import identity, store
          assert identity.items_hash(store.load_items()) == "fb174524d1691b388dcf1f062d0081049781d0d38da680db9be6aaf200010213"
          assert identity.incidents_hash(store.load_incidents()) == "7ff132a455eb64b39db183dca8bbd6136593d373af8a3e2deb389d1ebfb03ff3"
          PY

      - name: Publish atomically
        run: git push origin HEAD:main
