name: Rich Facts Platform

on:
  pull_request:
    paths:
      - 'cyberwatch/rich_facts*.py'
      - 'cyberwatch/collectors/*rich*.py'
      - 'cyberwatch/collectors/feed.py'
      - 'scripts/audit_rich_facts_platform.py'
      - 'tests/test_rich_facts*.py'
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generic rich-facts tests
        run: python -m pytest tests/test_rich_facts_platform.py tests/test_rich_facts_consolidation.py tests/test_cyberattaque_corpus_v2.py -q
      - name: Platform audit
        run: python scripts/audit_rich_facts_platform.py
