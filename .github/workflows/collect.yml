name: COLLECT

on:
  schedule:
    # Collecte quotidienne : 11:00 à La Réunion (UTC+4).
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: "MAJ collecte les dernières publications ; PURGE vide la base."
        type: choice
        default: MAJ
        options:
          - MAJ
          - PURGE

permissions:
  contents: write
  issues: write

concurrency:
  group: cyberwatch-data-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CYBERWATCH_RUN_TRIGGER: ${{ github.event_name }}
      CYBERWATCH_BASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Collecter
        if: github.event_name != 'workflow_dispatch' || inputs.operation != 'PURGE'
        env:
          OPENAI_API_KEY: ${{ secrets.Cyberwatchapi }}
          # Plafond partagé par l'enrichissement et la déduplication.
          # Plafond partagé par l'enrichissement, la déduplication et le
          # mapper sectoriel. Relevé de 0.03 à 0.035 : le run du 11/09 a
          # consommé 0.0260 en source_facts seul, et le mapper s'exécute
          # après — sans marge il serait coupé en budget_blocked.
          LLM_MAX_COST_USD_PER_RUN: "0.035"
          DEDUP_AI_DAILY_ENABLED: "1"
        run: python -m cyberwatch maj
      - name: Purger la base
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'PURGE'
        run: python -m cyberwatch purge
      - name: Valider
        run: |
          python -m cyberwatch check
          python -m cyberwatch validate-business
      - name: Suivre la production
        if: github.event_name != 'workflow_dispatch' || inputs.operation != 'PURGE'
        id: production_health
        run: python -m cyberwatch production-status --markdown --github-output | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Résumé du run
        shell: bash
        env:
          OPERATION: ${{ inputs.operation || 'MAJ' }}
        run: |
          echo "## Cyberwatch — $OPERATION" >> "$GITHUB_STEP_SUMMARY"
          if [ "$OPERATION" = "PURGE" ]; then
            echo "Base vidée : 0 item, 0 incident. Prochaine MAJ : hier et aujourd'hui." >> "$GITHUB_STEP_SUMMARY"
          else
            python -m cyberwatch report >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publier les données sur main
        run: |
          git config user.name "cyberwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$CYBERWATCH_BASE_COMMIT" ]; then
            echo "::error::main a changé pendant la collecte ; publication annulée."
            exit 1
          fi
          git add data assets/data
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "data: mise à jour du corpus"
          git push origin HEAD:main
      - name: Notifier l'état de production
        if: always() && (inputs.operation != 'PURGE' || failure())
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          HEALTH_ALERT: ${{ steps.production_health.outputs.alert }}
          HEALTH_REASONS: ${{ steps.production_health.outputs.alert_reasons }}
        run: bash .github/scripts/manage-production-alert.sh
