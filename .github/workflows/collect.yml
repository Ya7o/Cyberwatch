name: COLLECT

on:
  schedule:
    # Collecte quotidienne : 11:00 à La Réunion (UTC+4).
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cyberwatch-data-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Collecter
        env:
          OPENAI_API_KEY: ${{ secrets.Cyberwatchapi }}
          # Plafond partagé par l'enrichissement et la déduplication.
          LLM_MAX_COST_USD_PER_RUN: "0.03"
          DEDUP_AI_DAILY_ENABLED: "1"
        run: python -m cyberwatch maj
      - name: Valider
        run: python -m cyberwatch check
      - name: Résumé du run
        shell: bash
        run: |
          echo "## Cyberwatch — MAJ quotidienne" >> "$GITHUB_STEP_SUMMARY"
          python -m cyberwatch report >> "$GITHUB_STEP_SUMMARY"
      - name: Publier les données sur main
        run: |
          git config user.name "cyberwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/data
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "data: collecte"
          git pull --rebase origin main
          git push origin HEAD:main
