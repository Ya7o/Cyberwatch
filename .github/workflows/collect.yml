name: COLLECT

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Commande"
        type: choice
        default: maj
        options: [maj, create, diagnose, replay, probe, probe-media]
      layers:
        description: "Couches"
        type: string
        default: all
      start:
        description: "Début AAAA-MM-JJ (optionnel)"
        type: string
        default: ""
      as_of:
        description: "Cutoff ISO 8601 (optionnel)"
        type: string
        default: ""
      source:
        description: "Source_ID/domaines pour probe"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: cyberwatch-data-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Déterminer le run
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "layers=${{ inputs.layers }}" >> "$GITHUB_OUTPUT"
            echo "start=${{ inputs.start }}" >> "$GITHUB_OUTPUT"
            echo "as_of=${{ inputs.as_of }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=maj" >> "$GITHUB_OUTPUT"
            echo "layers=all" >> "$GITHUB_OUTPUT"
            echo "start=" >> "$GITHUB_OUTPUT"
            echo "as_of=" >> "$GITHUB_OUTPUT"
          fi
      - name: Collecter
        env:
          OPENAI_API_KEY: ${{ secrets.Cyberwatchapi }}
          ORG_ENRICHMENT_ENABLED: "0"
          CYBERWATCH_INCREMENTAL_QUALIFICATION: ${{ steps.scope.outputs.mode == 'maj' && '1' || '0' }}
          # Filet LLM post-déterministe de déduplication (§Lot 18) : un seul
          # batch au plus par MAJ réelle. Jamais activé pour replay/diagnose/
          # probe/probe-media/create — voir runner.run_daily_dedup_net, qui
          # ne se déclenche de toute façon que pour MODE_MAJ non hors-ligne.
          DEDUP_AI_DAILY_ENABLED: ${{ steps.scope.outputs.mode == 'maj' && '1' || '0' }}
        shell: bash
        run: |
          ARGS=""
          [ -n "${{ steps.scope.outputs.start }}" ] && ARGS="$ARGS --start ${{ steps.scope.outputs.start }}"
          [ -n "${{ steps.scope.outputs.as_of }}" ] && ARGS="$ARGS --as-of ${{ steps.scope.outputs.as_of }}"
          MODE="${{ steps.scope.outputs.mode }}"
          if [ "$MODE" = replay ]; then
            python -m cyberwatch replay $ARGS
          elif [ "$MODE" = probe ]; then
            for SRC in $(echo "${{ inputs.source }}" | tr ',' ' '); do python -m cyberwatch probe "$SRC" $ARGS; done
          elif [ "$MODE" = probe-media ]; then
            ONLY=""; [ -n "${{ inputs.source }}" ] && ONLY="--only ${{ inputs.source }}"
            python -m cyberwatch probe-media $ONLY $ARGS
          elif [ "$MODE" = diagnose ]; then
            python -m cyberwatch diagnose --layers "${{ steps.scope.outputs.layers }}" $ARGS
          else
            python -m cyberwatch "$MODE" --layers "${{ steps.scope.outputs.layers }}" $ARGS
          fi
          if [ "$MODE" = maj ] || [ "$MODE" = create ]; then
            # Après la collecte, les descriptions d'activité éventuellement
            # extraites par SourceFacts depuis l'article complet sont
            # disponibles. Le LLM organisationnel les mappe vers la
            # taxonomie, sans jamais renseigner le secteur canonique : il
            # alimente seulement le badge « supposé, non confirmé ».
            LLM_MAX_CALLS_PER_RUN=30 LLM_MAX_COST_USD_PER_RUN=0.10 \
              LLM_ORGANISATION_SECTOR_MAX_CALLS_PER_RUN=30 \
              LLM_ORGANISATION_SECTOR_MAX_COST_USD_PER_RUN=0.10 \
              python -m cyberwatch sector-llm
            # Le cache P1 est relu hors ligne afin de publier la proposition.
            python -m cyberwatch replay
          fi
      - name: Dev checks et dashboard
        if: steps.scope.outputs.mode != 'diagnose' && steps.scope.outputs.mode != 'probe' && steps.scope.outputs.mode != 'probe-media'
        run: |
          python -m cyberwatch check
          python -m cyberwatch build-site
          python -m cyberwatch check
      - name: Résumé du run
        if: steps.scope.outputs.mode != 'diagnose' && steps.scope.outputs.mode != 'probe' && steps.scope.outputs.mode != 'probe-media'
        shell: bash
        run: |
          echo "## Cyberwatch — ${{ steps.scope.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
          python -m cyberwatch report >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python -m cyberwatch.source_scorecard --markdown >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python -m cyberwatch.source_portfolio --markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Publier les données
        if: steps.scope.outputs.mode != 'diagnose' && steps.scope.outputs.mode != 'probe' && steps.scope.outputs.mode != 'probe-media'
        run: |
          git config user.name "cyberwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/data
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "data: collecte"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
