name: COLLECT

on:
  schedule:
    # Collecte quotidienne : 11:00 à La Réunion (UTC+4).
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Commande"
        type: choice
        default: maj
        options: [maj, create]

permissions:
  contents: write

concurrency:
  group: cyberwatch-data-write
  cancel-in-progress: false

env:
  # Le corpus de production commence ici. Aucune collecte ne réintroduit
  # d'incident antérieur.
  COLLECTION_EPOCH: "2026-08-28"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Déterminer le mode
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=maj" >> "$GITHUB_OUTPUT"
          fi
      - name: Collecter
        env:
          OPENAI_API_KEY: ${{ secrets.Cyberwatchapi }}
          ORG_ENRICHMENT_ENABLED: "0"
          # Budget logiciel total : qualification $0.02 + faits $0.05
          # + secteur $0.02 + déduplication $0.01 = $0.10 maximum.
          AI_MAX_CALLS_PER_RUN: "30"
          AI_MAX_ESTIMATED_COST_USD_PER_RUN: "0.02"
          SOURCE_FACTS_AI_MAX_CALLS_PER_RUN: "30"
          SOURCE_FACTS_AI_MAX_COST_USD_PER_RUN: "0.05"
          LLM_MAX_CALLS_PER_RUN: "31"
          LLM_MAX_COST_USD_PER_RUN: "0.03"
          LLM_ORGANISATION_SECTOR_MAX_CALLS_PER_RUN: "30"
          LLM_ORGANISATION_SECTOR_MAX_COST_USD_PER_RUN: "0.02"
          DEDUP_AI_MAX_CALLS: "1"
          DEDUP_AI_MAX_COST_USD: "0.01"
          LLM_DEDUP_MAX_CALLS_PER_RUN: "1"
          LLM_DEDUP_MAX_COST_USD_PER_RUN: "0.01"
          CYBERWATCH_INCREMENTAL_QUALIFICATION: ${{ steps.scope.outputs.mode == 'maj' && '1' || '0' }}
          DEDUP_AI_DAILY_ENABLED: "1"
        shell: bash
        run: |
          args=(--layers all)
          if [ "${{ steps.scope.outputs.mode }}" = "create" ]; then
            args+=(--start "$COLLECTION_EPOCH")
          fi
          python -m cyberwatch "${{ steps.scope.outputs.mode }}" "${args[@]}"
      - name: Valider et construire
        run: |
          python -m cyberwatch check
          python -m cyberwatch build-site
      - name: Résumé du run
        shell: bash
        run: |
          echo "## Cyberwatch — ${{ steps.scope.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
          python -m cyberwatch report >> "$GITHUB_STEP_SUMMARY"
      - name: Publier les données sur main
        run: |
          git config user.name "cyberwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/data
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "data: collecte"
          git pull --rebase origin main
          git push origin HEAD:main
