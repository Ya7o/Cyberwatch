name: SourceFacts Backfill Publish Once

on:
  push:
    branches:
      - agent/source-facts-backfill-prod-20260817
    paths:
      - '.github/workflows/source-facts-backfill-once.yml'

permissions:
  contents: write

concurrency:
  group: source-facts-backfill-prod
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout production main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load preserved backfill payload
        run: |
          git fetch origin agent/source-facts-backfill-payload-20260817
          git show FETCH_HEAD:data/source_facts_backfill_payload.json > /tmp/source_facts_incoming.json
          git show FETCH_HEAD:data/source_facts_backfill_metrics.json > /tmp/source_facts_metrics.json
          git show FETCH_HEAD:data/source_facts_ai_cache.json > /tmp/source_facts_ai_cache.generated.json
          git show FETCH_HEAD:data/source_facts_ai_usage.json > /tmp/source_facts_ai_usage.generated.json

      - name: Create isolated apply helper
        run: |
          cat > /tmp/apply_source_facts_backfill.py <<'PY'
          import json
          import subprocess
          from pathlib import Path

          from cyberwatch import site, source_facts, source_facts_ai, store

          incoming = json.loads(Path('/tmp/source_facts_incoming.json').read_text(encoding='utf-8'))
          latest_ids = {item.Item_ID for item in store.load_items()}
          incoming = [row for row in incoming if row.get('Item_ID') in latest_ids]
          store.save_source_facts(
              source_facts.merge_source_facts(store.load_source_facts(), incoming)
          )

          generated_path = Path('/tmp/source_facts_ai_cache.generated.json')
          latest_path = Path('data/source_facts_ai_cache.json')
          generated = json.loads(generated_path.read_text(encoding='utf-8'))
          try:
              latest = json.loads(latest_path.read_text(encoding='utf-8'))
          except (OSError, ValueError, TypeError):
              latest = {}

          cache_format = source_facts_ai.CACHE_FORMAT
          if generated.get('_format') == cache_format:
              if latest.get('_format') == cache_format:
                  combined = {
                      '_format': cache_format,
                      'entries': dict(latest.get('entries') or {}),
                      'legacy': dict(latest.get('legacy') or {}),
                  }
              else:
                  combined = {
                      '_format': cache_format,
                      'entries': {},
                      'legacy': dict(latest) if isinstance(latest, dict) else {},
                  }
              for key, generated_entry in (generated.get('entries') or {}).items():
                  current = combined['entries'].get(key)
                  if not isinstance(current, dict) or not isinstance(generated_entry, dict):
                      combined['entries'][key] = generated_entry
                      continue
                  merged_entry = dict(current)
                  merged_entry.update({
                      name: value for name, value in generated_entry.items() if name != 'fields'
                  })
                  fields = dict(current.get('fields') or {})
                  fields.update(generated_entry.get('fields') or {})
                  merged_entry['fields'] = fields
                  combined['entries'][key] = merged_entry
              combined['legacy'].update(generated.get('legacy') or {})
              latest_path.write_text(
                  json.dumps(combined, ensure_ascii=False, sort_keys=True, separators=(',', ':')),
                  encoding='utf-8',
              )
          else:
              latest_path.write_text(
                  json.dumps(generated, ensure_ascii=False, sort_keys=True, separators=(',', ':')),
                  encoding='utf-8',
              )

          Path('data/source_facts_ai_usage.json').write_text(
              Path('/tmp/source_facts_ai_usage.generated.json').read_text(encoding='utf-8'),
              encoding='utf-8',
          )
          site.build()

          allowed = {
              'data/source_facts.csv',
              'data/source_facts_ai_cache.json',
              'data/source_facts_ai_usage.json',
              'assets/data/incidents.json',
              'assets/data/status.json',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines())
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit('Canonical isolation violated: ' + ', '.join(unexpected))
          print('Allowed changes:', ', '.join(sorted(changed)))
          PY

      - name: Apply payload on latest main
        run: PYTHONPATH="$PWD" python /tmp/apply_source_facts_backfill.py

      - name: Validate isolated backfill
        run: |
          python -m cyberwatch check
          python -m cyberwatch test-repeat
          python scripts/audit_data_quality.py \
            --items data/items.csv \
            --source-facts data/source_facts.csv \
            --check
          node --check assets/dashboard-audit.js
          PYTHONPATH="$PWD" python /tmp/apply_source_facts_backfill.py

      - name: Publish to main
        run: |
          git config user.name "cyberwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          validate_and_commit() {
            PYTHONPATH="$PWD" python /tmp/apply_source_facts_backfill.py
            python -m cyberwatch check
            python -m cyberwatch test-repeat
            python scripts/audit_data_quality.py \
              --items data/items.csv \
              --source-facts data/source_facts.csv \
              --check
            git add data/source_facts.csv \
                    data/source_facts_ai_cache.json \
                    data/source_facts_ai_usage.json \
                    assets/data/incidents.json \
                    assets/data/status.json
            if git diff --staged --quiet; then
              return 2
            fi
            git commit -m "data: backfill SourceFacts incident enrichment"
          }

          validate_and_commit || rc=$?
          if [ "${rc:-0}" -eq 2 ]; then
            echo "Latest main already contains the SourceFacts backfill."
            exit 0
          elif [ "${rc:-0}" -ne 0 ]; then
            exit "$rc"
          fi

          for delay in 0 2 4 8 16; do
            [ "$delay" -gt 0 ] && sleep "$delay"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved; reapplying preserved payload on the new head."
            git fetch origin main
            git reset --hard origin/main
            unset rc
            validate_and_commit || rc=$?
            if [ "${rc:-0}" -eq 2 ]; then
              echo "Latest main already contains the SourceFacts backfill."
              exit 0
            elif [ "${rc:-0}" -ne 0 ]; then
              exit "$rc"
            fi
          done

          echo "Failed to publish SourceFacts backfill after race-safe retries." >&2
          exit 1
