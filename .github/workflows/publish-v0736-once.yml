name: Publish v0.7.36 (one-shot)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0736-once.yml"

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'Ya7o/Cyberwatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Publier v0.7.36
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v0.7.36 --repo "$REPO" >/dev/null 2>&1; then
            echo "v0.7.36 existe déjà" >&2
            exit 1
          fi
          gh release create v0.7.36 \
            --repo "$REPO" \
            --target a80339fe3e979ba1641397909aa879228c0e018d \
            --title "v0.7.36 — audit ciblé de déduplication" \
            --notes-file - <<'EOF'
          Amélioration conservatrice de la qualité de déduplication, sans changer les règles de fusion en production.

          - Ajoute un audit des doublons potentiellement manqués : signaux lexicaux existants et identité d'entreprise commune via Company_ID/SIREN déjà validé.
          - Ajoute un audit des fusions potentiellement abusives lorsque le rapprochement repose seulement sur le nom/alias et une proximité de 3 jours.
          - Aucun candidat n'est fusionné ou séparé automatiquement : l'audit reste strictement consultatif.
          - Ajoute `data/dedup_audit_candidates.csv`, régénéré lors des collectes ; le snapshot de release contient 169 paires candidates à examiner.
          - Ajoute des tests de non-régression pour le Company_ID partagé, les identifiants source contradictoires, les merges faibles et les dates d'événement fortes.
          - Aucun LLM ni OpenAI Search ajouté au pipeline de déduplication.
          - Validation : workflow Tests PASS sur le commit d'implémentation `69840c57a832105ee656885a4d95c01465e95452` ; le commit de release ajoute uniquement le snapshot d'audit déterministe.
          EOF

      - name: Retirer ce workflow temporaire
        if: always()
        run: |
          set -euo pipefail
          git config user.name "cyberwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-v0736-once.yml
          git commit -m "chore: remove v0.7.36 publish workflow"
          for delay in 0 2 4 8 16; do
            [ "$delay" -gt 0 ] && sleep "$delay"
            git pull --rebase origin main && git push origin HEAD:main && exit 0
          done
          echo "Échec du nettoyage du workflow de release" >&2
          exit 1
