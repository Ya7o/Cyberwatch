name: Benchmark Source Facts (one-shot)

on:
  push:
    branches: [agent/rebuild-perf]
    paths:
      - ".github/workflows/benchmark-source-facts-once.yml"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
      OPENAI_API_KEY: ${{ secrets.Cyberwatchapi }}
      AI_MAX_CALLS_PER_RUN: "0"
      SOURCE_FACTS_AI_MAX_CALLS_PER_RUN: "20"
      SOURCE_FACTS_AI_MAX_COST_USD_PER_RUN: "0.25"
      SOURCE_FACTS_AI_PROGRESS_EVERY: "5"
      SOURCE_FACTS_AI_CHECKPOINT_EVERY: "5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Benchmark FrenchBreaches — 20 appels max
        env:
          SOURCE_FACTS_AI_CACHE_PATH: /tmp/source-facts-fb-cache.json
          SOURCE_FACTS_AI_STATS_PATH: /tmp/source-facts-fb-stats.json
        run: |
          rm -f /tmp/source-facts-fb-cache.json /tmp/source-facts-fb-stats.json
          python - <<'PY'
          from cyberwatch import runner, source_facts_ai
          source_facts_ai.TARGET_SOURCES = {"FRENCHBREACHES"}
          ctx = runner.make_run_context(
              runner.MODE_CREATE,
              as_of="2026-08-16T18:45:00+04:00",
              target_start="2026-01-01",
              layers=["CORE_DIRECT"],
          )
          report = runner.execute(ctx)
          source_facts_ai._flush_runtime()
          print("FB_REPORT", len(report.items), report.overall_status, flush=True)
          print("FB_STATS", source_facts_ai.runtime_stats(), flush=True)
          PY

      - name: Benchmark Cyberattaque.org — 20 appels max
        env:
          SOURCE_FACTS_AI_CACHE_PATH: /tmp/source-facts-co-cache.json
          SOURCE_FACTS_AI_STATS_PATH: /tmp/source-facts-co-stats.json
        run: |
          rm -f /tmp/source-facts-co-cache.json /tmp/source-facts-co-stats.json
          python - <<'PY'
          from cyberwatch import runner, source_facts_ai
          source_facts_ai.reset_runtime_for_tests()
          source_facts_ai.TARGET_SOURCES = {"CYBERATTAQUE_ORG"}
          ctx = runner.make_run_context(
              runner.MODE_CREATE,
              as_of="2026-08-16T18:46:00+04:00",
              target_start="2026-01-01",
              layers=["CORE_DIRECT"],
          )
          report = runner.execute(ctx)
          source_facts_ai._flush_runtime()
          print("CO_REPORT", len(report.items), report.overall_status, flush=True)
          print("CO_STATS", source_facts_ai.runtime_stats(), flush=True)
          PY

      - name: Exporter les métriques
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-facts-benchmark
          path: |
            /tmp/source-facts-fb-stats.json
            /tmp/source-facts-co-stats.json
          if-no-files-found: warn
          retention-days: 1
