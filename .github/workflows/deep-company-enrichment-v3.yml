name: Deep company enrichment v3

on:
  push:
    paths:
      - '.github/workflows/deep-company-enrichment-v3.yml'
      - 'sources/veillellm/deep_company_enrichment_v3.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Enrich remaining unknown sectors
        run: python sources/veillellm/deep_company_enrichment_v3.py

      - name: Validate canonical and nonempty fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          sectors={"Administration / Collectivité","Santé","Éducation / Formation","Finance / Assurance","Transport / Logistique","Sport","Commerce / Distribution","Numérique / Technologie","Énergie / Utilities","Industrie / Manufacture","Construction / BTP","Services aux entreprises","Inconnu"}
          threats={"Ransomware","DDoS","Malware","Compromission de compte / messagerie","Intrusion","Fuite de données","Phishing / fraude","Incident tiers","Autre cyber","Inconnu"}
          for stem in ('cyberattaque_org_2026','frenchbreaches_2026'):
              d=json.loads(Path(f'sources/veillellm/{stem}.json').read_text(encoding='utf-8'))
              for n,x in enumerate(d['incidents'],1):
                  assert x.get('secteur') in sectors, (stem,n,'secteur',x.get('secteur'))
                  assert x.get('type_menace') in threats, (stem,n,'type_menace',x.get('type_menace'))
                  assert x.get('localisation') not in (None,'','Inconnu'), (stem,n,'localisation')
              print(stem,d['metadata'].get('company_research_v3'))
          PY

      - name: Commit enriched tables
        run: |
          git config user.name "cyberwatch-bot"
          git config user.email "cyberwatch-bot@users.noreply.github.com"
          git add sources/veillellm/cyberattaque_org_2026.csv \
                  sources/veillellm/cyberattaque_org_2026.json \
                  sources/veillellm/frenchbreaches_2026.csv \
                  sources/veillellm/frenchbreaches_2026.json
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Enrich remaining 2026 sectors from company evidence"
          git push origin HEAD:main
