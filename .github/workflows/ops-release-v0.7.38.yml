name: Ops release v0.7.38

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  create-tag:
    if: github.head_ref == 'ops/release-v0.7.38'
    runs-on: ubuntu-latest
    steps:
      - name: Create v0.7.38 on promoted production commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 25e5204d6436ef9894c6ce65cabc701056373e01
          TAG_NAME: v0.7.38
        run: |
          set -euo pipefail
          payload=$(printf '{"ref":"refs/tags/%s","sha":"%s"}' "$TAG_NAME" "$TARGET_SHA")
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs" \
            -d "$payload"
