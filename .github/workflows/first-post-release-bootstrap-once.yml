name: First post-release bootstrap v0.7.33 (one-shot)

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: first-post-release-bootstrap-v0.7.33
  cancel-in-progress: false

jobs:
  bootstrap:
    if: "github.event.head_commit.message == 'ops: fix first post-release bootstrap trigger'"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: État de production avant purge
        run: |
          echo '--- fichiers data avant purge ---'
          ls -lh data || true
          echo '--- volumétrie avant purge ---'
          python - <<'PY'
          from cyberwatch import store
          print(f'items={len(store.load_items())}')
          print(f'incidents={len(store.load_incidents())}')
          print(f'run_log={len(store.load_run_log())}')
          print(f'run_sources={len(store.load_run_sources())}')
          print(f'entity_watch={len(store.load_entity_watch())}')
          print(f'source_facts={len(store.load_source_facts())}')
          print(f'ai_qualifications={len(store.load_ai_qualifications())}')
          print(f'org_enrichment_cache={len(store.load_org_enrichment_cache())}')
          PY

      - name: Purger l'état de production reconstruisible
        run: |
          rm -f \
            data/items.csv \
            data/incidents.csv \
            data/sources.csv \
            data/run_sources.csv \
            data/run_log.csv \
            data/entity_watch.csv \
            data/source_facts.csv \
            data/snapshot.json \
            data/baseline.json \
            data/ai_qualifications.csv \
            data/ai_usage.csv \
            data/org_enrichment_cache.csv
          rm -f assets/data/*.json
          python - <<'PY'
          from cyberwatch import store
          state, details = store.snapshot_state()
          print(f'snapshot_state={state}')
          print(f'details={details}')
          assert state == store.BASE_UNINITIALIZED, (state, details)
          assert not store.load_items()
          assert not store.load_incidents()
          assert not store.load_run_log()
          assert not store.load_run_sources()
          assert not store.load_entity_watch()
          assert not store.load_source_facts()
          assert not store.load_ai_qualifications()
          assert not store.load_org_enrichment_cache()
          PY

      - name: Tests unitaires pré-bootstrap
        run: python -m pytest tests/ -q

      - name: CREATE from scratch — 2026-01-01 à maintenant
        env:
          OPENAI_API_KEY: ${{ secrets.Cyberwatchapi }}
        run: |
          AS_OF="$(TZ=Indian/Reunion date --iso-8601=seconds)"
          echo "AS_OF=$AS_OF" >> "$GITHUB_ENV"
          python -m cyberwatch create --as-of "$AS_OF" --start 2026-01-01 --layers all

      - name: Volumétrie immédiatement après CREATE
        run: |
          python - <<'PY'
          from collections import Counter
          from cyberwatch import store
          items = store.load_items()
          incidents = store.load_incidents()
          facts = store.load_source_facts()
          runs = store.load_run_log()
          per_source = Counter(i.Source_ID for i in items)
          print(f'items={len(items)}')
          print(f'incidents={len(incidents)}')
          print(f'source_facts={len(facts)}')
          print(f'run_log={len(runs)}')
          print('items_par_source:')
          for source, count in sorted(per_source.items()):
              print(f'  {source}={count}')
          if runs:
              last = runs[-1]
              print('dernier_run:')
              for key in ('Run_ID','As_Of','Mode','Items_Count','Incidents_Count','New_Items','New_Incidents','Sources_OK','Sources_PARTIAL','Sources_FAIL','Overall_Status','Requests'):
                  print(f'  {key}={last.get(key, "")}')
          PY

      - name: Check strict
        run: python -m cyberwatch check

      - name: Test de répétabilité offline
        run: python -m cyberwatch test-repeat

      - name: Créer la baseline post-release
        run: python -m cyberwatch baseline --as-of "$AS_OF"

      - name: Construire le dashboard
        run: python -m cyberwatch build-site

      - name: Check final strict
        run: python -m cyberwatch check

      - name: Publier atomiquement la nouvelle base et retirer le workflow one-shot
        run: |
          git config user.name 'cyberwatch-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/first-post-release-bootstrap-once.yml
          git add -A data assets/data .github/workflows/first-post-release-bootstrap-once.yml
          git commit -m "data: first post-release baseline v0.7.33 ${AS_OF}"
          git pull --rebase origin main
          git push origin HEAD:main
