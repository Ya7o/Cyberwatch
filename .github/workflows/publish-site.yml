name: PUBLISH SITE

on:
  push:
    branches: [main]
    paths:
      - "cyberwatch/site.py"
      - "cyberwatch/site_legacy.py"
      - "sources/veillellm/cyberattaques_reunion_mayotte_2026.json"
      - ".github/rebuild-request"
      - ".github/workflows/publish-site.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cyberwatch-data-write
  cancel-in-progress: false

jobs:
  build-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CYBERWATCH_BASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Vérifier la base
        run: python -m cyberwatch check
      - name: Régénérer le dashboard
        run: python -m cyberwatch build-site
      - name: Vérifier les résumés Veille LLM
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rows = json.loads(Path("assets/data/incidents.json").read_text(encoding="utf-8"))
          veille = [row for row in rows if "VEILLE_LLM" in (row.get("sources") or [])]
          missing = [f"{row.get('date')} — {row.get('org')}" for row in veille if not str(row.get("summary") or "").strip()]
          if missing:
              raise SystemExit("Résumés Veille LLM absents: " + " | ".join(missing))
          print(f"OK — {len(veille)} incident(s) Veille LLM avec résumé publié")
          PY
      - name: Publier les JSON du site
        run: |
          git config user.name "cyberwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$CYBERWATCH_BASE_COMMIT" ]; then
            echo "::error::main a changé pendant le build ; publication annulée."
            exit 1
          fi
          git add assets/data
          if git diff --staged --quiet; then
            echo "Aucune donnée du site à republier."
            exit 0
          fi
          git commit -m "site: régénère les données publiées"
          git push origin HEAD:main
