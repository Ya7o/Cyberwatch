name: Dedup Registry Compat Fix
on:
  push:
    branches: [agent/dedup-closeout]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/dedup-closeout
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/_fix_incident_registry_compat.py
      - run: python -m pytest tests/ -q
      - name: Commit compatibility fix
        run: |
          git config user.name "cyberwatch-bot"
          git config user.email "cyberwatch-bot@users.noreply.github.com"
          git add cyberwatch/store.py cyberwatch/cli.py
          git commit -m "Make incident registry migration-compatible"
          git push origin HEAD:agent/dedup-closeout
