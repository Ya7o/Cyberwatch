name: Sector precision development

on:
  push:
    branches: ["agent/sector-precision-release"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Appliquer les changements
        run: python scripts/_sector_precision_patch.py

      - name: Tests unitaires
        run: python -m pytest tests/ -q

      - name: Syntaxe dashboard
        run: |
          node --check assets/app.js
          node --check assets/app-legacy.js
          node --check assets/dashboard-audit.js
          node --check assets/data-sensitivity.js

      - name: Répétabilité et contrôles
        run: |
          python -m cyberwatch test-repeat
          python -m cyberwatch check --allow-uninitialized

      - name: Committer le correctif validé
        run: |
          rm .github/workflows/sector-precision-dev.yml scripts/_sector_precision_patch.py
          git config user.name "cyberwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cyberwatch/config.py cyberwatch/sector.py cyberwatch/org_enrichment.py cyberwatch/company_evidence.py tests/test_sector_stabilization.py .github/workflows/sector-precision-dev.yml scripts/_sector_precision_patch.py
          git commit -m "fix(sector): durcit la précision avant release"
          git push origin HEAD:agent/sector-precision-release
