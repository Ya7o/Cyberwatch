name: DEV cache compatibility conflict gate

on:
  push:
    branches:
      - fix/cache-compat-conflict-gate

permissions:
  contents: write

concurrency:
  group: dev-cache-conflict-gate
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[cache-conflict-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Appliquer le garde-fou de conflit
        run: python scripts/dev_strengthen_cache_compat.py
      - name: Retirer les outils temporaires
        run: rm -f scripts/dev_strengthen_cache_compat.py .github/workflows/dev-cache-conflict-gate.yml
      - name: Tests ciblés
        run: |
          python -m pytest tests/test_organisation_sector_llm.py tests/test_organisation_sector_llm_outcomes.py -q
      - name: Suite complète et contrôles
        run: |
          python -m pytest tests/ -q
          node --check assets/dashboard-v2.js
          node --check assets/dashboard-integrity.js
          python -m cyberwatch check --allow-uninitialized
          python -m cyberwatch build-site
          python -m cyberwatch check
      - name: Publier la branche
        run: |
          git config user.name "cyberwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: refuser la migration des caches sectoriels contradictoires [cache-conflict-applied]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
