name: Implement hybrid qualification v0.7.37 (one-shot)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/implement-hybrid-qualification-once.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: implement-hybrid-qualification-v0737
  cancel-in-progress: false

jobs:
  implement:
    if: github.repository == 'Ya7o/Cyberwatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PATCH_B64: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip

      - name: Synchroniser main
        run: git pull --rebase origin main

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Appliquer le patch vérifié
        run: |
          python - <<'PY'
          import base64, os, zlib
          code = zlib.decompress(base64.b64decode(os.environ["PATCH_B64"])).decode("utf-8")
          compile(code, "<hybrid-patch>", "exec")
          exec(code)
          PY
          python -m py_compile cyberwatch/source_llm_fallback.py cyberwatch/qualification.py
          ! grep -R "THREAPTS\|FRENCHBREACIES\|\[recor\]" cyberwatch/source_llm_fallback.py tests/test_source_llm_fallback.py

      - name: Validation complète avant push
        run: |
          python -m pytest tests/ -q
          node --check assets/app.js
          node --check assets/app-legacy.js
          node --check assets/dashboard-audit.js
          node --check assets/data-sensitivity.js
          python -m cyberwatch test-repeat
          python -m cyberwatch check --allow-uninitialized

      - name: Commit fonctionnel
        run: |
          git config user.name "cyberwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add guarded source LLM qualification fallback"

      - name: Rebase et revalidation
        run: |
          git pull --rebase origin main
          python -m pytest tests/ -q
          python -m cyberwatch test-repeat
          python -m cyberwatch check --allow-uninitialized

      - name: Push main
        run: git push origin HEAD:main

      - name: Release v0.7.37
        run: |
          SHA="$(git rev-parse HEAD)"
          if gh release view v0.7.37 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.7.37 existe déjà"
          else
            gh release create v0.7.37 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SHA" \
              --title "v0.7.37 — qualification hybride source LLM" \
              --notes "Qualification hybride conservatrice. Localisation : fallback seulement sur Inconnu pour FrenchBreaches/Cyberattaque.org. Secteur : fallback seulement sur Inconnu avec URL exacte et preuve externe. Menace : challengers JSON non autoritaires. Provenance dédiée. Tests complets avant push. Aucun benchmark Golden lancé ; le commit déclenche uniquement un rebuild CREATE propre."
          fi
