name: Finalize hybrid qualification v0.7.37 (one-shot)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/implement-hybrid-qualification-once.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: finalize-hybrid-qualification-v0737
  cancel-in-progress: false

jobs:
  finalize:
    if: github.repository == 'Ya7o/Cyberwatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip

      - name: Synchroniser main
        run: git pull --rebase origin main

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Raccorder provenance, persistence et rebuild
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"marqueur absent: {path}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Store : fichier auxiliaire de provenance, hors hashes canoniques.
          replace_once(
              "cyberwatch/store.py",
              "    Item,\n)\n\n# Racine du dépôt",
              "    Item,\n)\nfrom .source_llm_fallback import QUALIFICATION_PROVENANCE_COLUMNS\n\n# Racine du dépôt",
          )
          replace_once(
              "cyberwatch/store.py",
              "SOURCE_FACTS_CSV = DATA_DIR / \"source_facts.csv\"\nSNAPSHOT_JSON",
              "SOURCE_FACTS_CSV = DATA_DIR / \"source_facts.csv\"\n"
              "QUALIFICATION_PROVENANCE_CSV = DATA_DIR / \"qualification_provenance.csv\"\n"
              "SNAPSHOT_JSON",
          )
          replace_once(
              "cyberwatch/store.py",
              "def save_source_facts(rows: list[dict], path: Path | None = None) -> None:\n"
              "    write_csv(path or SOURCE_FACTS_CSV, SOURCE_FACT_COLUMNS, rows)\n\n\n"
              "def load_snapshot",
              "def save_source_facts(rows: list[dict], path: Path | None = None) -> None:\n"
              "    write_csv(path or SOURCE_FACTS_CSV, SOURCE_FACT_COLUMNS, rows)\n\n\n"
              "def load_qualification_provenance(path: Path | None = None) -> list[dict]:\n"
              "    return read_csv(path or QUALIFICATION_PROVENANCE_CSV)\n\n\n"
              "def save_qualification_provenance(rows: list[dict], path: Path | None = None) -> None:\n"
              "    write_csv(path or QUALIFICATION_PROVENANCE_CSV, QUALIFICATION_PROVENANCE_COLUMNS, rows)\n\n\n"
              "def load_snapshot",
          )

          # Runner : provenance produite par qualify(), écrite avec CREATE/MAJ.
          replace_once(
              "cyberwatch/runner.py",
              "    source_facts: list[dict] = field(default_factory=list)\n",
              "    source_facts: list[dict] = field(default_factory=list)\n"
              "    qualification_provenance: list[dict] = field(default_factory=list)\n",
          )
          replace_once(
              "cyberwatch/runner.py",
              "    report.items = qualified.items\n    report.incidents = qualified.incidents\n",
              "    report.items = qualified.items\n    report.incidents = qualified.incidents\n"
              "    report.qualification_provenance = qualified.provenance\n",
          )
          replace_once(
              "cyberwatch/runner.py",
              "        store.save_source_facts(report.source_facts)\n        save_snapshot_provenance(",
              "        store.save_source_facts(report.source_facts)\n"
              "        store.save_qualification_provenance(report.qualification_provenance)\n"
              "        save_snapshot_provenance(",
          )

          # Backfill manuel : persiste la même provenance.
          replace_once(
              "cyberwatch/cli.py",
              "    store.save_items(items)\n    store.save_incidents(incidents)\n"
              "    save_snapshot_provenance(\n        store.load_items(), store.load_incidents(), operation=\"BACKFILL_UNKNOWNS\",",
              "    store.save_items(items)\n    store.save_incidents(incidents)\n"
              "    store.save_qualification_provenance(qualified.provenance)\n"
              "    save_snapshot_provenance(\n        store.load_items(), store.load_incidents(), operation=\"BACKFILL_UNKNOWNS\",",
          )

          # Isolation tests : aucun CSV auxiliaire ne fuit vers data/ réel.
          for path in ("tests/test_runner.py",):
              replace_once(
                  path,
                  '"SOURCE_FACTS_CSV"):',
                  '"SOURCE_FACTS_CSV", "QUALIFICATION_PROVENANCE_CSV"):',
              )
          replace_once(
              "tests/test_runner.py",
              '"SOURCE_FACTS_CSV", "AI_QUALIFICATIONS_CSV", "AI_USAGE_CSV",',
              '"SOURCE_FACTS_CSV", "QUALIFICATION_PROVENANCE_CSV", "AI_QUALIFICATIONS_CSV", "AI_USAGE_CSV",',
          )
          replace_once(
              "tests/test_ai_qualification.py",
              '"SOURCE_FACTS_CSV": tmp_path / "source_facts.csv",',
              '"SOURCE_FACTS_CSV": tmp_path / "source_facts.csv",\n'
              '        "QUALIFICATION_PROVENANCE_CSV": tmp_path / "qualification_provenance.csv",',
          )

          # Rebuild : purge explicitement le nouveau jeu auxiliaire.
          replace_once(
              ".github/workflows/rebuild-baseline-once.yml",
              "            data/source_facts.csv \\\n            data/run_log.csv \\",
              "            data/source_facts.csv \\\n            data/qualification_provenance.csv \\\n            data/run_log.csv \\",
          )
          replace_once(
              ".github/workflows/rebuild-baseline-once.yml",
              "            data/incidents.csv\n            data/source_facts.csv\n          include-hidden-files:",
              "            data/incidents.csv\n            data/source_facts.csv\n"
              "            data/qualification_provenance.csv\n          include-hidden-files:",
          )

          methodology = Path("METHODOLOGY.md")
          text = methodology.read_text(encoding="utf-8")
          marker = "## Qualification hybride source LLM (v0.7.37)"
          if marker not in text:
              text += (
                  "\n\n" + marker + "\n\n"
                  "Les exports JSON versionnés `sources/veillellm` restent des challengers analytiques. "
                  "Pour `FRENCHBREACHES` et `CYBERATTAQUE_ORG`, ils peuvent compléter une "
                  "`Localisation=Inconnu` sans jamais écraser une valeur connue. Un `Secteur=Inconnu` "
                  "n'est complété que sur raccord par URL source exacte avec preuve externe conservée "
                  "dans l'export. La `Menace` n'est jamais modifiée par ces challengers. `VEILLE_LLM` "
                  "Réunion/Mayotte reste une source native distincte selon son contrat existant. Les "
                  "décisions sont journalisées dans `data/qualification_provenance.csv`.\n"
              )
              methodology.write_text(text, encoding="utf-8")

          # Déclenche uniquement le rebuild existant ; aucun benchmark Golden.
          Path(".github/rebuild-request").write_text(
              "v0.7.37 hybrid qualification rebuild\n", encoding="utf-8"
          )
          # Le workflow one-shot disparaît du commit fonctionnel.
          Path(".github/workflows/implement-hybrid-qualification-once.yml").unlink()
          PY

      - name: Validation complète avant push
        run: |
          python -m py_compile cyberwatch/source_llm_fallback.py cyberwatch/qualification.py cyberwatch/store.py cyberwatch/runner.py
          python -m pytest tests/ -q
          node --check assets/app.js
          node --check assets/app-legacy.js
          node --check assets/dashboard-audit.js
          node --check assets/data-sensitivity.js
          python -m cyberwatch test-repeat
          python -m cyberwatch check --allow-uninitialized

      - name: Commit intégration
        run: |
          git config user.name "cyberwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: persist hybrid qualification provenance"

      - name: Rebase et revalidation
        run: |
          git pull --rebase origin main
          python -m pytest tests/ -q
          python -m cyberwatch test-repeat
          python -m cyberwatch check --allow-uninitialized

      - name: Push main
        run: git push origin HEAD:main

      - name: Release v0.7.37
        run: |
          SHA="$(git rev-parse HEAD)"
          if gh release view v0.7.37 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.7.37 existe déjà"
          else
            gh release create v0.7.37 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SHA" \
              --title "v0.7.37 — qualification hybride source LLM" \
              --notes "Fallback source LLM conservateur : Localisation uniquement sur Inconnu ; Secteur uniquement sur Inconnu avec URL exacte + preuve externe ; Menace protégée. Provenance dédiée. Tests complets avant push. Aucun benchmark Golden lancé ; rebuild CREATE propre déclenché séparément."
          fi
