name: Implement hybrid qualification v0.7.37 (one-shot)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/implement-hybrid-qualification-once.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: implement-hybrid-qualification-v0737
  cancel-in-progress: false

jobs:
  implement:
    if: github.repository == 'Ya7o/Cyberwatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip

      - name: Synchroniser main
        run: git pull --rebase origin main

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Implémenter l'arbitrage hybride
        env:
          SOURCE_MODULE_B64: ""
          TEST_MODULE_B64: ""
          QUALIFICATION_B64: ""
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          def decode_env(name):
              return base64.b64decode(os.environ[name]).decode("utf-8")

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"patch marker absent in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          Path("cyberwatch/source_llm_fallback.py").write_text(
              decode_env("SOURCE_MODULE_B64"), encoding="utf-8"
          )
          Path("tests/test_source_llm_fallback.py").write_text(
              decode_env("TEST_MODULE_B64"), encoding="utf-8"
          )
          Path("cyberwatch/qualification.py").write_text(
              decode_env("QUALIFICATION_B64"), encoding="utf-8"
          )

          # Store: jeu de provenance dédié, hors identité/hashes canoniques.
          replace_once(
              "cyberwatch/store.py",
              ")\n\n# Racine du dépôt, déduite de l'emplacement du paquet.",
              ")\nfrom .source_llm_fallback import QUALIFICATION_PROVENANCE_COLUMNS\n\n"
              "# Racine du dépôt, déduite de l'emplacement du paquet.",
          )
          replace_once(
              "cyberwatch/store.py",
              "SOURCE_FACTS_CSV = DATA_DIR / \"source_facts.csv\"\n"
              "SNAPSHOT_JSON = DATA_DIR / \"snapshot.json\"",
              "SOURCE_FACTS_CSV = DATA_DIR / \"source_facts.csv\"\n"
              "QUALIFICATION_PROVENANCE_CSV = DATA_DIR / \"qualification_provenance.csv\"\n"
              "SNAPSHOT_JSON = DATA_DIR / \"snapshot.json\"",
          )
          replace_once(
              "cyberwatch/store.py",
              "def save_source_facts(rows: list[dict], path: Path | None = None) -> None:\n"
              "    write_csv(path or SOURCE_FACTS_CSV, SOURCE_FACT_COLUMNS, rows)\n\n\n"
              "def load_snapshot(path: Path | None = None) -> dict:",
              "def save_source_facts(rows: list[dict], path: Path | None = None) -> None:\n"
              "    write_csv(path or SOURCE_FACTS_CSV, SOURCE_FACT_COLUMNS, rows)\n\n\n"
              "def load_qualification_provenance(path: Path | None = None) -> list[dict]:\n"
              "    return read_csv(path or QUALIFICATION_PROVENANCE_CSV)\n\n\n"
              "def save_qualification_provenance(rows: list[dict], path: Path | None = None) -> None:\n"
              "    write_csv(path or QUALIFICATION_PROVENANCE_CSV, QUALIFICATION_PROVENANCE_COLUMNS, rows)\n\n\n"
              "def load_snapshot(path: Path | None = None) -> dict:",
          )

          # Runner: la provenance suit exactement le snapshot qualifié persisté.
          replace_once(
              "cyberwatch/runner.py",
              "    source_facts: list[dict] = field(default_factory=list)\n",
              "    source_facts: list[dict] = field(default_factory=list)\n"
              "    qualification_provenance: list[dict] = field(default_factory=list)\n",
          )
          replace_once(
              "cyberwatch/runner.py",
              "    report.items = qualified.items\n"
              "    report.incidents = qualified.incidents\n",
              "    report.items = qualified.items\n"
              "    report.incidents = qualified.incidents\n"
              "    report.qualification_provenance = qualified.provenance\n",
          )
          replace_once(
              "cyberwatch/runner.py",
              "            store.save_items(report.items)\n"
              "            store.save_incidents(report.incidents)\n"
              "            save_snapshot_provenance(",
              "            store.save_items(report.items)\n"
              "            store.save_incidents(report.incidents)\n"
              "            store.save_qualification_provenance(report.qualification_provenance)\n"
              "            save_snapshot_provenance(",
          )
          replace_once(
              "cyberwatch/runner.py",
              "        store.save_items(report.items)\n"
              "        store.save_incidents(report.incidents)\n"
              "        store.save_source_facts(report.source_facts)\n",
              "        store.save_items(report.items)\n"
              "        store.save_incidents(report.incidents)\n"
              "        store.save_source_facts(report.source_facts)\n"
              "        store.save_qualification_provenance(report.qualification_provenance)\n",
          )

          # Backfill manuel : même contrat de provenance que CREATE/MAJ/REPLAY.
          replace_once(
              "cyberwatch/cli.py",
              "    items, incidents = qualified.items, qualified.incidents\n"
              "    store.save_items(items)\n"
              "    store.save_incidents(incidents)\n"
              "    save_snapshot_provenance(",
              "    items, incidents = qualified.items, qualified.incidents\n"
              "    store.save_items(items)\n"
              "    store.save_incidents(incidents)\n"
              "    store.save_qualification_provenance(qualified.provenance)\n"
              "    save_snapshot_provenance(",
          )

          # Rebuild from scratch : ne jamais conserver une provenance d'un snapshot antérieur.
          replace_once(
              ".github/workflows/rebuild-baseline-once.yml",
              "            data/source_facts.csv \\\n"
              "            data/run_log.csv \\\n",
              "            data/source_facts.csv \\\n"
              "            data/qualification_provenance.csv \\\n"
              "            data/run_log.csv \\\n",
          )
          replace_once(
              ".github/workflows/rebuild-baseline-once.yml",
              "            data/source_facts.csv\n"
              "          include-hidden-files: true",
              "            data/source_facts.csv\n"
              "            data/qualification_provenance.csv\n"
              "          include-hidden-files: true",
          )

          # Documentation de politique : aucune modification de taxonomie/METHOD_ID.
          methodology = Path("METHODOLOGY.md")
          text = methodology.read_text(encoding="utf-8")
          marker = "## Qualification hybride source LLM (v0.7.37)"
          if marker not in text:
              text += (
                  "\n\n" + marker + "\n\n"
                  "Les exports JSON versionnés `sources/veillellm` sont des signaux analytiques "
                  "et non une vérité prioritaire. Pour `FRENCHBREACHES` et `CYBERATTAQUE_ORG`, "
                  "ils peuvent compléter une `Localisation=Inconnu` sans jamais écraser une valeur "
                  "connue. Un `Secteur=Inconnu` n'est complété que sur raccord par URL source exacte "
                  "et présence d'une preuve externe conservée dans l'export. La `Menace` n'est jamais "
                  "modifiée par ces challengers. `VEILLE_LLM` Réunion/Mayotte reste une source native "
                  "analytique distincte selon son contrat existant. Les décisions de fallback sont "
                  "journalisées dans `data/qualification_provenance.csv`.\n"
              )
              methodology.write_text(text, encoding="utf-8")

          # Le workflow temporaire disparaît du commit produit.
          Path(".github/workflows/implement-hybrid-qualification-once.yml").unlink()
          Path(".github/rebuild-request").write_text(
              "v0.7.37 hybrid qualification rebuild\n", encoding="utf-8"
          )
          PY

      - name: Validation complète avant push
        run: |
          python -m pytest tests/ -q
          node --check assets/app.js
          node --check assets/app-legacy.js
          node --check assets/dashboard-audit.js
          node --check assets/data-sensitivity.js
          python -m cyberwatch test-repeat
          python -m cyberwatch check --allow-uninitialized

      - name: Commit fonctionnel unique
        run: |
          git config user.name "cyberwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add guarded source LLM qualification fallback"

      - name: Rebase et revalidation
        run: |
          git pull --rebase origin main
          python -m pytest tests/ -q
          python -m cyberwatch test-repeat
          python -m cyberwatch check --allow-uninitialized

      - name: Push main
        run: git push origin HEAD:main

      - name: Release v0.7.37
        run: |
          SHA="$(git rev-parse HEAD)"
          if gh release view v0.7.37 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.7.37 existe déjà"
          else
            gh release create v0.7.37 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SHA" \
              --title "v0.7.37 — qualification hybride source LLM" \
              --notes "Qualification hybride conservatrice après audit Golden. Localisation : fallback automatique uniquement sur Inconnu pour FrenchBreaches/Cyberattaque.org. Secteur : fallback uniquement sur Inconnu avec URL d'incident exacte et preuve externe. Menace : challengers JSON strictement non autoritaires. Ajout d'une provenance dédiée des décisions. Tests complets exécutés avant push. Aucun benchmark Golden lancé dans cette release ; le commit déclenche uniquement un rebuild CREATE propre."
          fi
