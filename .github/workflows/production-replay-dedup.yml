name: Production Replay Dedup

on:
  push:
    branches:
      - "agent/production-replay-dedup"
    paths:
      - ".github/workflows/production-replay-dedup.yml"

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier le snapshot avant replay
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          from cyberwatch import store

          items = store.load_items()
          incidents = store.load_incidents()
          print(f"BEFORE items={len(items)} incidents={len(incidents)}")
          if len(items) != 1003 or len(incidents) != 847:
              raise SystemExit(
                  f"Snapshot inattendu avant replay: items={len(items)}, incidents={len(incidents)}"
              )

          with Path('data/incidents.csv').open(encoding='utf-8', newline='') as handle:
              rows = list(csv.DictReader(handle))
          expected = {
              'Région Occitanie': 'INC-C00BD2CCD24C',
              "Département de l’Ardèche": 'INC-0C88A26F5130',
          }
          for organisation, incident_id in expected.items():
              matches = [r for r in rows if r.get('Organisation') == organisation]
              if len(matches) != 1 or matches[0].get('Incident_ID') != incident_id:
                  raise SystemExit(f"ID historique inattendu pour {organisation}: {matches}")
          PY

      - name: Replay offline de production
        run: python -m cyberwatch replay

      - name: Vérifier la sortie
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          from cyberwatch import store

          items = store.load_items()
          incidents = store.load_incidents()
          print(f"AFTER items={len(items)} incidents={len(incidents)}")
          if len(items) != 1003 or len(incidents) != 841:
              raise SystemExit(
                  f"Résultat replay inattendu: items={len(items)}, incidents={len(incidents)}"
              )

          with Path('data/incidents.csv').open(encoding='utf-8', newline='') as handle:
              rows = list(csv.DictReader(handle))
          expected = {
              'Région Occitanie': 'INC-C00BD2CCD24C',
              "Département de l’Ardèche": 'INC-0C88A26F5130',
          }
          for organisation, incident_id in expected.items():
              matches = [r for r in rows if r.get('Organisation') == organisation]
              if len(matches) != 1 or matches[0].get('Incident_ID') != incident_id:
                  raise SystemExit(f"Incident_ID singleton modifié pour {organisation}: {matches}")
          print('PRODUCTION_REPLAY_VALIDATION=PASS')
          PY

      - name: Contrôles de répétabilité et structure
        run: |
          python -m cyberwatch test-repeat
          python -m cyberwatch check

      - name: Vérifier le périmètre du diff
        run: |
          echo "===== CHANGED FILES ====="
          git status --short
          bad="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev '^(data/(items\.csv|incidents\.csv|snapshot\.json|sources\.csv)|assets/data/.*|\.github/workflows/production-replay-dedup\.yml)$' || true)"
          if [ -n "$bad" ]; then
            echo "Fichiers hors périmètre détectés:"
            echo "$bad"
            exit 1
          fi

      - name: Committer les artefacts reconstruits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/production-replay-dedup.yml
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun changement à publier"
            exit 1
          fi
          git commit -m "Replay deduplicated incidents"
          git push origin HEAD:agent/production-replay-dedup
