<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyberwatch — redirection vers le dashboard</title>
<!--
  Filet de sécurité de publication.

  Le dashboard vit dans /docs. Si GitHub Pages est configuré pour servir le
  dossier /docs, ce fichier n'est jamais servi et n'a aucun effet. S'il sert la
  racine du dépôt — le réglage par défaut — Jekyll y afficherait le README à la
  place du dashboard : cette page redirige alors vers le bon emplacement.

  Un index.html à la racine prime sur README.md, ce qui suffit à corriger le
  cas sans modifier le moindre réglage.
-->
<meta http-equiv="refresh" content="0; url=./docs/">
<link rel="canonical" href="./docs/">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f9f9f7;
    color: #0b0b0b;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0d0d0d; color: #ffffff; }
  }
  main { text-align: center; padding: 24px; }
  a { color: #2a78d6; }
</style>
</head>
<body>
<main>
  <p>Redirection vers le dashboard…</p>
  <p><a href="./docs/">Ouvrir le dashboard Cyberwatch</a></p>
</main>
<script>location.replace("./docs/");</script>
</body>
</html>
