<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyberwatch — Observatoire cyber France / Océan Indien</title>
<meta name="description" content="Incidents cyber publiquement listés en France métropolitaine, La Réunion, Mayotte, Maurice, Madagascar, Seychelles et Comores.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">🛡️</span>
      <div>
        <h1>Cyberwatch</h1>
        <p class="brand-sub">Incidents cyber publiquement listés — France &amp; Océan Indien</p>
      </div>
    </div>
    <div class="topbar-right">
      <a class="run-pill" id="run-pill" href="#fiabilite" title="Voir l’état des sources">
        <span class="run-dot" aria-hidden="true"></span>
        <span id="run-pill-text">Chargement…</span>
      </a>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Changer de thème">
        <span data-theme-icon>◐</span>
      </button>
    </div>
  </div>
</header>

<div class="wrap">

  <section class="kpis kpis-summary" aria-label="Indicateurs clés">
    <article class="kpi">
      <h2>Incidents recensés</h2>
      <p class="kpi-value" id="kpi-incidents">—</p>
      <p class="kpi-note" id="kpi-incidents-note">événements uniques dans la base</p>
    </article>
  </section>

  <section class="quick-actions" aria-label="Actions rapides">
    <button id="f-ocean-indien" class="btn-quick" type="button" aria-pressed="false">Voir l’Océan Indien</button>
    <button id="f-auto" class="btn-quick" type="button" aria-pressed="false">Concessions automobiles</button>
    <button id="f-grande-distrib" class="btn-quick" type="button" aria-pressed="false">Grande distribution</button>
    <button id="f-presse-mahoraise" class="btn-quick" type="button" aria-pressed="false">Presse mahoraise</button>
    <button id="f-veille-llm" class="btn-quick" type="button" aria-pressed="false">Veille LLM</button>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>Incidents</h2>
      <p id="table-count" class="muted"></p>
    </div>
    <div class="table-scroll">
      <table class="data-table" id="incidents-table">
        <thead>
          <tr>
            <th data-sort="date" aria-sort="descending">Date</th>
            <th data-sort="org">Organisation</th>
            <th data-sort="location">Territoire</th>
            <th data-sort="sector">Secteur</th>
            <th data-sort="threat">Menace</th>
            <th data-sort="items">Sources</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="grid-2">
    <figure class="card">
      <figcaption>
        <h2>Incidents par mois</h2>
        <p>Date d'événement lorsqu'elle est connue, sinon date de publication.</p>
      </figcaption>
      <div class="chart" id="chart-month"></div>
    </figure>
    <figure class="card">
      <figcaption>
        <h2>Incidents par territoire</h2>
        <p>Territoire associé à l’incident.</p>
      </figcaption>
      <div class="chart" id="chart-location"></div>
    </figure>
    <figure class="card">
      <figcaption>
        <h2>Incidents par secteur</h2>
        <p>Secteur attribué lorsqu’il est connu.</p>
        <p id="sector-note" class="chart-note"></p>
      </figcaption>
      <div class="chart" id="chart-sector"></div>
    </figure>
    <figure class="card">
      <figcaption>
        <h2>Incidents par type de menace</h2>
        <p>Taxonomie à priorité fixe : un ransomware qui exfiltre reste un ransomware.</p>
      </figcaption>
      <div class="chart" id="chart-threat"></div>
    </figure>
  </section>

  <section class="card reliability" id="fiabilite" aria-labelledby="sources-title">
    <h2 id="sources-title">État des sources</h2>
    <div id="sources-list" class="sources-list" aria-live="polite"></div>

    <details id="mayotte-coverage" class="mayotte-coverage" hidden></details>

    <!-- Compatibilité avec le rendu historique : ces conteneurs restent invisibles. -->
    <span id="reliability-summary" hidden></span>
    <div id="blindspots" hidden><ul id="blindspots-list"></ul></div>
    <table id="sources-table" hidden><thead><tr></tr></thead><tbody></tbody></table>
  </section>

</div>

<div id="tooltip" class="tooltip" role="status" aria-live="polite" hidden></div>

<script src="assets/app.js"></script>
</body>
</html>
